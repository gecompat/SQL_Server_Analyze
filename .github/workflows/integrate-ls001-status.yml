name: Integrate LAB-LS-001 status

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/lab001-wave4-logshipping-ls001'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/lab001-wave4-logshipping-ls001

      - name: Apply exact scenario status transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          catalog_path = Path('Lab/Scenarios/Catalog/scenarios.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          changed = 0
          for scenario in catalog['Scenarios']:
              if scenario.get('ScenarioId') == 'LAB-LS-001':
                  if scenario.get('ImplementationStatus') not in {
                      'PLANNED_NOT_IMPLEMENTED',
                      'IMPLEMENTED_ACTIONS_GATE',
                  }:
                      raise SystemExit('Unexpected LAB-LS-001 catalog status.')
                  if scenario.get('ImplementationStatus') != 'IMPLEMENTED_ACTIONS_GATE':
                      scenario['ImplementationStatus'] = 'IMPLEMENTED_ACTIONS_GATE'
                      changed += 1
          if sum(1 for item in catalog['Scenarios'] if item.get('ScenarioId') == 'LAB-LS-001') != 1:
              raise SystemExit('LAB-LS-001 catalog row is not unique.')
          catalog_path.write_text(
              json.dumps(catalog, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          registry_path = Path('Lab/Scenarios/Infrastructure/wave4-contracts.csv')
          with registry_path.open(newline='', encoding='utf-8') as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = list(reader)
          if fieldnames is None:
              raise SystemExit('Welle 4 registry has no header.')
          matching = [row for row in rows if row['ScenarioId'] == 'LAB-LS-001']
          if len(matching) != 1:
              raise SystemExit('LAB-LS-001 registry row is not unique.')
          if matching[0]['RuntimeImplementationStatus'] not in {
              'PLANNED_NOT_IMPLEMENTED',
              'IMPLEMENTED_ACTIONS_GATE',
          }:
              raise SystemExit('Unexpected LAB-LS-001 registry status.')
          matching[0]['RuntimeImplementationStatus'] = 'IMPLEMENTED_ACTIONS_GATE'
          with registry_path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          for row in rows:
              if row['ScenarioId'] != 'LAB-LS-001' and row['RuntimeImplementationStatus'] != 'PLANNED_NOT_IMPLEMENTED':
                  raise SystemExit('An unrelated Welle 4 scenario is not planned.')
          PY

          git rm .github/workflows/integrate-ls001-status.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Lab/Scenarios/Catalog/scenarios.json \
            Lab/Scenarios/Infrastructure/wave4-contracts.csv
          git commit -m 'Mark LAB-LS-001 action implemented'
          git push origin HEAD:agent/lab001-wave4-logshipping-ls001
