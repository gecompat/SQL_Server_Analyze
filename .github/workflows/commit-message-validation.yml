name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-usage-runtime-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: SQL Server ${{ matrix.year }} framework usage matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2019
            product_major: 15
            image: mcr.microsoft.com/mssql/server:2019-latest
            compatibility: 150
            permission_test: Code/Tests/Permissions/110_SQL_Server_2019_Permission_Matrix.sql
          - year: 2022
            product_major: 16
            image: mcr.microsoft.com/mssql/server:2022-latest
            compatibility: 160
            permission_test: Code/Tests/Permissions/110_SQL_Server_2022_Permission_Matrix.sql
          - year: 2025
            product_major: 17
            image: mcr.microsoft.com/mssql/server:2025-latest
            compatibility: 170
            permission_test: Code/Tests/Permissions/110_SQL_Server_2022_Permission_Matrix.sql
    steps:
      - name: Run isolated full release and permission matrix
        shell: bash
        env:
          SQL_YEAR: ${{ matrix.year }}
          SQL_PRODUCT_MAJOR: ${{ matrix.product_major }}
          SQL_IMAGE: ${{ matrix.image }}
          SQL_COMPATIBILITY: ${{ matrix.compatibility }}
          SQL_PERMISSION_TEST: ${{ matrix.permission_test }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/complete-framework-usage-contract "https://github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          bash ./Code/Tests/Static/Temporary_Framework_Usage_Runtime_Diagnostic.sh
