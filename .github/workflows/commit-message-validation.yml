name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-usage-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose SQL Server 2022 release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare exact synthetic test copy
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/complete-framework-usage-contract "https://github.com/${GITHUB_REPOSITORY}.git" repository
          test_root="$RUNNER_TEMP/framework-usage-2022"
          mkdir -p "$test_root"
          mv repository "$test_root/repository"
          find "$test_root/repository/Code" -type f -name '*.sql' -print0 \
            | xargs -0 sed -i 's/\[DeineDatenbank\]/[FrameworkContract]/g'
          echo "TEST_ROOT=$test_root" >> "$GITHUB_ENV"

      - name: Start SQL Server 2022 and create database
        shell: bash
        run: |
          set -euo pipefail
          credential="Synthet1c!$(openssl rand -hex 16)"
          echo "::add-mask::$credential"
          printf '%s' "$credential" > "$RUNNER_TEMP/sql-credential"
          chmod 600 "$RUNNER_TEMP/sql-credential"
          docker pull --quiet mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name framework-usage-sql-2022 --memory 4g --cpus 2 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_COLLATION=SQL_Latin1_General_CP1_CS_AS \
            -e MSSQL_SA_PASSWORD="$credential" \
            -v "$TEST_ROOT/repository:/workspace:ro" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec -e SQLCMDPASSWORD="$credential" framework-usage-sql-2022 \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 10 -b -Q 'SET NOCOUNT ON; SELECT 1;' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs --tail 100 framework-usage-sql-2022; exit 1; fi
          docker exec -e SQLCMDPASSWORD="$credential" framework-usage-sql-2022 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "CREATE DATABASE [FrameworkContract] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [FrameworkContract] SET COMPATIBILITY_LEVEL = 160; ALTER DATABASE [FrameworkContract] SET QUERY_STORE = ON; ALTER DATABASE [FrameworkContract] SET QUERY_STORE (OPERATION_MODE = READ_WRITE);"

      - name: Install complete framework
        shell: bash
        run: |
          set -euo pipefail
          credential="$(cat "$RUNNER_TEMP/sql-credential")"
          docker exec -e SQLCMDPASSWORD="$credential" framework-usage-sql-2022 bash -lc '
            cd /workspace/Code/Install
            exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d FrameworkContract -b -i Install_All.sql
          ' >"$RUNNER_TEMP/install.log" 2>&1 || { echo 'INSTALL_FAILURE_BEGIN'; tail -n 160 "$RUNNER_TEMP/install.log"; echo 'INSTALL_FAILURE_END'; exit 1; }

      - name: Run release gate and report bounded failure
        shell: bash
        run: |
          set -euo pipefail
          credential="$(cat "$RUNNER_TEMP/sql-credential")"
          set +e
          docker exec -e SQLCMDPASSWORD="$credential" framework-usage-sql-2022 bash -lc '
            cd /workspace/Code/Tests
            exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d FrameworkContract -b -i Run_Release_Gate.sql
          ' >"$RUNNER_TEMP/release.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'RELEASE_GATE_FAILURE_BEGIN'
            tail -n 220 "$RUNNER_TEMP/release.log"
            echo 'RELEASE_GATE_FAILURE_END'
            exit "$status"
          fi
          grep -q 'FRAMEWORK_USAGE_RUNTIME_CONTRACT PASS' "$RUNNER_TEMP/release.log"

      - name: Remove SQL Server
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sql-credential"
          docker rm -f framework-usage-sql-2022 >/dev/null 2>&1 || true
