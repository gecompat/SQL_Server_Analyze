name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-usage-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose SQL Server 2022 release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Run compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/complete-framework-usage-contract "https://github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          bash ./Code/Tests/Static/Temporary_Framework_Usage_Runtime_Diagnostic.sh
