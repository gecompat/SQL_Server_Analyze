name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/implement-sql25-005'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/implement-sql25-005
          fetch-depth: 0
          show-progress: false
      - name: Repair SQL25-005 documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')

          p=root/'README.md'; t=p.read_text(encoding='utf-8-sig')
          old='Der aktuelle Inventory-Vertrag umfasst 98 öffentliche Procedures und 68 unterstützende Objekte: acht Views, 27 TVFs, 16 interne Procedures und 17 Tabellen. Jedes der insgesamt 166 Objekte besitzt einen eindeutigen Referenzpfad.'
          new='Der aktuelle Inventory-Vertrag umfasst 99 öffentliche Procedures und 69 unterstützende Objekte: acht Views, 28 TVFs, 16 interne Procedures und 17 Tabellen. Jedes der insgesamt 168 Objekte besitzt einen eindeutigen Referenzpfad.'
          if old not in t: raise RuntimeError('ROOT_README_INVENTORY_MARKER_NOT_FOUND')
          p.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')

          p=root/'Documentation/Architecture/SQL_Server_Lab_Example_Integration_Plan.md'; t=p.read_text(encoding='utf-8-sig')
          p.write_text(t.replace('Implementierungswelle','Umsetzungsabschnitt'),encoding='utf-8',newline='\n')

          p=root/'Documentation/Reference/Object_Reference.md'; t=p.read_text(encoding='utf-8-sig')
          t=t.replace('Stand: 2026-07-21','Stand: 2026-07-27',1)
          t=t.replace('| Table-Valued Functions (TVFs) | 27 | ein Abschnitt je TVF |','| Table-Valued Functions (TVFs) | 28 | ein Abschnitt je TVF |',1)
          marker='| [`TVF_QueryStoreWaitCategoryInfo`](#monitortvf_querystorewaitcategoryinfo) | `monitor` | `Code/01_Common/076_TVF_QueryStoreWaitCategoryInfo.sql` |\n'
          row='| [`TVF_QueryStoreReplicaRoleInfo`](#monitortvf_querystorereplicaroleinfo) | `monitor` | `Code/05_QueryStore/005_TVF_QueryStoreReplicaRoleInfo.sql` |\n'
          if row not in t:
              if marker not in t: raise RuntimeError('TVF_NAVIGATION_MARKER_NOT_FOUND')
              t=t.replace(marker,marker+row,1)
          section='''### `[monitor].[TVF_QueryStoreReplicaRoleInfo]`

Quelle: `Code/05_QueryStore/005_TVF_QueryStoreReplicaRoleInfo.sql`

| Dimension | Beschreibung |
|---|---|
| Aufgabe | Ordnet den von SQL Server 2025 gelieferten `role_type` einer stabilen Query-Store-Rollen- und Scopeklasse zu. |
| Schnittstelle | Inline TVF; Eingabe: `@RoleType tinyint`. Die Funktion liefert Rollenbezeichnung, Rollenklasse, Primary-/Secondary-/Named-Replica-Flags und eine feste Aussagegrenze. |
| Verwendung | `USP_QueryStoreReplicaAnalysis` verwendet die Funktion nach der capability-adaptiven Katalogprüfung. Ein Direktaufruf eignet sich nur für Entwicklung und Vertragstests. |
| Last und Sperren | Konstante Projektion ohne Katalog-, DMV- oder Tabellenzugriff. Die Funktion erzeugt weder I/O noch Sperren auf Benutzerdaten. |
| Vertrag | Unterstützende TVF. Die Rollenabbildung beschreibt beobachtete Query-Store-Evidenz und ist keine aktuelle Availability-Group-, Synchronitäts- oder Healthaussage. |

'''
          if '### `[monitor].[TVF_QueryStoreReplicaRoleInfo]`' not in t:
              if '## Interne Procedures\n' not in t: raise RuntimeError('TVF_SECTION_MARKER_NOT_FOUND')
              t=t.replace('## Interne Procedures\n',section+'## Interne Procedures\n',1)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
          rm -f ./Code/Tests/Static/Temporary_SQL25_005_Static_Findings.txt
          rm -f ./.github/workflows/temporary-sql25-005-static-diagnostic.yml
          rm -f ./.github/workflows/temporary-sql25-005-doc-repair.yml
          git show origin/main:.github/workflows/commit-message-validation.yml > ./.github/workflows/commit-message-validation.yml
          python3 ./Code/Tests/Static/905_Validate_Analysis_Navigator.py --repository-root .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Repair SQL25-005 documentation contracts'
          git push origin HEAD:agent/implement-sql25-005
