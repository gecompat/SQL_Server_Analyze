name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: SQL Server 2022 restored smoke release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Run compact restored smoke diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/complete-framework-usage-contract "https://github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          bash ./Code/Tests/Static/Temporary_Restored_Smoke_2022.sh
