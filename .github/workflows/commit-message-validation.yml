name: Commit message validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-message-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate direct Git commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          ref: agent/complete-framework-usage-contract
          fetch-depth: 0

      - name: Apply bounded framework usage integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/Temporary_Complete_Framework_Usage.py
          git diff --check
          if git diff --quiet; then
            echo 'Framework usage integration is already complete.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              Code/09_VersionAdaptive/500_USP_FrameworkUsageFromQueryStore.sql \
              Code/Tests/QueryStore/120_Framework_Usage_Runtime_Contract.sql \
              Code/Tests/QueryStore/110_Test_und_Abnahme_Phase4.sql \
              Code/Tests/Run_Release_Gate.sql \
              Metadata/Inventory/ObjectInventory.csv \
              Metadata/Inventory/ResultSets.csv \
              Metadata/Inventory/Module_Maturity.csv \
              Metadata/Quality/Implementation_Status.csv \
              AI_Metadata/Internal_Documentation/Quality/Next_Steps.md \
              Documentation/Analysis_Guides/Procedures/USP_FrameworkUsageFromQueryStore.md \
              Documentation/Reference/Procedure_Reference.md
            git commit -m 'Complete framework usage contract integration'
            git push origin HEAD:agent/complete-framework-usage-contract
          fi

      - name: Run commit-message validator self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/930_Validate_Commit_Message.py \
            --repository-root . \
            --delivery-mode DIRECT_GIT \
            --self-test

      - name: Validate newly introduced commits
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          arguments=(--repository-root . --delivery-mode DIRECT_GIT --head-sha "$current_head")
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0{40}$ ]]; then
            arguments+=(--base-sha "$BASE_SHA")
          fi
          python3 ./Code/Tests/Static/930_Validate_Commit_Message.py "${arguments[@]}"
