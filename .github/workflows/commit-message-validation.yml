name: Commit message validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Restore complete smoke test scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore main file and apply three targeted changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch agent/complete-framework-usage-contract "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          git fetch --quiet origin main
          git show origin/main:Code/Tests/Integration/110_Smoke_Test.sql > Code/Tests/Integration/110_Smoke_Test.sql
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Code/Tests/Integration/110_Smoke_Test.sql')
          text = path.read_text(encoding='utf-8')
          object_anchor = "(N'monitor.USP_QueryStoreAnalysis','P'),\n"
          object_addition = object_anchor + "(N'monitor.USP_FrameworkUsageFromQueryStore','P'),\n"
          if "USP_FrameworkUsageFromQueryStore','P'" not in text:
              if object_anchor not in text:
                  raise SystemExit('Query Store object anchor not found')
              text = text.replace(object_anchor, object_addition, 1)
          text = text.replace('<> 97', '<> 98', 1)
          text = text.replace('genau alle 97 öffentlichen Procedures', 'genau alle 98 öffentlichen Procedures', 1)
          help_anchor = 'EXEC [monitor].[USP_AnalysisNavigator] @Hilfe=1;\n'
          help_addition = help_anchor + 'EXEC [monitor].[USP_FrameworkUsageFromQueryStore] @Hilfe=1;\n'
          if 'USP_FrameworkUsageFromQueryStore] @Hilfe=1' not in text:
              if help_anchor not in text:
                  raise SystemExit('Navigator help anchor not found')
              text = text.replace(help_anchor, help_addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code/Tests/Integration/110_Smoke_Test.sql
          git commit -m 'Restore complete smoke test scope'
          git push --quiet origin HEAD:agent/complete-framework-usage-contract
