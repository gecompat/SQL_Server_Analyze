name: Repository privacy validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-privacy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and ZIP privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run privacy-gate self-tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "${BASE_SHA}^{commit}" || \
             ! git cat-file -e "${HEAD_SHA}^{commit}" || \
             ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
               Code/Tests/Static/910_Validate_Repository_Privacy.py \
               Metadata/Quality/Repository_Privacy_Allowlist.csv \
               .github/workflows/repository-privacy-validation.yml; then
            python3 ./Code/Tests/Static/910_Validate_Repository_Privacy.py \
              --repository-root . \
              --self-test
          else
            echo 'Privacy validator self-test not applicable to this change.'
          fi

      - name: Validate tracked repository files
        shell: bash
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/910_Validate_Repository_Privacy.py \
            --repository-root .

      - name: Build and validate delivery ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/SQL_Server_Analyze.zip"
          git archive \
            --format=zip \
            --prefix=SQL_Server_Analyze/ \
            --output="$archive_path" \
            HEAD
          python3 ./Code/Tests/Static/910_Validate_Repository_Privacy.py \
            --repository-root . \
            --archive-path "$archive_path"
