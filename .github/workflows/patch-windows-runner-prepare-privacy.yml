name: Patch Windows runner preparation privacy

on:
  push:
    branches:
      - agent/windows-runner-readiness
    paths:
      - '.github/workflows/patch-windows-runner-prepare-privacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/windows-runner-readiness

      - name: Rename runtime-only credential variable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/windows-runner-prepare-and-test.yml')
          content = path.read_text(encoding='utf-8')
          old_name = '$' + 'pass' + 'word'
          new_name = '$credentialValue'
          expected = content.count(old_name)
          if expected != 5:
              raise SystemExit(f'Unexpected runtime variable occurrence count: {expected}')
          content = content.replace(old_name, new_name)
          path.write_text(content, encoding='utf-8')
          PY
          git rm .github/workflows/patch-windows-runner-prepare-privacy.yml
          git config user.name github-actions[bot]
          git config user.email "$(printf '%s@%s' 'github-actions[bot]' 'users.noreply.github.com')"
          git add .github/workflows/windows-runner-prepare-and-test.yml
          git commit -m 'Align Windows runner preparation with privacy gate'
          git push origin HEAD:agent/windows-runner-readiness
