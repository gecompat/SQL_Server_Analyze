name: Quick-test lifecycle validation

on:
  pull_request:
    paths:
      - '.github/workflows/quicktest-lifecycle-validation.yml'
      - 'Code/Tests/Static/Validate_Docker_Podman_QuickTest_Lifecycle.py'
      - 'Lab/Install-Lab.ps1'
      - 'Lab/Uninstall-Lab.ps1'
      - 'Lab/QuickTest/**'
      - 'Lab/Validation/Invoke-LabQuickTestLifecycleTests.ps1'
      - 'Lab/Validation/Invoke-LabQuickTestStopTests.ps1'
      - 'Lab/Orchestration/Modules/DiagnosticLab/Public/Install-LabContainerFramework.ps1'
      - 'Metadata/Quality/Docker_Podman_Quick_Test_Status.json'
      - 'Metadata/Quality/Lab_External_Evidence_Gates.csv'
  push:
    branches:
      - main
      - 'agent/quicktest-*'
    paths:
      - '.github/workflows/quicktest-lifecycle-validation.yml'
      - 'Code/Tests/Static/Validate_Docker_Podman_QuickTest_Lifecycle.py'
      - 'Lab/Install-Lab.ps1'
      - 'Lab/Uninstall-Lab.ps1'
      - 'Lab/QuickTest/**'
      - 'Lab/Validation/Invoke-LabQuickTestLifecycleTests.ps1'
      - 'Lab/Validation/Invoke-LabQuickTestStopTests.ps1'
      - 'Lab/Orchestration/Modules/DiagnosticLab/Public/Install-LabContainerFramework.ps1'
      - 'Metadata/Quality/Docker_Podman_Quick_Test_Status.json'
      - 'Metadata/Quality/Lab_External_Evidence_Gates.csv'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quicktest-lifecycle-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-lifecycle:
    name: Validate synthetic quick-test lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - id: static
        name: Validate focused static lifecycle contract
        shell: bash
        run: |
          set -o pipefail
          log_path="${RUNNER_TEMP}/quicktest-lifecycle-validation.log"
          python3 ./Code/Tests/Static/Validate_Docker_Podman_QuickTest_Lifecycle.py \
            --repository-root . 2>&1 | tee "$log_path"

      - id: lifecycle
        name: Run focused lifecycle contract
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'quicktest-lifecycle-validation.log'
          try {
            & ./Lab/Validation/Invoke-LabQuickTestLifecycleTests.ps1 *>&1 |
              Tee-Object -FilePath $logPath -Append
            if (-not $?) {
              throw 'Synthetic quick-test lifecycle contract failed.'
            }
          }
          catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath -Encoding utf8
            throw
          }

      - id: stop_contract
        name: Run focused Stop lifecycle contract
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'quicktest-lifecycle-validation.log'
          try {
            & ./Lab/Validation/Invoke-LabQuickTestStopTests.ps1 *>&1 |
              Tee-Object -FilePath $logPath -Append
            if (-not $?) {
              throw 'Synthetic quick-test Stop contract failed.'
            }
          }
          catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath -Encoding utf8
            throw
          }

      - id: analyzer_install
        name: Install pinned PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force

      - id: analyzer_stop
        name: Analyze quick-test Stop lifecycle
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path ./Lab/QuickTest/Public/Stop-QuickTestLab.ps1 -Severity Error)
          if ($findings.Count -gt 0) {
            $findings | Select-Object RuleName, Severity, ScriptName, Line | Format-Table -AutoSize
            throw "Quick-test Stop analyzer reported $($findings.Count) error finding(s)."
          }

      - id: analyzer_stopped_start
        name: Analyze stopped quick-test Start lifecycle
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path ./Lab/QuickTest/Public/Start-QuickTestStoppedLab.ps1 -Severity Error)
          if ($findings.Count -gt 0) {
            $findings | Select-Object RuleName, Severity, ScriptName, Line | Format-Table -AutoSize
            throw "Stopped quick-test Start analyzer reported $($findings.Count) error finding(s)."
          }

      - id: analyzer_status
        name: Analyze quick-test Status lifecycle
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path ./Lab/QuickTest/Public/Get-QuickTestLabStatus.ps1 -Severity Error)
          if ($findings.Count -gt 0) {
            $findings | Select-Object RuleName, Severity, ScriptName, Line | Format-Table -AutoSize
            throw "Quick-test Status analyzer reported $($findings.Count) error finding(s)."
          }

      - id: analyzer_integration
        name: Analyze quick-test entrypoint and module
        shell: pwsh
        run: |
          $findings = @(
            Invoke-ScriptAnalyzer -Path ./Lab/Install-Lab.ps1 -Severity Error
            Invoke-ScriptAnalyzer -Path ./Lab/QuickTest/QuickTestLab.psm1 -Severity Error
          )
          if ($findings.Count -gt 0) {
            $findings | Select-Object RuleName, Severity, ScriptName, Line | Format-Table -AutoSize
            throw "Quick-test Stop integration analyzer reported $($findings.Count) error finding(s)."
          }

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quicktest-lifecycle-validation-log
          path: ${{ runner.temp }}/quicktest-lifecycle-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Report focused validation classification
        if: always() && github.ref_name == 'agent/quicktest-stop-lifecycle'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          STOP_OUTCOME: ${{ steps.stop_contract.outcome }}
          ANALYZER_INSTALL_OUTCOME: ${{ steps.analyzer_install.outcome }}
          ANALYZER_STOP_OUTCOME: ${{ steps.analyzer_stop.outcome }}
          ANALYZER_START_OUTCOME: ${{ steps.analyzer_stopped_start.outcome }}
          ANALYZER_STATUS_OUTCOME: ${{ steps.analyzer_status.outcome }}
          ANALYZER_INTEGRATION_OUTCOME: ${{ steps.analyzer_integration.outcome }}
        run: |
          gh issue comment 70 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Focused Stop validation outcomes for $GITHUB_SHA: static=$STATIC_OUTCOME; lifecycle=$LIFECYCLE_OUTCOME; stop=$STOP_OUTCOME; analyzer_install=$ANALYZER_INSTALL_OUTCOME; analyzer_stop=$ANALYZER_STOP_OUTCOME; analyzer_stopped_start=$ANALYZER_START_OUTCOME; analyzer_status=$ANALYZER_STATUS_OUTCOME; analyzer_integration=$ANALYZER_INTEGRATION_OUTCOME."
