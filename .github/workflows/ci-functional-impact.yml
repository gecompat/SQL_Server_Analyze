name: Functional impact CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - '.github/workflows/ci-functional-impact.yml'
      - 'Code/Tests/Static/925_Select_CI_Impact.py'
      - 'TestLab/Scenarios/OPS-008/agent-history.sql'
      - 'Code/Install/**/*.ps1'
      - 'Code/Install/**/*.py'
      - 'Code/Tests/Integration/Deployment_*.py'
      - 'Code/Tests/Integration/CI_LockTimeout_Diagnostics*.py'
      - 'Code/**/*.sql'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-functional-impact.yml'
      - 'Code/Tests/Static/925_Select_CI_Impact.py'
      - 'TestLab/Scenarios/OPS-008/agent-history.sql'
      - 'Code/Install/**/*.ps1'
      - 'Code/Install/**/*.py'
      - 'Code/Tests/Integration/Deployment_*.py'
      - 'Code/Tests/Integration/CI_LockTimeout_Diagnostics*.py'
      - 'Code/**/*.sql'
  workflow_dispatch:
    inputs:
      compatibility_matrix:
        description: 'Run impacted tests with compatibility levels 150, 160 and 170'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: functional-impact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  impact:
    name: Select functional impact
    runs-on: ubuntu-24.04
    outputs:
      run_runtime: ${{ steps.select.outputs.run_runtime }}
      full_suite: ${{ steps.select.outputs.full_suite }}
      run_release_tests: ${{ steps.select.outputs.run_release_tests }}
      permission_matrix: ${{ steps.select.outputs.permission_matrix }}
      regex_matrix: ${{ steps.select.outputs.regex_matrix }}
      plan_standalone: ${{ steps.select.outputs.plan_standalone }}
      ops008_agent_history: ${{ steps.select.outputs.ops008_agent_history }}
      compatibility_matrix: ${{ steps.select.outputs.compatibility_matrix }}
      snapshot_required: ${{ steps.snapshot.outputs.run_runtime }}
      snapshot_runtime: ${{ steps.snapshot.outputs.snapshot_runtime }}
      snapshot_concurrency: ${{ steps.snapshot.outputs.snapshot_concurrency }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - id: select
        name: Select executable SQL impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "${BASE_SHA}^{commit}" || \
             ! git cat-file -e "${HEAD_SHA}^{commit}" || \
             ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
               Code/Tests/Static/925_Select_CI_Impact.py \
               .github/workflows/ci-functional-impact.yml; then
            python3 ./Code/Tests/Static/925_Select_CI_Impact.py --self-test
          else
            echo 'Impact-selector self-test not applicable to this change.'
          fi
          python3 ./Code/Tests/Static/925_Select_CI_Impact.py \
            --repository-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --scope core \
            --github-output "$GITHUB_OUTPUT" \
            --plan-json "$RUNNER_TEMP/ci-impact.json"
          {
            echo '## Functional impact selection'
            echo '```json'
            cat "$RUNNER_TEMP/ci-impact.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - id: snapshot
        name: Select optional Snapshot impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/925_Select_CI_Impact.py \
            --repository-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --scope snapshot \
            --github-output "$GITHUB_OUTPUT" \
            --plan-json "$RUNNER_TEMP/snapshot-impact.json"
          {
            echo '## Snapshot impact selection'
            echo '```json'
            cat "$RUNNER_TEMP/snapshot-impact.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime:
    if: needs.impact.outputs.run_runtime == 'true' || needs.impact.outputs.snapshot_required == 'true'
    needs: impact
    name: SQL Server 2025 impacted runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prepare isolated SQL files
        shell: bash
        env:
          RUN_OPS008_AGENT_HISTORY: ${{ needs.impact.outputs.ops008_agent_history }}
        run: |
          set -euo pipefail
          cp -R Code "$RUNNER_TEMP/Code"
          find "$RUNNER_TEMP/Code" -type f -name '*.sql' -print0 \
            | xargs -0 perl -pi -e 's/\[DeineDatenbank\]/[SQLServerAnalyzeTest]/g'
          python3 ./Code/Tests/Integration/Deployment_Prepare_Runtime.py \
            --output "$RUNNER_TEMP/Code/Install/generated/Deployment_Runtime.generated.sql"
          if [ "$RUN_OPS008_AGENT_HISTORY" = 'true' ]; then
            mkdir -p "$RUNNER_TEMP/Code/Tests/ServerHealth"
            perl -pe 's/\[DeineDatenbank\]/[SQLServerAnalyzeTest]/g' \
              TestLab/Scenarios/OPS-008/agent-history.sql \
              > "$RUNNER_TEMP/Code/Tests/ServerHealth/OPS008_AgentHistory_CI.sql"
          fi

      - name: Build impact-selected SQLCMD runner
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/925_Select_CI_Impact.py \
            --repository-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --scope core \
            --write-runner "$RUNNER_TEMP/Code/Tests/Run_Impact_Gate.sql"

      - name: Generate ephemeral SQL credential
        shell: bash
        run: |
          set -euo pipefail
          credential="A$(openssl rand -hex 16)a1!"
          echo "::add-mask::$credential"
          echo "MSSQL_EPHEMERAL_CREDENTIAL=$credential" >> "$GITHUB_ENV"

      - name: Start SQL Server 2025 Linux
        shell: bash
        run: |
          set -euo pipefail
          image_reference='mcr.microsoft.com/mssql/server:2025-latest'
          docker pull --quiet "$image_reference" >/dev/null
          image_digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$image_reference")
          if [[ ! "$image_digest" =~ ^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$ ]]; then
            echo 'SQL Server container image digest validation failed.'
            exit 1
          fi
          echo "SQLSERVER_IMAGE_REFERENCE=$image_reference" >> "$GITHUB_ENV"
          echo "SQLSERVER_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          docker run --name sqlserver-analyze-impact-2025 \
            --hostname sqlserver-analyze-ci \
            --detach \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_COLLATION=SQL_Latin1_General_CP1_CS_AS \
            --env MSSQL_SA_PASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --volume "$RUNNER_TEMP/Code:/work/Code:ro" \
            "$image_digest" >/dev/null

      - name: Wait for SQL Server readiness
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd_path=''
          ready=0
          readiness_query="SET NOCOUNT ON; IF TRY_CONVERT(int,SERVERPROPERTY(N'ProductMajorVersion'))<>17 THROW 50000,N'VERSION_NOT_READY',1; IF CONVERT(sysname,SERVERPROPERTY(N'Collation'))<>N'SQL_Latin1_General_CP1_CS_AS' OR CONVERT(sysname,DATABASEPROPERTYEX(N'tempdb',N'Collation'))<>N'SQL_Latin1_General_CP1_CS_AS' THROW 50001,N'COLLATION_NOT_READY',1; SELECT 1;"
          for attempt in $(seq 1 120); do
            sqlcmd_path=$(docker exec sqlserver-analyze-impact-2025 bash -lc \
              "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi" \
              || true)
            if [ -n "$sqlcmd_path" ] && docker exec \
              --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              sqlserver-analyze-impact-2025 \
              "$sqlcmd_path" -S localhost -U sa -C -b -Q "$readiness_query" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 40 sqlserver-analyze-impact-2025
            exit 1
          fi
          echo "SQLCMD_PATH=$sqlcmd_path" >> "$GITHUB_ENV"

      - name: Run native deployment regression
        shell: bash
        run: |
          set -euo pipefail
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Install/generated \
            sqlserver-analyze-impact-2025 \
            "$SQLCMD_PATH" -S localhost -U sa -C -b \
            -i Deployment_Runtime.generated.sql \
            >"$RUNNER_TEMP/sqlserver-analyze-deployment-runtime.log" 2>&1; then
            echo 'Native deployment regression failed.'
            grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "$RUNNER_TEMP/sqlserver-analyze-deployment-runtime.log" | tail -n 160 || true
            exit 1
          fi

      - name: Qualify changed CI lock diagnostics
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci-functional-impact.yml \
            Code/Tests/Integration/CI_LockTimeout_Diagnostics.py \
            Code/Tests/Integration/CI_LockTimeout_Diagnostics_Tests.py; then
            python3 ./Code/Tests/Integration/CI_LockTimeout_Diagnostics_Tests.py
            timeout 60s python3 ./Code/Tests/Integration/CI_LockTimeout_Diagnostics_Tests.py \
              --sql-probe "$SQLCMD_PATH" --artifacts "$RUNNER_TEMP/ci-lock-probe"
          fi

      - name: Run impacted contracts
        shell: bash
        env:
          AUTO_COMPATIBILITY_MATRIX: ${{ needs.impact.outputs.compatibility_matrix }}
          MANUAL_COMPATIBILITY_MATRIX: ${{ github.event_name == 'workflow_dispatch' && inputs.compatibility_matrix }}
          LABELED_COMPATIBILITY_MATRIX: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:compatibility-matrix') }}
          RUN_RELEASE_TESTS: ${{ needs.impact.outputs.run_release_tests }}
          RUN_PERMISSION_MATRIX: ${{ needs.impact.outputs.permission_matrix }}
          RUN_REGEX_MATRIX: ${{ needs.impact.outputs.regex_matrix }}
        run: |
          set -euo pipefail
          levels=(170)
          if [ "$AUTO_COMPATIBILITY_MATRIX" = 'true' ] || \
             [ "$MANUAL_COMPATIBILITY_MATRIX" = 'true' ] || \
             [ "$LABELED_COMPATIBILITY_MATRIX" = 'true' ]; then
            levels=(150 160 170)
          fi

          for compatibility_level in "${levels[@]}"; do
            log_prefix="$RUNNER_TEMP/sqlserver-analyze-cl-${compatibility_level}"
            docker exec \
              --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              sqlserver-analyze-impact-2025 \
              "$SQLCMD_PATH" -S localhost -U sa -C -b -Q \
              "IF DB_ID(N'SQLServerAnalyzeTest') IS NOT NULL BEGIN ALTER DATABASE [SQLServerAnalyzeTest] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [SQLServerAnalyzeTest]; END; CREATE DATABASE [SQLServerAnalyzeTest] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [SQLServerAnalyzeTest] SET COMPATIBILITY_LEVEL = ${compatibility_level};" \
              >"${log_prefix}-database.log" 2>&1

            if ! docker exec \
              --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              --workdir /work/Code/Install \
              sqlserver-analyze-impact-2025 \
              "$SQLCMD_PATH" -S localhost -U sa -C -b -i Install_All.sql \
              >"${log_prefix}-install.log" 2>&1; then
              echo "Framework installation failed for compatibility level ${compatibility_level}."
              grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "${log_prefix}-install.log" | tail -n 120 || true
              exit 1
            fi

            if [ "$RUN_RELEASE_TESTS" = 'true' ]; then
              impact_result=0
              python3 ./Code/Tests/Integration/CI_LockTimeout_Diagnostics.py \
                --sqlcmd "$SQLCMD_PATH" --log "${log_prefix}-impact.log" \
                --artifacts "$RUNNER_TEMP/ci-lock-diagnostics" || impact_result=$?
              if [ "$impact_result" != '0' ]; then
                echo "Impact gate failed for compatibility level ${compatibility_level}."
                grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "$RUNNER_TEMP/ci-lock-diagnostics/impact.log" | tail -n 160 || true
                exit "$impact_result"
              fi
            fi

            if [ "$compatibility_level" = '170' ] && [ "$RUN_PERMISSION_MATRIX" = 'true' ]; then
              if ! docker exec \
                --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
                --workdir /work/Code/Tests \
                sqlserver-analyze-impact-2025 \
                "$SQLCMD_PATH" -S localhost -U sa -C -b \
                -v PermissionMatrixPassword="$MSSQL_EPHEMERAL_CREDENTIAL" ExpectedMajorVersion=17 \
                -i Permissions/110_SQL_Server_2022_Permission_Matrix.sql \
                >"${log_prefix}-permissions.log" 2>&1; then
                echo 'Permission matrix failed for SQL Server 2025.'
                grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "${log_prefix}-permissions.log" | tail -n 160 || true
                exit 1
              fi
            fi

            if [ "$compatibility_level" = '170' ] && [ "$RUN_REGEX_MATRIX" = 'true' ]; then
              if ! docker exec \
                --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
                --workdir /work/Code/Tests \
                sqlserver-analyze-impact-2025 \
                "$SQLCMD_PATH" -S localhost -U sa -C -b \
                -i VersionAdaptive/120_SQL_Server_2025_Regex_Matrix.sql \
                >"${log_prefix}-regex.log" 2>&1; then
                echo 'Regex matrix failed for SQL Server 2025.'
                grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "${log_prefix}-regex.log" | tail -n 160 || true
                exit 1
              fi
            fi

          done

          {
            echo '## Functional runtime'
            echo '- Engine: SQL Server 2025 Developer on Linux'
            echo "- Compatibility levels: ${levels[*]}"
            echo '- Scope: impact-selected tests plus required special contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run isolated OPS-008 Agent history fixture
        if: needs.impact.outputs.ops008_agent_history == 'true'
        shell: bash
        run: |
          set -euo pipefail
          guard_log="$RUNNER_TEMP/ops008-agent-history-guard.log"
          fixture_log="$RUNNER_TEMP/ops008-agent-history-fixture.log"
          safe_report_failure() {
            local log_path="$1"
            local stage="$2"
            local sql_error='UNCLASSIFIED'
            local calendar_case='NONE'
            local table_rows='NONE'
            local json_rows='NONE'
            local json_keyset='NONE'
            local json_value_mask='NONE'
            local error_match
            local case_match
            local diagnostic_match
            local diagnostic_case
            local parsed_mask
            local allowed_errors='54943|54944|54945|54946|54947|54948|55155|55197|55198|55199|56214|56215|56216|56217|56218|56219|56220|56221|56222|56223|56230|56231|56232|56233|56234'
            error_match=$(grep -Eo "Msg (${allowed_errors})," "$log_path" | tail -n 1 || true)
            if [ -n "$error_match" ]; then
              sql_error=$(printf '%s' "$error_match" | sed -E 's/^Msg ([0-9]+),$/\1/')
            fi
            case_match=$(grep -Eo 'OPS-008 AgentJobs-TABLE (schema|metadata|row-count|JSON-parity|known-row) case ordinal: [0-9]+' \
              "$log_path" | tail -n 1 || true)
            if [ -n "$case_match" ]; then
              local parsed_case
              parsed_case=$(printf '%s' "$case_match" | awk '{print $NF}')
              if [[ "$parsed_case" =~ ^([1-9]|1[0-2])$ ]]; then
                calendar_case="$parsed_case"
              fi
            fi
            if [ "$sql_error" = '56221' ]; then
              diagnostic_match=$(grep -Eo 'OPS-008 AgentJobs-TABLE row-count case ordinal: (1[0-2]|[1-9]) TABLE_ROWS=(ZERO|ONE|OTHER)' \
                "$log_path" | tail -n 1 || true)
              if [ -n "$diagnostic_match" ]; then
                diagnostic_case=$(printf '%s' "$diagnostic_match" | awk '{print $6}')
                if [ "$diagnostic_case" = "$calendar_case" ]; then
                  table_rows=$(printf '%s' "$diagnostic_match" | sed -E 's/.* TABLE_ROWS=(ZERO|ONE|OTHER)$/\1/')
                fi
              fi
            elif [ "$sql_error" = '56223' ]; then
              diagnostic_match=$(grep -Eo 'OPS-008 AgentJobs-TABLE JSON-parity case ordinal: (1[0-2]|[1-9]) TABLE_ROWS=(ZERO|ONE|OTHER) JSON_ROWS=(ZERO|ONE|OTHER) JSON_KEYSET=(MATCH|MISMATCH) JSON_VALUE_MASK=(0|[1-9][0-9]*)' \
                "$log_path" | tail -n 1 || true)
              if [ -n "$diagnostic_match" ]; then
                diagnostic_case=$(printf '%s' "$diagnostic_match" | awk '{print $6}')
                if [ "$diagnostic_case" = "$calendar_case" ]; then
                  table_rows=$(printf '%s' "$diagnostic_match" | sed -E 's/.* TABLE_ROWS=(ZERO|ONE|OTHER) JSON_ROWS=.*/\1/')
                  json_rows=$(printf '%s' "$diagnostic_match" | sed -E 's/.* JSON_ROWS=(ZERO|ONE|OTHER) JSON_KEYSET=.*/\1/')
                  json_keyset=$(printf '%s' "$diagnostic_match" | sed -E 's/.* JSON_KEYSET=(MATCH|MISMATCH) JSON_VALUE_MASK=.*/\1/')
                  parsed_mask=$(printf '%s' "$diagnostic_match" | sed -E 's/.* JSON_VALUE_MASK=([0-9]+)$/\1/')
                  if [[ "$parsed_mask" =~ ^(0|[1-9][0-9]{0,5})$ ]] && [ "$parsed_mask" -le 131071 ]; then
                    json_value_mask="$parsed_mask"
                  else
                    table_rows='NONE'
                    json_rows='NONE'
                    json_keyset='NONE'
                  fi
                fi
              fi
            fi
            echo "OPS008_AGENT_HISTORY_FAILED SQL_STAGE=${stage} SQL_ERROR=${sql_error} CALENDAR_CASE=${calendar_case} TABLE_ROWS=${table_rows} JSON_ROWS=${json_rows} JSON_KEYSET=${json_keyset} JSON_VALUE_MASK=${json_value_mask}"
            exit 1
          }

          guard_query="IF COALESCE(DB_NAME(),N'')<>N'SQLServerAnalyzeTest' THROW 56230,N'OPS008_WRONG_DATABASE',1; IF COALESCE(TRY_CONVERT(int,SERVERPROPERTY(N'ProductMajorVersion')),-1)<>17 THROW 56231,N'OPS008_WRONG_ENGINE',1; IF COALESCE((SELECT compatibility_level FROM sys.databases WHERE database_id=DB_ID()),-1)<>170 THROW 56232,N'OPS008_WRONG_COMPATIBILITY_LEVEL',1; IF OBJECT_ID(N'monitor.USP_AgentJobs',N'P') IS NULL OR OBJECT_ID(N'monitor.USP_AgentMonitoringAnalysis',N'P') IS NULL THROW 56234,N'OPS008_AGENT_MODULES_MISSING',1; IF EXISTS(SELECT 1 FROM sys.extended_properties WHERE class=0 AND name=N'SQLANALYZE.Ops008Disposable') THROW 56233,N'OPS008_MARKER_ALREADY_EXISTS',1; EXEC sys.sp_addextendedproperty @name=N'SQLANALYZE.Ops008Disposable',@value=1;"
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            sqlserver-analyze-impact-2025 \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -d SQLServerAnalyzeTest -Q "$guard_query" \
            >"$guard_log" 2>&1; then
            safe_report_failure "$guard_log" GUARD
          fi
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            sqlserver-analyze-impact-2025 \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -d SQLServerAnalyzeTest \
            -i /work/Code/Tests/ServerHealth/OPS008_AgentHistory_CI.sql \
            >"$fixture_log" 2>&1; then
            safe_report_failure "$fixture_log" FIXTURE
          fi
          echo 'OPS008_AGENT_HISTORY_NATIVE_PASS'

      - name: Qualify standalone Execution Plan contract
        if: needs.impact.outputs.plan_standalone == 'true'
        shell: bash
        run: |
          set -euo pipefail
          log_prefix="$RUNNER_TEMP/sqlserver-analyze-cl-170"
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            sqlserver-analyze-impact-2025 \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -Q \
            "ALTER DATABASE [SQLServerAnalyzeTest] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [SQLServerAnalyzeTest]; CREATE DATABASE [SQLServerAnalyzeTest] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [SQLServerAnalyzeTest] SET COMPATIBILITY_LEVEL = 170; ALTER DATABASE [SQLServerAnalyzeTest] SET QUERY_STORE = OFF;" \
            >"${log_prefix}-standalone-database.log" 2>&1
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Install \
            sqlserver-analyze-impact-2025 \
            "$SQLCMD_PATH" -S localhost -U sa -C -b \
            -i ../Tests/Integration/193_ExecutionPlanAnalysis_Standalone_Runtime_Contract.sql \
            >"${log_prefix}-standalone.log" 2>&1; then
            echo 'Execution Plan standalone contract failed for SQL Server 2025.'
            grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "${log_prefix}-standalone.log" | tail -n 160 || true
            exit 1
          fi

      - name: Run selected Snapshot contracts
        if: needs.impact.outputs.snapshot_required == 'true'
        shell: bash
        env:
          RUN_SNAPSHOT_RUNTIME: ${{ needs.impact.outputs.snapshot_runtime }}
          RUN_SNAPSHOT_CONCURRENCY: ${{ needs.impact.outputs.snapshot_concurrency }}
        run: |
          set -euo pipefail
          log_prefix="$RUNNER_TEMP/sqlserver-analyze-snapshot"
          sql_exec() {
            docker exec --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              --workdir /work/Code/Install sqlserver-analyze-impact-2025 \
              "$SQLCMD_PATH" -S localhost -U sa -C -b "$@"
          }
          report_failure() {
            echo "Snapshot contract failed: $1"
            grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "$2" | tail -n 120 || true
            exit 1
          }
          sql_exec -Q "IF DB_ID(N'SQLServerAnalyzeTest') IS NOT NULL BEGIN ALTER DATABASE [SQLServerAnalyzeTest] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [SQLServerAnalyzeTest]; END; CREATE DATABASE [SQLServerAnalyzeTest] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [SQLServerAnalyzeTest] SET COMPATIBILITY_LEVEL = 170; CREATE DATABASE [SQLServerAnalyzeSnapshotTest] COLLATE Latin1_General_100_CI_AS; ALTER DATABASE [SQLServerAnalyzeSnapshotTest] SET COMPATIBILITY_LEVEL = 170;" \
            >"${log_prefix}-database.log" 2>&1
          sql_exec -i Install_All.sql >"${log_prefix}-install.log" 2>&1 \
            || report_failure 'core installation' "${log_prefix}-install.log"
          sql_exec -i ../Tests/Integration/110_Smoke_Test.sql >"${log_prefix}-smoke.log" 2>&1 \
            || report_failure 'core smoke' "${log_prefix}-smoke.log"
          if [ "$RUN_SNAPSHOT_RUNTIME" = 'true' ] || [ "$RUN_SNAPSHOT_CONCURRENCY" = 'true' ]; then
            sql_exec -i ../Tests/Integration/195_SnapshotBaseline_Runtime_Contract.sql \
              >"${log_prefix}-runtime.log" 2>&1 \
              || report_failure 'runtime' "${log_prefix}-runtime.log"
          fi
          if [ "$RUN_SNAPSHOT_CONCURRENCY" = 'true' ]; then
            sql_exec -i ../Tests/Integration/196_SnapshotBaseline_Concurrency_Holder.sql \
              >"${log_prefix}-holder.log" 2>&1 &
            holder_pid=$!
            lock_ready=0
            for attempt in $(seq 1 30); do
              if sql_exec -d SQLServerAnalyzeTest -Q "IF APPLOCK_TEST(N'public',N'SQL_Server_Analyze.SC023.CollectionCycle',N'Exclusive',N'Session')<>0 THROW 53740,N'SC023_LOCK_NOT_READY',1;" >/dev/null 2>&1; then
                lock_ready=1
                break
              fi
              if ! kill -0 "$holder_pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            if [ "$lock_ready" != '1' ]; then
              wait "$holder_pid" || true
              report_failure 'concurrency holder readiness' "${log_prefix}-holder.log"
            fi
            assert_result=0
            sql_exec -i ../Tests/Integration/197_SnapshotBaseline_Concurrency_Assert.sql \
              >"${log_prefix}-concurrency.log" 2>&1 || assert_result=$?
            wait "$holder_pid" || report_failure 'concurrency holder' "${log_prefix}-holder.log"
            if [ "$assert_result" != '0' ]; then
              report_failure 'concurrency assertion' "${log_prefix}-concurrency.log"
            fi
          fi
          {
            echo '## Snapshot runtime'
            echo '- Engine: SQL Server 2025 Developer on Linux; compatibility level 170'
            echo '- Scope: selected Snapshot runtime and concurrency contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded sanitized lock diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lock-1222-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-lock-diagnostics/
            ${{ runner.temp }}/ci-lock-probe/
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop synthetic SQL Server
        if: always()
        shell: bash
        run: docker rm --force sqlserver-analyze-impact-2025 >/dev/null 2>&1 || true

  gate:
    if: always()
    needs:
      - impact
      - runtime
    name: Functional impact gate
    runs-on: ubuntu-24.04

    steps:
      - name: Confirm selected gate result
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          RUNTIME_REQUIRED: ${{ needs.impact.outputs.run_runtime }}
          SNAPSHOT_REQUIRED: ${{ needs.impact.outputs.snapshot_required }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail
          if [ "$IMPACT_RESULT" != 'success' ]; then
            echo 'CI impact selection failed.'
            exit 1
          fi
          if { [ "$RUNTIME_REQUIRED" = 'true' ] || [ "$SNAPSHOT_REQUIRED" = 'true' ]; } && [ "$RUNTIME_RESULT" != 'success' ]; then
            echo 'Required SQL Server runtime checks did not pass.'
            exit 1
          fi
          if [ "$RUNTIME_REQUIRED" != 'true' ] && [ "$SNAPSHOT_REQUIRED" != 'true' ] && [ "$RUNTIME_RESULT" != 'skipped' ]; then
            echo 'SQL Server runtime was expected to be skipped.'
            exit 1
          fi
          echo 'Relevant functional checks passed; unrelated runtime checks were skipped.'
