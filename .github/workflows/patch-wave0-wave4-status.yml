name: Patch Welle 0 Welle 4 status expectation

on:
  push:
    branches:
      - agent/lab001-wave4-multicontainer-runtime
    paths:
      - '.github/workflows/patch-wave0-wave4-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab001-wave4-multicontainer-runtime

      - name: Fix exact Welle 0 indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Code/Tests/Static/988_Validate_LAB001_Wave0_Contracts.py')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              '\n  findings.append(Finding("FUTURE_WAVE_STATUS_INVALID", wave_path.as_posix()))',
              '\n            findings.append(Finding("FUTURE_WAVE_STATUS_INVALID", wave_path.as_posix()))',
          )
          content = content.replace(
              '\n  findings.append(Finding("FUTURE_WAVE_RUNTIME_STATUS_INVALID", wave_path.as_posix()))',
              '\n            findings.append(Finding("FUTURE_WAVE_RUNTIME_STATUS_INVALID", wave_path.as_posix()))',
          )
          path.write_text(content, encoding='utf-8')
          PY
          if git diff --quiet -- Code/Tests/Static/988_Validate_LAB001_Wave0_Contracts.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Code/Tests/Static/988_Validate_LAB001_Wave0_Contracts.py
          git commit -m 'Fix LAB-001 Welle 4 status validation'
          git push origin HEAD:agent/lab001-wave4-multicontainer-runtime
