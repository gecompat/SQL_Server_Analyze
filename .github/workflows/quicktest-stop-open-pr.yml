name: Open quick-test Stop PR

on:
  push:
    branches:
      - agent/quicktest-stop-lifecycle

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open bounded Stop lifecycle PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open draft pull request when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 70 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Temporary PR workflow started for the bounded Stop lifecycle branch."

          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment 70 \
              --repo "$GITHUB_REPOSITORY" \
              --body "Pull request already exists: #$existing."
            exit 0
          fi

          body_file="$RUNNER_TEMP/quicktest-stop-pr.md"
          cat > "$body_file" <<'EOF'
          ## Umfang

          Implementiert den begrenzten Quick-Test-Stop-Lifecycle mit vollständigen owner-validierten Container-IDs, erhaltenem Netzwerk und erhaltenen lokalen Daten. `Start` setzt gestoppte Container ohne Neuerstellung und ohne Credentialzugriff fort.

          ## Evidenzgrenze

          Statische und synthetische Tests sind kein nativer Docker-, Podman- oder SQL-Server-Nachweis. Externe Evidenz bleibt `NOT_EXECUTED`.

          Der Merge erfolgt nur nach vollständig grünen Repository-Gates.
          EOF

          set +e
          result="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --base main \
            --draft \
            --title 'Implement quick-test Stop lifecycle' \
            --body-file "$body_file" 2>&1)"
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            gh issue comment 70 \
              --repo "$GITHUB_REPOSITORY" \
              --body "Temporary PR workflow could not open the pull request; GitHub CLI returned exit code $exit_code."
            exit "$exit_code"
          fi
          gh issue comment 70 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Draft pull request opened successfully."
          printf '%s\n' "$result"
