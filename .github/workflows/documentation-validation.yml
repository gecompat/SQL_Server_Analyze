name: OPS installer transport

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

concurrency:
  group: ops-installer-transport
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == '587085802f444bbd401d27ea3ff8d45552d2a172' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the bound source tree
        uses: actions/checkout@v6
        with:
          ref: 5c3cc4ef7c22d19d219f08d0565cb6dacecb1ce2
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Retrieve and verify frozen public sources
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          builders = {
              "Code/Install/Build-StandaloneInstaller.ps1": "39a751bc73536d430204f505e7974d92343b30d5",
              "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1": "4160bdd1e1df6c557ba2c25dffd502eee1383b15",
          }
          for path, expected in builders.items():
              if blob_sha(Path(path).read_bytes()) != expected:
                  raise SystemExit("Bound builder mismatch: " + path)

          sources = {
              "Code/10_SSIS/010_USP_SsisPackageAnalysis.sql": (
                  "0c90dc38570240449e299e9b4d2a82e3ee89493f",
                  "68fd38a3c55903e0d1de226a1febba8fcff2d7b3"),
          }
          for path, (before, expected) in sources.items():
              if blob_sha(Path(path).read_bytes()) != before:
                  raise SystemExit("Bound input mismatch: " + path)
              request = urllib.request.Request(
                  "https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/" + expected,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(1000001)
              if len(raw) > 1000000:
                  raise SystemExit("Source response exceeded bound")
              record = json.loads(raw)
              if record.get("encoding") != "base64" or record.get("sha") != expected:
                  raise SystemExit("Source response binding failed")
              data = base64.b64decode(record["content"], validate=False)
              if len(data) > 300000 or blob_sha(data) != expected:
                  raise SystemExit("Source content binding failed")
              Path(path).write_bytes(data)
          print("FROZEN_SSIS_SOURCE_VERIFIED")

      - name: Build the canonical OPS artifact
        shell: pwsh
        run: |
          & ./TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -InstallOutputPath (Join-Path $env:RUNNER_TEMP 'ops-install.sql') `
            -UpdateOutputPath (Join-Path $env:RUNNER_TEMP 'ops-update.sql')

      - name: Store canonical candidates for independent review
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          def git_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          def store_blob(data):
              payload = json.dumps({
                  "encoding": "base64",
                  "content": base64.b64encode(data).decode("ascii"),
              }).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read(4097)
              except urllib.error.HTTPError as error:
                  raise SystemExit("CANDIDATE_UPLOAD_HTTP_STATUS=" + str(error.code)) from None
              expected = git_sha(data)
              if len(raw) > 4096 or json.loads(raw).get("sha") != expected:
                  raise SystemExit("Candidate upload response binding failed")
              return expected

          files = {
              "TestLab/Adapters/OPS-005/sql/install.sql": "ops-install.sql",
          }
          artifacts = {}
          envelope = {
              "kind": "CANONICAL_REVIEW_CANDIDATES",
              "baseCommit": "5c3cc4ef7c22d19d219f08d0565cb6dacecb1ce2",
              "sourceBlobs": {
                  "Code/10_SSIS/010_USP_SsisPackageAnalysis.sql": "68fd38a3c55903e0d1de226a1febba8fcff2d7b3",
              },
              "builderBlobs": {
                  "Code/Install/Build-StandaloneInstaller.ps1": "39a751bc73536d430204f505e7974d92343b30d5",
                  "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1": "4160bdd1e1df6c557ba2c25dffd502eee1383b15",
              },
              "files": {},
          }
          def fetch_bound_blob(sha, size_limit):
              request = urllib.request.Request(
                  "https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/" + sha,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(11000001)
              if len(raw) > 11000000:
                  raise SystemExit("Derivation response exceeded bound")
              record = json.loads(raw)
              if record.get("encoding") != "base64" or record.get("sha") != sha:
                  raise SystemExit("Derivation response binding failed")
              data = base64.b64decode(record["content"], validate=False)
              if len(data) > size_limit or git_sha(data) != sha:
                  raise SystemExit("Derivation blob binding failed")
              data.decode("utf-8").encode("utf-8")
              return data

          baseline_ops = fetch_bound_blob("b0e02d88fc71fbe91e310c060c784859973944ae", 8000000)
          if len(baseline_ops) != 6515572:
              raise SystemExit("Baseline installer size mismatch")
          old_source = fetch_bound_blob("0c90dc38570240449e299e9b4d2a82e3ee89493f", 300000)
          new_source = Path("Code/10_SSIS/010_USP_SsisPackageAnalysis.sql").read_bytes()
          if git_sha(new_source) != "68fd38a3c55903e0d1de226a1febba8fcff2d7b3":
              raise SystemExit("Final source binding failed")
          marker = b"CREATE OR ALTER PROCEDURE [monitor].[USP_SsisPackageAnalysis]"
          def full_module(source):
              if source.count(marker) != 1 or b"\r" in source:
                  raise SystemExit("Ambiguous source module boundary or newline form")
              return source[source.index(marker):].rstrip(b"\n")

          old_module, new_module = full_module(old_source), full_module(new_source)
          if baseline_ops.count(old_module) != 1:
              raise SystemExit("Baseline full-module occurrence mismatch")
          derived_ops = baseline_ops.replace(old_module, new_module, 1)
          if derived_ops.count(new_module) != 1 or derived_ops.replace(new_module, old_module, 1) != baseline_ops:
              raise SystemExit("Unchanged installer remainder proof failed")
          generated_ops = (Path(os.environ["RUNNER_TEMP"]) / "ops-install.sql").read_bytes()
          if generated_ops != derived_ops:
              raise SystemExit("Canonical generator differs from independent full-module derivation")
          generated_update = (Path(os.environ["RUNNER_TEMP"]) / "ops-update.sql").read_bytes()
          if len(generated_update) != 17380 or git_sha(generated_update) != "1f7ff87dda9ab630ea9ab720945d77f8c1bb6358":
              raise SystemExit("Unchanged OPS update artifact mismatch")
          envelope["derivation"] = {
              "baselineInstallerBlob": "b0e02d88fc71fbe91e310c060c784859973944ae",
              "oldSourceBlob": "0c90dc38570240449e299e9b4d2a82e3ee89493f",
              "newSourceBlob": "68fd38a3c55903e0d1de226a1febba8fcff2d7b3",
              "wholeModuleOccurrences": 1,
              "unchangedRemainder": True,
              "canonicalBytesEqual": True,
              "unchangedUpdateBlob": "1f7ff87dda9ab630ea9ab720945d77f8c1bb6358",
          }
          expected_outputs = {
              "TestLab/Adapters/OPS-005/sql/install.sql": (git_sha(derived_ops), len(derived_ops)),
          }
          for path, filename in files.items():
              data = (Path(os.environ["RUNNER_TEMP"]) / filename).read_bytes()
              if len(data) > 8000000:
                  raise SystemExit("Canonical candidate exceeded size bound")
              expected_sha, expected_size = expected_outputs[path]
              if len(data) != expected_size or git_sha(data) != expected_sha:
                  raise SystemExit("Canonical output differs from independently reviewed bytes: " + path)
              artifacts[path] = data
              envelope["files"][path] = {
                  "gitBlobSha": git_sha(data),
                  "byteLength": len(data),
                  "gzipBase64": base64.b64encode(gzip.compress(data, compresslevel=9, mtime=0)).decode("ascii"),
              }
          encoded = json.dumps(envelope, sort_keys=True, separators=(",", ":")).encode("ascii")
          if len(encoded) > 2000000:
              raise SystemExit("Review envelope exceeded size bound")

          # Exactly two bounded blob POSTs; no refs, commits or installation.
          review_sha = store_blob(encoded)
          print("CANONICAL_REVIEW_ENVELOPE_BLOB=" + review_sha, flush=True)
          for path, data in artifacts.items():
              actual = store_blob(data)
              print("CANONICAL_CANDIDATE_BLOB=" + path + ":" + actual, flush=True)
          print("INDEPENDENT_ARTIFACT_REVIEW_REQUIRED", flush=True)
