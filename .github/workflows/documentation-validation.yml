name: OPS installer transport

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

concurrency:
  group: ops-installer-transport
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the bound source tree
        uses: actions/checkout@v6
        with:
          ref: 10718d919cbc68204ebddc3abb47aec1826101b4
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Retrieve and verify frozen public sources
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          builders = {
              "Code/Install/Build-StandaloneInstaller.ps1": "39a751bc73536d430204f505e7974d92343b30d5",
              "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1": "4160bdd1e1df6c557ba2c25dffd502eee1383b15",
          }
          for path, expected in builders.items():
              if blob_sha(Path(path).read_bytes()) != expected:
                  raise SystemExit("Bound builder mismatch: " + path)

          sources = {
              "Code/04_PlanCache/052_USP_CreateExecutionEvidenceJson.sql": (
                  "90d5a3e9df57e186157eafef35833307961cda41",
                  "f7ac73f82c786d47e4bebe1ac2e30da87c5134a1"),
              "Code/04_PlanCache/053_USP_ExecutionPlanAnalysis.sql": (
                  "a8886975dbaa3173bfb69ae78dad02b7dabeb8b3",
                  "fdabbabc39183962d988262fd568541435f94760"),
          }
          for path, (before, expected) in sources.items():
              if blob_sha(Path(path).read_bytes()) != before:
                  raise SystemExit("Bound input mismatch: " + path)
              request = urllib.request.Request(
                  "https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/" + expected,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(1000001)
              if len(raw) > 1000000:
                  raise SystemExit("Source response exceeded bound")
              record = json.loads(raw)
              if record.get("encoding") != "base64" or record.get("sha") != expected:
                  raise SystemExit("Source response binding failed")
              data = base64.b64decode(record["content"], validate=False)
              if len(data) > 300000 or blob_sha(data) != expected:
                  raise SystemExit("Source content binding failed")
              Path(path).write_bytes(data)
          print("FROZEN_PUBLIC_SOURCES_VERIFIED")

      - name: Build the canonical OPS artifact
        shell: pwsh
        run: |
          & ./TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -InstallOutputPath (Join-Path $env:RUNNER_TEMP 'ops-install.sql') `
            -UpdateOutputPath (Join-Path $env:RUNNER_TEMP 'ops-update.sql')

      - name: Store the exact reviewed Git blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          expected = "de0ecce452bee4a699fd33af6e815d842d3ee953"
          data = (Path(os.environ["RUNNER_TEMP"]) / "ops-install.sql").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if len(data) > 8000000 or actual != expected:
              raise SystemExit("Generated OPS blob does not match the reviewed artifact")
          payload = json.dumps({
              "encoding": "base64",
              "content": base64.b64encode(data).decode("ascii"),
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(4097)
          except urllib.error.HTTPError as error:
              raise SystemExit("OPS_UPLOAD_HTTP_STATUS=" + str(error.code)) from None
          if len(raw) > 4096 or json.loads(raw).get("sha") != expected:
              raise SystemExit("Uploaded OPS blob response binding failed")
          print("OPS_INSTALLER_BLOB=" + expected)
