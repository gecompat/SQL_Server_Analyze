name: OPS installer transport

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

concurrency:
  group: ops-installer-transport
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == '72f6e3b7cc046f292ff4bf76a6476b178e7da48f' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out the bound source tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2bb52b422d8da9ba046f52682fb22b19269a299c
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Retrieve and verify frozen public sources
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          C = json.loads(r'''{"base":"2bb52b422d8da9ba046f52682fb22b19269a299c","source":"7edc2b9e744f0f90200950af71b2ef348eafe946","helperBefore":"72f6e3b7cc046f292ff4bf76a6476b178e7da48f","sources":[{"path":"Code/Install/Build-StandaloneInstaller.ps1","before":"39a751bc73536d430204f505e7974d92343b30d5","after":"4db9dbfae972d68d7c27d832857e0f084955c668"}],"builders":{"Code/Install/Build-StandaloneInstaller.ps1":"39a751bc73536d430204f505e7974d92343b30d5","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"buildersAfter":{"Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"opsBefore":"c779db0d343e865f39f8eeb223588595dce6421c","opsAfter":"59fc4dfab0f44238c010886529caff8c735255e4","opsBeforeBytes":6778012,"opsAfterBytes":6777937,"standalone":"edcb190a15d7a8b67fbb3adbc46abd8ff2d8e286","standaloneBytes":584191,"update":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358","updateBytes":17380,"modules":[{"path":"Code/10_SSIS/036_InternalSsisPipelineCorrelation.sql","sha":"394c4c8a2013f69aee8aef4bbf076d9583ef2e35"},{"path":"Code/10_SSIS/045_InternalSsisExecutionMetrics.sql","sha":"395affa2678fa7a7502b22049f4708abab253172"},{"path":"Code/10_SSIS/060_USP_SsisExecutionBaseline.sql","sha":"4aae65beaa1fc780cf72fb311000342bb6f08905"}]}''')
          def gitsha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          def fetch(sha):
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/" + sha, headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(1000001)
              if len(raw)>1000000:
                  raise SystemExit("SOURCE_RESPONSE_BOUND")
              record=json.loads(raw)
              if record.get("sha")!=sha or record.get("encoding")!="base64":
                  raise SystemExit("SOURCE_RESPONSE_BINDING")
              data=base64.b64decode(record["content"],validate=False)
              if len(data)>300000 or gitsha(data)!=sha:
                  raise SystemExit("SOURCE_BYTE_BINDING")
              data.decode("utf-8").encode("utf-8")
              return data
          for path, sha in C["builders"].items():
              if gitsha(Path(path).read_bytes())!=sha:
                  raise SystemExit("BUILDER_BINDING: "+path)
          baseline=[("TestLab/Adapters/OPS-005/sql/install.sql",C["opsBefore"],C["opsBeforeBytes"]),("TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql",C["standalone"],C["standaloneBytes"]),("TestLab/Adapters/OPS-005/sql/update.sql",C["update"],C["updateBytes"])]
          for path, sha, size in baseline:
              data=Path(path).read_bytes()
              if len(data)!=size or gitsha(data)!=sha:
                  raise SystemExit("BASELINE_ARTIFACT_BINDING: "+path)
          root=Path.cwd().resolve()
          for source in C["sources"]:
              path=Path(source["path"])
              if not path.resolve().is_relative_to(root):
                  raise SystemExit("SOURCE_PATH_BOUNDARY")
              if source["before"] is None:
                  if path.exists():
                      raise SystemExit("NEW_SOURCE_ALREADY_EXISTS")
              elif not path.is_file() or gitsha(path.read_bytes())!=source["before"]:
                  raise SystemExit("SOURCE_BEFORE_BINDING: "+source["path"])
              data=fetch(source["after"])
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          if gitsha(Path("Code/Install/Build-StandaloneInstaller.ps1").read_bytes())!=C["buildersAfter"]["Code/Install/Build-StandaloneInstaller.ps1"]:
              raise SystemExit("UPDATED_BUILDER_BINDING")
          print("FROZEN_RELEASE_HEADER_BUILDER_VERIFIED")

      - name: Run both canonical installer builders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -InstallOutputPath (Join-Path $env:RUNNER_TEMP 'ops-install.sql') `
            -UpdateOutputPath (Join-Path $env:RUNNER_TEMP 'ops-update.sql')
          & ./TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'plan-install.sql')

      - name: Prove canonical bytes and upload two review blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          C = json.loads(r'''{"base":"2bb52b422d8da9ba046f52682fb22b19269a299c","source":"7edc2b9e744f0f90200950af71b2ef348eafe946","helperBefore":"72f6e3b7cc046f292ff4bf76a6476b178e7da48f","sources":[{"path":"Code/Install/Build-StandaloneInstaller.ps1","before":"39a751bc73536d430204f505e7974d92343b30d5","after":"4db9dbfae972d68d7c27d832857e0f084955c668"}],"builders":{"Code/Install/Build-StandaloneInstaller.ps1":"39a751bc73536d430204f505e7974d92343b30d5","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"buildersAfter":{"Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"opsBefore":"c779db0d343e865f39f8eeb223588595dce6421c","opsAfter":"59fc4dfab0f44238c010886529caff8c735255e4","opsBeforeBytes":6778012,"opsAfterBytes":6777937,"standalone":"edcb190a15d7a8b67fbb3adbc46abd8ff2d8e286","standaloneBytes":584191,"update":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358","updateBytes":17380,"modules":[{"path":"Code/10_SSIS/036_InternalSsisPipelineCorrelation.sql","sha":"394c4c8a2013f69aee8aef4bbf076d9583ef2e35"},{"path":"Code/10_SSIS/045_InternalSsisExecutionMetrics.sql","sha":"395affa2678fa7a7502b22049f4708abab253172"},{"path":"Code/10_SSIS/060_USP_SsisExecutionBaseline.sql","sha":"4aae65beaa1fc780cf72fb311000342bb6f08905"}]}''')
          def gitsha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          def fetch(sha):
              request=urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/"+sha,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request,timeout=60) as response:
                  raw=response.read(1000001)
              if len(raw)>1000000:
                  raise SystemExit("DERIVATION_RESPONSE_BOUND")
              record=json.loads(raw)
              if record.get("sha")!=sha or record.get("encoding")!="base64":
                  raise SystemExit("DERIVATION_RESPONSE_BINDING")
              data=base64.b64decode(record["content"],validate=False)
              if len(data)>300000 or gitsha(data)!=sha:
                  raise SystemExit("DERIVATION_SOURCE_BINDING")
              return data
          def module(data, optional_blank):
              text=data.decode("utf-8")
              pattern=r"^\ufeff?USE \[DeineDatenbank\];\r?\nGO\r?\n(?:\r?\n)?" if optional_blank else r"^\ufeff?USE \[DeineDatenbank\];\r?\nGO\r?\n\r?\n"
              text=re.sub(pattern,"",text).rstrip()
              return re.sub(r"[\t ]+(?=\r?$)","",text,flags=re.MULTILINE).encode("utf-8")
          def block(path, body):
              return b"-- BEGIN SOURCE: "+path.encode("utf-8")+b"\n"+body+b"\n-- END SOURCE: "+path.encode("utf-8")
          baseline=Path("TestLab/Adapters/OPS-005/sql/install.sql").read_bytes()
          if len(baseline)!=C["opsBeforeBytes"] or gitsha(baseline)!=C["opsBefore"]:
              raise SystemExit("BASELINE_CHANGED_BEFORE_DERIVATION")
          derived=baseline
          replacements=[]
          for source in C["modules"]:
              path=source["path"]
              data=Path(path).read_bytes()
              if gitsha(data)!=source["sha"]:
                  raise SystemExit("UNCHANGED_SOURCE_BINDING: "+path)
              old_body=module(data,False)
              new_body=module(data,True)
              if old_body==new_body or not old_body.startswith(b"USE [DeineDatenbank];\nGO\n") or new_body.startswith(b"USE [DeineDatenbank];"):
                  raise SystemExit("HEADER_NORMALIZATION_BOUNDARY: "+path)
              old_block=block(path,old_body)
              new_block=block(path,new_body)
              if derived.count(old_block)!=1 or derived.count(new_block)!=0:
                  raise SystemExit("WHOLE_MODULE_BOUNDARY: "+path)
              derived=derived.replace(old_block,new_block,1)
              replacements.append((old_block,new_block))
          reversed_bytes=derived
          for old_block,new_block in reversed(replacements):
              if reversed_bytes.count(new_block)!=1:
                  raise SystemExit("REVERSE_MULTIPLICITY")
              reversed_bytes=reversed_bytes.replace(new_block,old_block,1)
          if reversed_bytes!=baseline:
              raise SystemExit("UNCHANGED_INSTALLER_REMAINDER")
          if len(derived)!=C["opsAfterBytes"] or gitsha(derived)!=C["opsAfter"]:
              raise SystemExit("PREBOUND_EXPECTED_INSTALLER_IDENTITY")
          temp=Path(os.environ["RUNNER_TEMP"])
          generated=(temp/"ops-install.sql").read_bytes()
          if generated!=derived:
              raise SystemExit("CANONICAL_GENERATOR_DIFFERENT_FROM_FULL_MODULE_DERIVATION")
          updated=(temp/"ops-update.sql").read_bytes()
          if len(updated)!=C["updateBytes"] or gitsha(updated)!=C["update"]:
              raise SystemExit("UNCHANGED_UPDATE_IDENTITY")
          plan=(temp/"plan-install.sql").read_bytes()
          if len(plan)!=C["standaloneBytes"] or gitsha(plan)!=C["standalone"] or plan!=Path("TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql").read_bytes():
              raise SystemExit("UNCHANGED_STANDALONE_CANONICAL_IDENTITY")
          envelope={"kind":"CANONICAL_REVIEW_CANDIDATES","baseCommit":C["base"],"sourcePreviewCommit":C["source"],"sourceBlobs":{s["path"]:s["after"] for s in C["sources"]},"builderBeforeBlobs":C["builders"],"builderBlobs":C["buildersAfter"],"derivation":{"baselineInstallerBlob":C["opsBefore"],"unchangedSourceModules":C["modules"],"headerNormalizedModuleOccurrences":3,"wholeModuleOccurrences":3,"newModuleInserted":False,"unchangedRemainder":True,"canonicalBytesEqual":True,"unchangedUpdateBlob":C["update"],"unchangedStandaloneBlob":C["standalone"]},"files":{"TestLab/Adapters/OPS-005/sql/install.sql":{"gitBlobSha":gitsha(generated),"byteLength":len(generated),"gzipBase64":base64.b64encode(gzip.compress(generated,compresslevel=9,mtime=0)).decode("ascii")}}}
          encoded=json.dumps(envelope,sort_keys=True,separators=(",",":")).encode("ascii")
          if len(encoded)>2000000 or len(generated)>8000000:
              raise SystemExit("REVIEW_ARTIFACT_SIZE_BOUND")
          def upload(data):
              payload=json.dumps({"encoding":"base64","content":base64.b64encode(data).decode("ascii")}).encode("utf-8")
              request=urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",data=payload,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:
                      raw=response.read(4097)
              except urllib.error.HTTPError as error:
                  raise SystemExit("CANDIDATE_UPLOAD_HTTP_STATUS="+str(error.code)) from None
              if len(raw)>4096 or json.loads(raw).get("sha")!=gitsha(data):
                  raise SystemExit("UPLOAD_RESPONSE_BINDING")
              return gitsha(data)
          # Exactly two bounded blob POSTs, after every source/canonical/reverse proof.
          review_sha=upload(encoded)
          installer_sha=upload(generated)
          print("CANONICAL_REVIEW_ENVELOPE="+review_sha+" BYTES="+str(len(encoded)))
          print("CANONICAL_OPS_INSTALLER="+installer_sha+" BYTES="+str(len(generated)))
          print("CANONICAL_RELEASE_HEADER_TRANSPORT_PASS")
