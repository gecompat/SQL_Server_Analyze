name: Canonical SSIS receipt artifact verification

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}
concurrency:
  group: usage-skill-canonical-review
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == '47d430cbd63d412af5b509b99477c434ac68ef1d' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed SSIS source preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4f120466a5b699cfb853a397e8dbcd9d80fd5d3e
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Generate and verify canonical installer bytes
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          
          config = json.loads(r'''{"preview":"4f120466a5b699cfb853a397e8dbcd9d80fd5d3e","tree":"d24449f859305c40a46a3a2f7e8ccd920c9d8d88","before":"47d430cbd63d412af5b509b99477c434ac68ef1d","beforePins":{"Code/00_Setup/005_VW_ObjectUsageSkills.sql":"58d7cbd8badea669d171c058bb8495920895fc86","Code/10_SSIS/033_SsisHandoverReceipt.sql":"a47fd0708493e47b4694f8c58fc0a05e1a79d548","Code/10_SSIS/035_InternalSsisExecutionScopes.sql":"aac14db968eb26dd79fedf42ff49c80ff41b0faf","Code/10_SSIS/040_USP_SsisPackageModelAnalysis.sql":"2cdd1f5efb5ee46f8dfc0f5b7802c716ff0a4673","Code/10_SSIS/041_InternalManageSsisHandoverReceipt.sql":"0ae3d153757877a957ee71b0f323c5a005adc5c2","Code/10_SSIS/050_USP_SsisExecutionComparison.sql":"e400750de81c1039240a6d56ecdc9502c500c6b1","Code/10_SSIS/060_USP_SsisExecutionBaseline.sql":"4d4227c9b5bd4a61118b59d8e0cc23b1ae014839","Code/10_SnapshotBaseline/012_VW_ObjectUsageSkills_Target.sql":"825c4f1f23d557bd69e6e9edf0082af85a6490a9","Code/10_SnapshotBaseline/030_Snapshot_Target_Schema.sql":"62967240befa91207f2084b1c78180e2af6d5cc8","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","Code/Install/Build-SnapshotBaselineInstallers.ps1":"738f369b72435d94b21249267a3996d872379771","Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","Code/Install/Install_All.sql":"aa43d87f582cd9670d285bf04976807601c2ddfe","Code/Install/Install_SSIS_Analysis.sql":"f300919e9c54a0e08b359f602545f3be3dd00f83","Code/Install/deployment_generator.py":"99a8e762bc9ffc905dc1fe1d6141bdf98f4d0ca1","Code/Install/usage_skill_generator.py":"5bd8eda4b48dce8a79a12a52a0e40c23c192f063","Code/Tests/Integration/212_SsisPackageModelAnalysis_Runtime_Contract.ps1":"56645aabc387f62e1520d9de7bb9526455104e2e","Code/Tests/Integration/215_SsisLocalHandover_Runtime_Contract.sql":"30406aa2784c678ea2e8d4d734f8e86bca78184e","Code/Tests/Integration/216_SsisCatalogHandover_Native_Contract.ps1":"d2577642bb8e35d19263dda70fa00ec74461137b","Code/Tests/Integration/216_SsisCatalogHandover_Transport_Contract.ps1":"c3884c32ac27957e6943080246ccec4dd6cac696","Code/Tests/Integration/216_SsisExecutionCorrelation_Runtime_Contract.sql":"b1cd2e906915694e3b15e3bcb475a8f11e572c5c","Code/Tests/Integration/218_SsisIterationCorrelation_Runtime_Contract.sql":"358cdd8f0e6c807d4694504b8f38081f71f57c8d","Code/Tests/Integration/219_SsisExecutionScopes_Native_Contract.ps1":"3d929cd92aa78b8d43b84ca31f113657e9b14db4","Code/Tests/Integration/220_SsisExecutionScopes_Runtime_Contract.sql":"f4033712711967228137d286b095c1ac81ce9ac7","Code/Tests/Integration/221_SsisPipelineCorrelation_Native_Contract.ps1":"b52936489d5ff6b4ea042d5ec3df37e4fe2e728e","Code/Tests/Integration/222_SsisPipelineCorrelation_Runtime_Contract.sql":"cf925d2846286e9346de0188569a1df602fe31a2","Code/Tests/Integration/223_SsisPipelineDiagnostics_Runtime_Contract.sql":"66c1e78201bb39ef23b34036f5454a5b6ea4af98","Code/Tests/Integration/225_SsisExecutionComparison_Runtime_Contract.sql":"a4fae1ddfd03bf79ae521ecd968d6369ea02d960","Code/Tests/Integration/226_SsisExecutionComparison_Native_Contract.ps1":"f24d7321737a1cfb83e5af73d7fd41ec14acf6d3","Code/Tests/Integration/227_SsisExecutionBaseline_Runtime_Contract.sql":"bae8d50e7bf749cd8f8e161c54c412461198e571","Code/Tests/Integration/229_Usage_Skills_Framework_Runtime_Contract.sql":"a35aec062298d69806132b394ac935a6c2d3bbac","Code/Tests/Integration/Deployment_Filled_Core.sql":"375df881de04f5f6efcb1637b127049f651e221c","Code/Tests/Integration/Deployment_Prepare_Runtime.py":"b1ed77a12a13bb3f4327f2ce54bddca7568a1285","Code/Tests/Static/1054_Validate_Usage_Skill_Contract.py":"2d06a0e10a647b27dc1f76a4c25feed1a3df2a7a","Code/Tests/Static/950_Validate_Nonblocking_Metadata.py":"a46234d19b839f12d08b150024e20b258f665a4d","Code/Tests/Static/Validate_Deployment_Contract.py":"c445fa8e1ae72378db7a13f6280017e15e290f6c","Code/Tests/Static/Validate_Ssis_Exchange_Contract.py":"06fcad115fd5ca316f7e381478c685963fc872ad","Code/Tools/Invoke-SsisProjectScopeHandover.ps1":"f98e05a9a433e0bb98a203195558db17f8c4460c","Code/Tools/SsisHandoverSupport.psm1":"e3ab06036897a6ddbc94c9a0cbde643f9a59bb18","Documentation/Analysis_Guides/Procedures/USP_SsisExecutionBaseline.md":"85de5ff5771f55cdd456400f55897489143e6d40","Documentation/Analysis_Guides/Procedures/USP_SsisExecutionComparison.md":"a097671c379743add7864f72b4ceda47061f02ad","Documentation/Analysis_Guides/Procedures/USP_SsisPackageModelAnalysis.md":"a37fec24e2ac7fb29c102ceaeed954e2ad8253d8","Documentation/Architecture/SSIS_Analyze_Toolbelt_Exchange_Contract.md":"e9d054e9bf803c46f7352db30365f7562f2e092b","Documentation/Reference/Object_Reference.md":"b99b988ba85627b50f976559ef7227729e0ceb13","Metadata/Inventory/Objects.csv":"05d3e6e9ca2abcf2c79b49d39f7e6b8638f36867","Metadata/Packages/SSIS_001_Dependencies.csv":"1ef50398f02cb0b55e970dc1b0bbe20f0a595d48","Metadata/UsageSkills/README.md":"5174c8e01c42dc7546a946c995c47d30ec22f93d","Metadata/UsageSkills/monitor/InternalManageSsisHandoverReceipt.md":"f990dc085adfa513b484db34d6353cbed8c26830","Metadata/UsageSkills/monitor/InternalSsisExecutionScopes.md":"565daf261099460f245dcb3abf5ae04c0314cd66","Metadata/UsageSkills/monitor/SsisHandoverReceipt.md":"c671e033c8137629c980f17e6f89d6c2794de222","Metadata/UsageSkills/monitor/USP_SsisExecutionBaseline.md":"1f70cb3740a2646d9378918da81b5eb6490a7d78","Metadata/UsageSkills/monitor/USP_SsisExecutionComparison.md":"f4cb1e2fa70b92f0e8912c1bb42d7b1b88ff8224","Metadata/UsageSkills/monitor/USP_SsisPackageModelAnalysis.md":"68f3136a240fd879ce9730a2c186f536151f00b2","Metadata/UsageSkills/monitor_metadata/VW_ObjectUsageSkills.md":"d9b0da3b9d13649116ed922bb1fb735916efd823","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979","TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql":"0fd21dea041224db419069cf3a4da28f37b81af1","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","TestLab/Adapters/OPS-005/sql/install.sql":"060aa77f99368fda1e78ae389f6056c7b902796e","TestLab/Adapters/OPS-005/sql/update.sql":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358"},"expected":{"view":{"bytes":3838677,"sha":"c84818fe20b88ad9331d24a90cf0bd4268635a83"},"ops":{"bytes":16735721,"sha":"ab1fab8252b47dae61092cdaf551dfa9d67eb477"},"plan":{"bytes":4975117,"sha":"c3c49347ba1ad1abbc529ade35d2f261c506f638"},"update":{"bytes":17380,"sha":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358"}}}''')
          root = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"]) / "ssis-receipt-canonical"
          temp.mkdir(exist_ok=False)
          
          def git_hash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          
          def run(*args):
              child_env = {key: value for key, value in os.environ.items() if key != "GH_TOKEN"}
              return subprocess.run(args, cwd=root, env=child_env, check=True, timeout=900,
                                    capture_output=args[0] == "git").stdout
          
          def repository_bytes(path):
              resolved = (root / path).resolve(strict=True)
              if not resolved.is_file() or not resolved.is_relative_to(root):
                  raise SystemExit("PATH_BOUND")
              return resolved.read_bytes()
          
          def check_pins(pins):
              for path, expected in pins.items():
                  if git_hash(repository_bytes(path)) != expected:
                      raise SystemExit("BLOB_PIN_MISMATCH: " + path)
          
          renderer = "Code/Install/usage_skill_generator.py"
          deployment = "Code/Install/deployment_generator.py"
          validator = "Code/Tests/Static/1054_Validate_Usage_Skill_Contract.py"
          view = "Code/00_Setup/005_VW_ObjectUsageSkills.sql"
          if run("git", "rev-parse", "HEAD", "HEAD^{tree}").decode().splitlines() != [config["preview"], config["tree"]]:
              raise SystemExit("CHECKOUT_BOUND")
          check_pins(config["beforePins"])
          run(sys.executable, renderer, "--repository-root", ".", "--write-sources")
          run(sys.executable, renderer, "--repository-root", ".", "--write-views")
          diff = run("git", "diff", "--name-only", "-z").decode().strip("\0").split("\0")
          if diff != [view]:
              raise SystemExit("PROJECTION_REPLAY_BOUND: " + repr(diff))
          check_pins({**config["beforePins"], view: config["expected"]["view"]["sha"]})
          run(sys.executable, renderer, "--repository-root", ".", "--check")
          run(sys.executable, deployment, "--repository-root", ".", "--check-snapshot-guard")
          run(sys.executable, validator, "--repository-root", ".", "--self-test")
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-InstallOutputPath", str(temp / "ops.sql"), "-UpdateOutputPath", str(temp / "update.sql"))
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-OutputPath", str(temp / "plan.sql"))
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "Code/Install/Build-SnapshotBaselineInstallers.ps1",
              "-RepositoryRoot", str(root), "-FrameworkOutputPath", str(temp / "snapshot-framework.sql"),
              "-TargetOutputPath", str(temp / "snapshot-target.sql"))
          data = {"view": repository_bytes(view), "ops": (temp / "ops.sql").read_bytes(),
                  "plan": (temp / "plan.sql").read_bytes(), "update": (temp / "update.sql").read_bytes()}
          for name, payload in data.items():
              if {"bytes": len(payload), "sha": git_hash(payload)} != config["expected"][name]:
                  raise SystemExit("CANONICAL_BYTES_BOUND: " + name)
              payload.decode("utf-8")
          snapshot = {}
          for side in ("framework", "target"):
              payload = (temp / ("snapshot-" + side + ".sql")).read_bytes()
              if not payload:
                  raise SystemExit("EMPTY_SNAPSHOT_INSTALLER")
              snapshot[side] = {"bytes": len(payload), "sha": git_hash(payload)}
          
          def upload(payload):
              expected = git_hash(payload)
              body = json.dumps({"encoding": "base64", "content": base64.b64encode(payload).decode("ascii")}).encode("ascii")
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
                                               data=body, method="POST", headers={
                                                   "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                   "Content-Type": "application/json",
                                                   "Accept": "application/vnd.github+json",
                                                   "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  content = response.read(4097)
              if len(content) > 4096 or json.loads(content).get("sha") != expected:
                  raise SystemExit("UPLOAD_RESPONSE_BOUND")
              return expected
          
          chunks = []
          offset = 0
          while offset < len(data["ops"]):
              end = min(offset + 786432, len(data["ops"]))
              while end < len(data["ops"]) and (data["ops"][end] & 192) == 128:
                  end -= 1
              if end <= offset:
                  raise SystemExit("CHUNK_BOUND")
              piece = data["ops"][offset:end]
              piece.decode("utf-8")
              chunks.append((offset, piece))
              offset = end
          if len(chunks) > 40 or b"".join(piece for _, piece in chunks) != data["ops"]:
              raise SystemExit("CHUNK_REPLAY_BOUND")
          for name in ("view", "ops", "plan"):
              upload(data[name])
          review_chunks = [{"offset": pos, "bytes": len(part), "sha": upload(part)} for pos, part in chunks]
          manifest = json.dumps({"preview": config["preview"], "tree": config["tree"], "pins": config["beforePins"],
                                 "canonical": config["expected"], "snapshot": snapshot, "opsChunks": review_chunks},
                                sort_keys=True, separators=(",", ":")).encode("ascii")
          if len(manifest) > 100000:
              raise SystemExit("MANIFEST_SIZE_BOUND")
          print("SSIS_RECEIPT_CANONICAL_MANIFEST=" + upload(manifest))
