name: Read PR 793 archived SQL error

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

jobs:
  read-diagnostics:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event.before == '671f4e8825c766143819ed2597d1a1a4c404ba66' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Read bound artifact and emit only error identifiers
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          endpoint = "https://api.github.com/repos/gecompat/SQL_Server_Analyze/actions/artifacts/14905535575"
          headers = {"Authorization": "Bearer " + os.environ.pop("GH_TOKEN"),
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          no_redirect = urllib.request.build_opener(NoRedirect())
          try:
              with no_redirect.open(urllib.request.Request(endpoint, headers=headers), timeout=15) as response:
                  meta = json.loads(response.read(16384))
              binding = meta.get("workflow_run", {})
              if meta.get("id") != 14905535575 or binding.get("id") != 45359480105 or binding.get("head_sha") != "8333ab19064c3f7d2798c7641d79a11f256e9ce9":
                  raise ValueError("metadata binding")
              try:
                  with no_redirect.open(urllib.request.Request(endpoint + "/zip", headers=headers), timeout=15):
                      raise ValueError("redirect required")
              except urllib.error.HTTPError as err:
                  if err.code != 302:
                      raise
                  location = err.headers.get("Location", "")
                  err.close()
              target = urllib.parse.urlsplit(location)
              hostname = target.hostname or ""
              if target.scheme != "https" or target.username or target.password or target.port not in (None, 443) or not hostname.endswith(".blob.core.windows.net"):
                  raise ValueError("invalid archive host")
              with no_redirect.open(location, timeout=15) as response:
                  payload = response.read(725)
              if len(payload) != 724 or hashlib.sha256(payload).hexdigest() != "2656a0bb2053778659689f9bd15e330cb3307b5f3398f29f4ce20ce085993531":
                  raise ValueError("artifact digest")
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  entries = [item for item in archive.infolist()
                             if item.filename == "ci-lock-diagnostics/impact.log"]
                  if len(entries) != 1 or entries[0].file_size > 8192:
                      raise ValueError("unexpected log entry")
                  log = archive.read(entries[0]).decode("utf-8")
              codes = sorted({int(value) for value in re.findall(r"(?m)^Msg ([0-9]{1,6}), Level ", log)})
              cases = sorted({int(value) for value in re.findall(r"Qualified database filter case ([123]) violated the one-part name contract\.", log)})
              has_sqlcmd_error = bool(re.search(r"(?im)^Sqlcmd: Error:", log))
              print(f"ARCHIVE_BOUND sql_codes={codes} qualified_filter_cases={cases} sqlcmd_error={int(has_sqlcmd_error)}")
          except (OSError, ValueError, zipfile.BadZipFile, RuntimeError) as err:
              print(f"ARCHIVE_READ_FAILED kind={type(err).__name__}")
              raise SystemExit(1) from None
