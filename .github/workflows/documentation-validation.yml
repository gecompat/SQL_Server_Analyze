name: Canonical CLR truncation artifacts

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}
concurrency:
  group: usage-skill-canonical-review
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == '84298f2444a90726786093c5929161b08dbd8ff3' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed CLR truncation preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 106a6e44da4762e8dc628b59798b167889d01d95
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - name: Validate and transport the generated view and installers
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          
          config = json.loads(r'''{"preview":"106a6e44da4762e8dc628b59798b167889d01d95","tree":"7be1437a73ada3c11ab9574420e1c26437dbbac4","parent":"b36a762e3554cef77fdff30ff91844a86042d84f","before":"84298f2444a90726786093c5929161b08dbd8ff3","pins":{"Code/00_Setup/005_VW_ObjectUsageSkills.sql":"0447ee08162eb53ac191fbd33344349c1962daf5","Code/10_SnapshotBaseline/012_VW_ObjectUsageSkills_Target.sql":"825c4f1f23d557bd69e6e9edf0082af85a6490a9","Code/Install/usage_skill_generator.py":"5bd8eda4b48dce8a79a12a52a0e40c23c192f063","Code/Install/deployment_generator.py":"99a8e762bc9ffc905dc1fe1d6141bdf98f4d0ca1","Code/Install/Install_All.sql":"aa43d87f582cd9670d285bf04976807601c2ddfe","Code/Install/Install_ExecutionPlanAnalysis.sql":"786f2f3d09dfcf431d58a993266b232db2bc2221","Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","TestLab/Adapters/OPS-005/sql/install.sql":"79de48ce5518e77c8b51ae6826682aab17627d97","TestLab/Adapters/OPS-005/sql/update.sql":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979","TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql":"c153ab6e7ba13200e611964a2c3ff185165b80fc","Code/09_VersionAdaptive/100_USP_ClrAnalysis.sql":"b4127d3fb9c0fcf7c962cf97375da0d3c6e017fa","Documentation/Analysis_Guides/Procedures/USP_ClrAnalysis.md":"fb26df7ea41141666e4adfe67504712f859ac5e5","Metadata/UsageSkills/monitor/USP_ClrAnalysis.md":"6cf16b06c83046de19a13307df63535e2c22be95","Documentation/Analysis_Guides/09_Version_Adaptive.md":"2ef097e57a3e788a4e201a3381968531514c614a","Code/Tests/Common/164_ClrAnalysis_Collation_Runtime_Contract.sql":"f153518790fb905620b576fa20309a9cd181750b","Lab/Validation/Fixtures/Runtime001/ClrSafeCatalog.sql":"dd7f543d4e235238f49834a300ef617756e92d7b"}}''')
          root = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"]) / "clr-truncation-artifact-review"
          temp.mkdir(exist_ok=False)
          view = "Code/00_Setup/005_VW_ObjectUsageSkills.sql"
          module = "Code/09_VersionAdaptive/100_USP_ClrAnalysis.sql"
          ops = "TestLab/Adapters/OPS-005/sql/install.sql"
          plan = "TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql"
          update = "TestLab/Adapters/OPS-005/sql/update.sql"
          old_sentence = "Der RESULTSET_TRUNCATED-Prüfblock zählt nur findings, assemblies, assemblyModules, assemblyDependencies, appDomains, loadedAssemblies und clrTasks; er deckt eine alleinige Begrenzung von activeRequests, memory oder performanceCounters nicht ab. Bei PrintMeldungen=1 wird die Warnmeldung ausgegeben, wenn diese geprüften Mengen das Limit überschreiten."
          new_sentence = "Sobald eines der begrenzten Resultsets mehr Zeilen als das Limit enthält, erscheint RESULTSET_TRUNCATED in warnings. Bei PrintMeldungen=1 wird die Warnung zusätzlich als Meldung ausgegeben."
          
          def git_hash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          
          def run(*args, capture=False):
              env = {key: value for key, value in os.environ.items() if key != "GH_TOKEN"}
              return subprocess.run(args, cwd=root, env=env, check=True, timeout=900,
                                    capture_output=capture).stdout
          
          def read(path):
              resolved = (root / path).resolve(strict=True)
              if not resolved.is_file() or not resolved.is_relative_to(root):
                  raise SystemExit("ARTIFACT_PATH_BOUND")
              return resolved.read_bytes()
          
          def replace_once(data, before, after):
              if not before or data.count(before) != 1:
                  raise SystemExit("ARTIFACT_UNIQUE_REPLACEMENT")
              result = data.replace(before, after)
              if result.count(after) != 1 or result.replace(after, before) != data:
                  raise SystemExit("ARTIFACT_REVERSE_REPLACEMENT")
              return result
          
          def embedded_body(data):
              body, count = re.subn(rb"^(?:\xef\xbb\xbf)?USE \[DeineDatenbank\];\r?\nGO\r?\n(?:\r?\n)?", b"", data, count=1)
              if count != 1:
                  raise SystemExit("ARTIFACT_SOURCE_HEADER_BOUND")
              return re.sub(rb"[ \t]+(?=\r?$)", b"", body, flags=re.M).rstrip(b"\r\n")
          
          if run("git", "rev-parse", "HEAD", "HEAD^{tree}", "HEAD^", capture=True).decode().splitlines() != [
                  config["preview"], config["tree"], config["parent"]]:
              raise SystemExit("ARTIFACT_PREVIEW_BOUND")
          for name, expected in config["pins"].items():
              if git_hash(read(name)) != expected:
                  raise SystemExit("ARTIFACT_PIN_MISMATCH: " + name)
          
          old_view = read(view)
          expected_view = replace_once(old_view, old_sentence.encode("utf-8"), new_sentence.encode("utf-8"))
          before_module = run("git", "show", config["parent"] + ":" + module, capture=True)
          after_module = read(module)
          expected_ops = replace_once(read(ops), embedded_body(old_view), embedded_body(expected_view))
          expected_ops = replace_once(expected_ops, embedded_body(before_module), embedded_body(after_module))
          expected_plan = replace_once(read(plan), embedded_body(old_view), embedded_body(expected_view))
          
          skills = "Code/Install/usage_skill_generator.py"
          run(sys.executable, skills, "--repository-root", ".", "--write-views")
          run(sys.executable, skills, "--repository-root", ".", "--check")
          run(sys.executable, "Code/Install/deployment_generator.py", "--repository-root", ".", "--check-snapshot-guard")
          if run("git", "diff", "--name-only", capture=True).decode().splitlines() != [view] or read(view) != expected_view:
              raise SystemExit("ARTIFACT_VIEW_BOUND")
          
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-InstallOutputPath", str(temp / "ops.sql"), "-UpdateOutputPath", str(temp / "update.sql"))
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-OutputPath", str(temp / "plan.sql"))
          if (temp / "update.sql").read_bytes() != read(update):
              raise SystemExit("ARTIFACT_UPDATE_UNCHANGED")
          generated = {view: read(view), ops: (temp / "ops.sql").read_bytes(), plan: (temp / "plan.sql").read_bytes()}
          if generated != {view: expected_view, ops: expected_ops, plan: expected_plan}:
              raise SystemExit("ARTIFACT_CANONICAL_BYTES_BOUND")
          
          expected_digests = [{"bytes":3848347,"sha":"9ecb3597f97a848fcedafc40db6d85f8f9dff5bb"},{"bytes":16776996,"sha":"8c287d5b0c069dc2bb6dc0539f2c36d90512604f"},{"bytes":4984787,"sha":"34bc4ded5713915a391e7b8ed3619c4faf08049a"}]
          if [{"bytes": len(value), "sha": git_hash(value)} for value in generated.values()] != expected_digests:
              raise SystemExit("ARTIFACT_ROOT_DIGEST_BOUND")

          def upload(payload):
              expected = git_hash(payload)
              body = json.dumps({"encoding": "base64", "content": base64.b64encode(payload).decode("ascii")}).encode("ascii")
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
                  data=body, method="POST", headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type":"application/json","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = response.read(4097)
              if len(result) > 4096 or json.loads(result).get("sha") != expected:
                  raise SystemExit("ARTIFACT_UPLOAD_BOUND")
              return expected
          
          def chunks(payload):
              offset = 0
              while offset < len(payload):
                  end = min(offset + 786432, len(payload))
                  while end < len(payload) and (payload[end] & 192) == 128:
                      end -= 1
                  if end <= offset:
                      raise SystemExit("ARTIFACT_CHUNK_BOUND")
                  piece = payload[offset:end]
                  piece.decode("utf-8")
                  yield offset, piece
                  offset = end
          
          bounded_chunks = {path: list(chunks(payload)) for path, payload in generated.items()}
          if sum(map(len, bounded_chunks.values()))>48 or any(
              b"".join(piece for _, piece in bounded_chunks[path]) != payload for path, payload in generated.items()):
              raise SystemExit("ARTIFACT_CHUNK_REPLAY")
          manifest = {"preview": config["preview"], "tree": config["tree"], "parent": config["parent"], "artifacts":[]}
          for path, payload in generated.items():
              manifest["artifacts"].append({"path": path, "bytes": len(payload), "sha": upload(payload),
                  "chunks": [{"offset": offset, "bytes": len(piece), "sha": upload(piece)}
                             for offset, piece in bounded_chunks[path]]})
          envelope = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("ascii")
          if len(envelope)>100000:
              raise SystemExit("ARTIFACT_MANIFEST_SIZE_BOUND")
          print("CLR_TRUNCATION_CANONICAL_MANIFEST=" + upload(envelope))
