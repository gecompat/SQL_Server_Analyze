name: OPS installer transport

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

concurrency:
  group: ops-installer-transport
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == 'c8d0e1abcf61752b623ddcfcc4fa02a610317fce' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out the bound source tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8dd39a7e08aa2c73ff73c64bd75bb09181511a00
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Retrieve and verify frozen public sources
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          C = json.loads(r'''{"base":"8dd39a7e08aa2c73ff73c64bd75bb09181511a00","source":"7e4ca986c04e2f075c97dcad07f8fb4a2ce84938","helperBefore":"c8d0e1abcf61752b623ddcfcc4fa02a610317fce","sources":[{"path":"Code/01_Common/021_VW_AnalysisCatalog.sql","before":"2c8a26d2af649fabfe17bc46af4f04452efe18d5","after":"e887fbc0b0d79314117dc685ccd48ed6103d4f66"},{"path":"Code/01_Common/022_VW_AnalysisSearchTerm.sql","before":"c2a35861fdb3bb20b570efe34892f36d26ec8239","after":"0d82f4a0d46d1c2681ffc430e3adaadba7a9acd1"},{"path":"Code/01_Common/023_VW_AnalysisRelation.sql","before":"3df01e94857c97d4339c270b0e032bb338acc899","after":"4ba57e7ec0fa9dff14d315cb0dd1c8e5c575d8a7"},{"path":"Code/08_ServerHealth/330_USP_LoadedModuleInventory.sql","before":null,"after":"ffd035fdddc682cdc663b3599a3bddcd31047fc8"},{"path":"Code/Install/Install_All.sql","before":"b3f796be1d3eee577b362128f8b57c3952f01696","after":"d6956f698842efadd196754fdef993690755243c"}],"builders":{"Code/Install/Build-StandaloneInstaller.ps1":"39a751bc73536d430204f505e7974d92343b30d5","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"opsBefore":"eb29de34f89c38e6a254ab50f0a8708ea5041973","opsAfter":"e11a04b8e5a7320d8431e0a14b3cd1c6fa22cf83","opsBeforeBytes":6678197,"opsAfterBytes":6706266,"standalone":"edcb190a15d7a8b67fbb3adbc46abd8ff2d8e286","standaloneBytes":584191,"update":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358","updateBytes":17380}''')
          def gitsha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          def fetch(sha):
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/" + sha, headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(1000001)
              if len(raw)>1000000:
                  raise SystemExit("SOURCE_RESPONSE_BOUND")
              record=json.loads(raw)
              if record.get("sha")!=sha or record.get("encoding")!="base64":
                  raise SystemExit("SOURCE_RESPONSE_BINDING")
              data=base64.b64decode(record["content"],validate=False)
              if len(data)>300000 or gitsha(data)!=sha:
                  raise SystemExit("SOURCE_BYTE_BINDING")
              data.decode("utf-8").encode("utf-8")
              return data
          for path, sha in C["builders"].items():
              if gitsha(Path(path).read_bytes())!=sha:
                  raise SystemExit("BUILDER_BINDING: "+path)
          baseline=[("TestLab/Adapters/OPS-005/sql/install.sql",C["opsBefore"],C["opsBeforeBytes"]),("TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql",C["standalone"],C["standaloneBytes"]),("TestLab/Adapters/OPS-005/sql/update.sql",C["update"],C["updateBytes"])]
          for path, sha, size in baseline:
              data=Path(path).read_bytes()
              if len(data)!=size or gitsha(data)!=sha:
                  raise SystemExit("BASELINE_ARTIFACT_BINDING: "+path)
          root=Path.cwd().resolve()
          for source in C["sources"]:
              path=Path(source["path"])
              if not path.resolve().is_relative_to(root):
                  raise SystemExit("SOURCE_PATH_BOUNDARY")
              if source["before"] is None:
                  if path.exists():
                      raise SystemExit("NEW_SOURCE_ALREADY_EXISTS")
              elif not path.is_file() or gitsha(path.read_bytes())!=source["before"]:
                  raise SystemExit("SOURCE_BEFORE_BINDING: "+source["path"])
              data=fetch(source["after"])
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          print("FROZEN_LOADED_MODULE_V1_SOURCES_VERIFIED")

      - name: Run both canonical installer builders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -InstallOutputPath (Join-Path $env:RUNNER_TEMP 'ops-install.sql') `
            -UpdateOutputPath (Join-Path $env:RUNNER_TEMP 'ops-update.sql')
          & ./TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'plan-install.sql')

      - name: Prove canonical bytes and upload two review blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          C = json.loads(r'''{"base":"8dd39a7e08aa2c73ff73c64bd75bb09181511a00","source":"7e4ca986c04e2f075c97dcad07f8fb4a2ce84938","helperBefore":"c8d0e1abcf61752b623ddcfcc4fa02a610317fce","sources":[{"path":"Code/01_Common/021_VW_AnalysisCatalog.sql","before":"2c8a26d2af649fabfe17bc46af4f04452efe18d5","after":"e887fbc0b0d79314117dc685ccd48ed6103d4f66"},{"path":"Code/01_Common/022_VW_AnalysisSearchTerm.sql","before":"c2a35861fdb3bb20b570efe34892f36d26ec8239","after":"0d82f4a0d46d1c2681ffc430e3adaadba7a9acd1"},{"path":"Code/01_Common/023_VW_AnalysisRelation.sql","before":"3df01e94857c97d4339c270b0e032bb338acc899","after":"4ba57e7ec0fa9dff14d315cb0dd1c8e5c575d8a7"},{"path":"Code/08_ServerHealth/330_USP_LoadedModuleInventory.sql","before":null,"after":"ffd035fdddc682cdc663b3599a3bddcd31047fc8"},{"path":"Code/Install/Install_All.sql","before":"b3f796be1d3eee577b362128f8b57c3952f01696","after":"d6956f698842efadd196754fdef993690755243c"}],"builders":{"Code/Install/Build-StandaloneInstaller.ps1":"39a751bc73536d430204f505e7974d92343b30d5","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979"},"opsBefore":"eb29de34f89c38e6a254ab50f0a8708ea5041973","opsAfter":"e11a04b8e5a7320d8431e0a14b3cd1c6fa22cf83","opsBeforeBytes":6678197,"opsAfterBytes":6706266,"standalone":"edcb190a15d7a8b67fbb3adbc46abd8ff2d8e286","standaloneBytes":584191,"update":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358","updateBytes":17380}''')
          def gitsha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          def fetch(sha):
              request=urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs/"+sha,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request,timeout=60) as response:
                  raw=response.read(1000001)
              if len(raw)>1000000:
                  raise SystemExit("DERIVATION_RESPONSE_BOUND")
              record=json.loads(raw)
              if record.get("sha")!=sha or record.get("encoding")!="base64":
                  raise SystemExit("DERIVATION_RESPONSE_BINDING")
              data=base64.b64decode(record["content"],validate=False)
              if len(data)>300000 or gitsha(data)!=sha:
                  raise SystemExit("DERIVATION_SOURCE_BINDING")
              return data
          def module(data):
              text=data.decode("utf-8")
              if "\r" in text:
                  raise SystemExit("MODULE_NEWLINE_BOUNDARY")
              text=re.sub(r"^\ufeff?USE \[DeineDatenbank\];\r?\nGO\r?\n\r?\n","",text).rstrip()
              return re.sub(r"[\t ]+(?=\r?$)","",text,flags=re.MULTILINE).encode("utf-8")
          def block(path, body):
              return b"-- BEGIN SOURCE: "+path.encode("utf-8")+b"\n"+body+b"\n-- END SOURCE: "+path.encode("utf-8")
          baseline=Path("TestLab/Adapters/OPS-005/sql/install.sql").read_bytes()
          if len(baseline)!=C["opsBeforeBytes"] or gitsha(baseline)!=C["opsBefore"]:
              raise SystemExit("BASELINE_CHANGED_BEFORE_DERIVATION")
          derived=baseline
          reverse=[]
          for source in C["sources"][:3]:
              old=block(source["path"],module(fetch(source["before"])))
              new_data=Path(source["path"]).read_bytes()
              if gitsha(new_data)!=source["after"]:
                  raise SystemExit("FINAL_NAV_SOURCE_BINDING")
              new=block(source["path"],module(new_data))
              if derived.count(old)!=1:
                  raise SystemExit("OLD_WHOLE_MODULE_OCCURRENCE")
              derived=derived.replace(old,new,1)
              if derived.count(new)!=1:
                  raise SystemExit("NEW_WHOLE_MODULE_OCCURRENCE")
              reverse.append((old,new))
          source=C["sources"][3]
          new_data=Path(source["path"]).read_bytes()
          if source["before"] is not None or gitsha(new_data)!=source["after"]:
              raise SystemExit("ADDED_MODULE_SOURCE_BINDING")
          added=b"\n"+block(source["path"],module(new_data))+b"\n"
          anchor=b"-- END SOURCE: Code/08_ServerHealth/320_USP_SensitivityClassificationSummary.sql\n"
          if derived.count(anchor)!=1 or b"-- BEGIN SOURCE: "+source["path"].encode("utf-8") in derived:
              raise SystemExit("ADDED_MODULE_BOUNDARY")
          derived=derived.replace(anchor,anchor+added,1)
          reconstructed=derived.replace(added,b"",1)
          for old,new in reversed(reverse):
              if reconstructed.count(new)!=1:
                  raise SystemExit("REVERSE_MODULE_BOUNDARY")
              reconstructed=reconstructed.replace(new,old,1)
          if reconstructed!=baseline:
              raise SystemExit("UNCHANGED_INSTALLER_REMAINDER")
          if len(derived)!=C["opsAfterBytes"] or gitsha(derived)!=C["opsAfter"]:
              raise SystemExit("PREBOUND_EXPECTED_INSTALLER_IDENTITY")
          temp=Path(os.environ["RUNNER_TEMP"])
          generated=(temp/"ops-install.sql").read_bytes()
          if generated!=derived:
              raise SystemExit("CANONICAL_GENERATOR_DIFFERENT_FROM_FULL_MODULE_DERIVATION")
          updated=(temp/"ops-update.sql").read_bytes()
          if len(updated)!=C["updateBytes"] or gitsha(updated)!=C["update"]:
              raise SystemExit("UNCHANGED_UPDATE_IDENTITY")
          plan=(temp/"plan-install.sql").read_bytes()
          if len(plan)!=C["standaloneBytes"] or gitsha(plan)!=C["standalone"] or plan!=Path("TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql").read_bytes():
              raise SystemExit("UNCHANGED_STANDALONE_CANONICAL_IDENTITY")
          envelope={"kind":"CANONICAL_REVIEW_CANDIDATES","baseCommit":C["base"],"sourcePreviewCommit":C["source"],"sourceBlobs":{s["path"]:s["after"] for s in C["sources"]},"builderBlobs":C["builders"],"derivation":{"baselineInstallerBlob":C["opsBefore"],"changedModules":C["sources"][:4],"wholeModuleOccurrences":4,"newModuleInserted":True,"unchangedRemainder":True,"canonicalBytesEqual":True,"unchangedUpdateBlob":C["update"],"unchangedStandaloneBlob":C["standalone"]},"files":{"TestLab/Adapters/OPS-005/sql/install.sql":{"gitBlobSha":gitsha(generated),"byteLength":len(generated),"gzipBase64":base64.b64encode(gzip.compress(generated,compresslevel=9,mtime=0)).decode("ascii")}}}
          encoded=json.dumps(envelope,sort_keys=True,separators=(",",":")).encode("ascii")
          if len(encoded)>2000000 or len(generated)>8000000:
              raise SystemExit("REVIEW_ARTIFACT_SIZE_BOUND")
          def upload(data):
              payload=json.dumps({"encoding":"base64","content":base64.b64encode(data).decode("ascii")}).encode("utf-8")
              request=urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",data=payload,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:
                      raw=response.read(4097)
              except urllib.error.HTTPError as error:
                  raise SystemExit("CANDIDATE_UPLOAD_HTTP_STATUS="+str(error.code)) from None
              if len(raw)>4096 or json.loads(raw).get("sha")!=gitsha(data):
                  raise SystemExit("UPLOAD_RESPONSE_BINDING")
              return gitsha(data)
          # Exactly two bounded blob POSTs, after every source/canonical/reverse proof.
          review_sha=upload(encoded)
          installer_sha=upload(generated)
          print("CANONICAL_REVIEW_ENVELOPE="+review_sha+" BYTES="+str(len(encoded)))
          print("CANONICAL_OPS_INSTALLER="+installer_sha+" BYTES="+str(len(generated)))
          print("CANONICAL_LOADED_MODULE_V1_TRANSPORT_PASS")
