name: Qualify native one-part name parsing

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

jobs:
  parser:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event.before == '62186318e352d6bb26c0a0dfc1d50b5ea57f8177' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c06164ac9a1e53c0fb08e2e6f7b8a7244e3d7ad2
          persist-credentials: false
      - name: Observe PARSENAME and current TVF on a disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c06164ac9a1e53c0fb08e2e6f7b8a7244e3d7ad2
          test "$(git hash-object Code/01_Common/078_TVF_ParsePipeList.sql)" = 9663eb1264d06932ce7dcdaadc51e2d806c027af
          test "$(git hash-object Code/01_Common/080_TVF_ParseSqlNameList.sql)" = 31594f9b1c3cccf859beb356716532a5b8233db8
          container=sqlserver-analyze-name-parser-probe
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          export MSSQL_SA_PASSWORD="Aa9_$(openssl rand -hex 24)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          docker run --detach --name "$container" --hostname sqlserver-analyze-ci \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_COLLATION=SQL_Latin1_General_CP1_CS_AS --env MSSQL_SA_PASSWORD \
            --mount "type=bind,source=$PWD/Code/01_Common,target=/work,readonly" \
            mcr.microsoft.com/mssql/server@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9 >/dev/null
          export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
          sql() {
            timeout 20s docker exec --env SQLCMDPASSWORD "$container" \
              /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -l 3 -t 10 -C -b "$@"
          }
          ready=0
          echo PARSER_STAGE readiness
          for i in $(seq 1 30); do
            if timeout 5s docker exec --env SQLCMDPASSWORD "$container" /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -l 2 -t 3 -C -b -Q 'SET NOCOUNT ON; SELECT 1;' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo PARSER_READINESS_FAILED; exit 1; fi
          echo PARSER_STAGE schema
          sql -Q 'CREATE DATABASE [DeineDatenbank] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [DeineDatenbank] SET COMPATIBILITY_LEVEL = 170;'
          sql -d DeineDatenbank -Q 'CREATE SCHEMA [monitor];'
          sql -i /work/078_TVF_ParsePipeList.sql
          sql -i /work/080_TVF_ParseSqlNameList.sql
          echo PARSER_STAGE observe
          timeout 20s docker exec -i --env SQLCMDPASSWORD "$container" /opt/mssql-tools18/bin/sqlcmd \
            -S 127.0.0.1 -U sa -l 3 -t 10 -C -b -d DeineDatenbank -h -1 -W -s '|' <<'SQL'
          SET NOCOUNT ON;
          DECLARE @cases TABLE ([Id] int PRIMARY KEY, [Input] nvarchar(4000));
          INSERT @cases VALUES
            (0,N'[DeineDatenbank]'),
            (1,N'ExampleSchema.[DeineDatenbank]'),
            (2,N'ExampleDatabase..[DeineDatenbank]'),
            (3,N'ExampleServer.ExampleDatabase..[DeineDatenbank]'),
            (4,N'[Name.With.Dot]'),
            (5,N'..[DeineDatenbank]');
          IF CONVERT(int, SERVERPROPERTY('ProductMajorVersion')) <> 17 THROW 50001,N'ENGINE_VERSION',1;
          IF (SELECT COUNT(*) FROM @cases AS c CROSS APPLY monitor.TVF_ParseSqlNameList(c.[Input]) AS p) <> 6
              THROW 50002,N'PARSER_ROW_COUNT',1;
          IF (SELECT COUNT(*) FROM @cases AS c CROSS APPLY monitor.TVF_ParseSqlNameList(c.[Input]) AS p
              WHERE c.[Id] IN (0,4) AND p.IsValid=1) <> 2 THROW 50003,N'PARSER_POSITIVE_CONTROL',1;
          SELECT CONCAT('PARSER_BOUND|case=',c.[Id],
              '|parts=',IIF(PARSENAME(c.[Input],1) IS NULL,0,1),
                        IIF(PARSENAME(c.[Input],2) IS NULL,0,1),
                        IIF(PARSENAME(c.[Input],3) IS NULL,0,1),
                        IIF(PARSENAME(c.[Input],4) IS NULL,0,1),
              '|valid=',CONVERT(int,p.IsValid),'|code=',COALESCE(p.ErrorCode,'NONE'))
          FROM @cases AS c CROSS APPLY monitor.TVF_ParseSqlNameList(c.[Input]) AS p
          ORDER BY c.[Id];
          GO
          SQL
