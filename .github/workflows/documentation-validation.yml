name: Classify PR 793 release gate failure

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

jobs:
  read-diagnostics:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event.before == 'f1b24c07744bb24afdd18feddd43cc6587159b12' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Read bound artifact and emit only error identifiers
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          endpoint = "https://api.github.com/repos/gecompat/SQL_Server_Analyze/actions/artifacts/14912828574"
          headers = {"Authorization": "Bearer " + os.environ.pop("GH_TOKEN"),
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          no_redirect = urllib.request.build_opener(NoRedirect())
          try:
              with no_redirect.open(urllib.request.Request(endpoint, headers=headers), timeout=15) as response:
                  meta = json.loads(response.read(16384))
              binding = meta.get("workflow_run", {})
              if meta.get("id") != 14912828574 or binding.get("id") != 45377557156 or binding.get("head_sha") != "ce2825bb3b1c1b7ab7db6c1c4f216a1140ae6913":
                  raise ValueError("metadata binding")
              try:
                  with no_redirect.open(urllib.request.Request(endpoint + "/zip", headers=headers), timeout=15):
                      raise ValueError("redirect required")
              except urllib.error.HTTPError as err:
                  if err.code != 302:
                      raise
                  location = err.headers.get("Location", "")
                  err.close()
              target = urllib.parse.urlsplit(location)
              hostname = target.hostname or ""
              if target.scheme != "https" or target.username or target.password or target.port not in (None, 443) or not hostname.endswith(".blob.core.windows.net"):
                  raise ValueError("invalid archive host")
              with no_redirect.open(location, timeout=15) as response:
                  payload = response.read(562025)
              if len(payload) != 562024 or hashlib.sha256(payload).hexdigest() != "140dbd8a19619999ad7e72bb2cd7098673fedaa5258dbc24e69e5f0006deb326":
                  raise ValueError("artifact digest")
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  entries = [item for item in archive.infolist()
                             if item.filename == "ci-lock-diagnostics/impact.log"]
                  if len(entries) != 1 or entries[0].file_size > 16 * 1024 * 1024:
                      raise ValueError("unexpected log entry")
                  log = archive.read(entries[0]).decode("utf-8")
              # Report only fixed vocabulary and case/error numbers. Never emit raw log content.
              if not log:
                  print("ARCHIVE_CLASSIFIED bytes=0")
              else:
                  tokens = {
                      "sqlcmd": "sqlcmd", "docker": "docker", "file": "file",
                      "invalid_name": "invalid filename", "cannot_open": "cannot open",
                      "file_missing": "no such file", "permission_denied": "permission denied",
                      "unknown_command": "unknown command", "syntax_error": "syntax error",
                      "no_container": "no such container", "error_response": "error response",
                      "option": "option", "input": "input", "unexpected": "unexpected",
                      "test_122": "122_prepare", "fixture_complete": "runtime contract passed",
                      "fixture_rejected": "qualified database filter case", "output_resultsets": "with result sets",
                      "compile": "compile", "oom": "out of memory", "login_failed": "login failed",
                      "timed_out": "timed out", "connection": "connection", "driver": "driver",
                      "text_is_error": "error", "msg": "msg", "version": "version",
                  }
                  tail = log[-8192:]
                  lowered = tail.casefold()
                  found = [key for key, value in tokens.items() if value in lowered]
                  codes = [int(value) for value in re.findall(r"(?i)(?:\bmsg\b|\berror(?:\s+number)?\b)\s*[:=(]?\s*([0-9]{1,6})(?![0-9])", log)]
                  items = [int(value) for value in re.findall(r"(?i)qualified database filter case\s+([1-4])\b", log)]
                  stages = [int(n) for n in re.findall(r"RELEASE_GATE\s+([0-9]{1,2})/34:", log)]
                  fixture_ok = "PrepareDatabaseCandidates collation and caller runtime contract passed." in log
                  numbers = sorted({int(n) for n in re.findall(r"\b(?:5571[0-9]|1153[5-9]|102|156|1120|1222|51010|51011)\b", tail)})
                  print(f"ARCHIVE_CLASSIFIED bytes={len(log.encode('utf-8'))} lines={len(log.splitlines())} stages={stages[-6:]} fixture_ok={int(fixture_ok)} labels={found} sql_codes={codes[-12:]} tail_known_numbers={numbers} fixture_cases={items[:4]}")
          except (OSError, ValueError, zipfile.BadZipFile, RuntimeError) as err:
              print(f"ARCHIVE_READ_FAILED kind={type(err).__name__}")
              raise SystemExit(1) from None
