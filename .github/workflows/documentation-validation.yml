name: Canonical SQL name parser artifacts

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}
concurrency:
  group: usage-skill-canonical-review
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == 'a93b0b5c6063ec4329d2ff91caaec000fdc5e58e' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed CDC job mapping preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2bbfd157dfb9c0b9283a46fd90249318966f9b62
          fetch-depth: 6
          persist-credentials: false
          show-progress: false
      - name: Validate and transport the generated view and installers
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          
          config = json.loads(r'''{"preview":"2bbfd157dfb9c0b9283a46fd90249318966f9b62","tree":"d78897e7fcea1f4acb8b47ba2c78f6594d0b16e0","parent":"ccecadcdd7b580b06b751122a41f95a175cfc79e","baseline":"ccecadcdd7b580b06b751122a41f95a175cfc79e","before":"a93b0b5c6063ec4329d2ff91caaec000fdc5e58e","pins":{"Code/07_Infrastructure/080_USP_DataCaptureStatus.sql":"7e5b6bf5af431f4e2bbf8892c47e7c82cbc7fcdd","Metadata/UsageSkills/monitor/USP_DataCaptureStatus.md":"8afa5846e0b8aa3e3f41fa249b0d46ca53ef2cf8","Documentation/Analysis_Guides/Procedures/USP_DataCaptureStatus.md":"362102d7d2f061753f092c41762314ff78d01c96","Code/Tests/Common/147_DataCapture_Collation_Runtime_Contract.sql":"ff8f3213775bd7a435b91a55b9067d39e52a6969","Code/Tests/Run_Release_Gate.sql":"8a2bfd973ae568b94c8b115a17136b1673a116ed","Code/00_Setup/005_VW_ObjectUsageSkills.sql":"31889e6f90dca88f58821657a4cbd9accaad3ce7","Code/10_SnapshotBaseline/012_VW_ObjectUsageSkills_Target.sql":"825c4f1f23d557bd69e6e9edf0082af85a6490a9","Code/Install/usage_skill_generator.py":"5bd8eda4b48dce8a79a12a52a0e40c23c192f063","Code/Install/deployment_generator.py":"99a8e762bc9ffc905dc1fe1d6141bdf98f4d0ca1","Code/Install/Install_All.sql":"aa43d87f582cd9670d285bf04976807601c2ddfe","Code/Install/Install_ExecutionPlanAnalysis.sql":"786f2f3d09dfcf431d58a993266b232db2bc2221","Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","Code/Install/Build-ExecutionPlanAnalysisInstaller.ps1":"d2fdc1cae65ed521162d5936c2015db11d3215f2","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","TestLab/Adapters/OPS-005/sql/install.sql":"18c7e7b78c31d096dd9f3eb5aa0788ef037faedf","TestLab/Adapters/OPS-005/sql/update.sql":"00ecb38206c7972187c411154e2deb298a8c47f5","TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1":"47a4cd3dde1ae85a6ad549fcb6ed2dc683b83979","TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql":"115976241d6169443aef40b600ffc9865ac1e207"},"skills":["Metadata/UsageSkills/monitor/USP_DataCaptureStatus.md"],"modules":["Code/07_Infrastructure/080_USP_DataCaptureStatus.sql"]}''')
          root = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"]) / "cdc-job-artifact-review"
          temp.mkdir(exist_ok=False)
          view = "Code/00_Setup/005_VW_ObjectUsageSkills.sql"
          ops = "TestLab/Adapters/OPS-005/sql/install.sql"
          plan = "TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql"
          update = "TestLab/Adapters/OPS-005/sql/update.sql"
          
          def git_hash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          
          def run(*args, capture=False):
              env = {key: value for key, value in os.environ.items() if key != "GH_TOKEN"}
              return subprocess.run(args, cwd=root, env=env, check=True, timeout=900,
                                    capture_output=capture).stdout
          
          def read(path):
              resolved = (root / path).resolve(strict=True)
              if not resolved.is_file() or not resolved.is_relative_to(root):
                  raise SystemExit("ARTIFACT_PATH_BOUND")
              return resolved.read_bytes()
          
          def replace_once(data, before, after):
              if not before or data.count(before) != 1:
                  raise SystemExit("ARTIFACT_UNIQUE_REPLACEMENT")
              result = data.replace(before, after)
              if result.count(after) != 1 or result.replace(after, before) != data:
                  raise SystemExit("ARTIFACT_REVERSE_REPLACEMENT")
              return result
          
          def embedded_body(data):
              body, count = re.subn(rb"^(?:\xef\xbb\xbf)?USE \[DeineDatenbank\];\r?\nGO\r?\n(?:\r?\n)?", b"", data, count=1)
              if count != 1:
                  raise SystemExit("ARTIFACT_SOURCE_HEADER_BOUND")
              return re.sub(rb"[ \t]+(?=\r?$)", b"", body, flags=re.M).rstrip(b"\r\n")
          
          if run("git", "rev-parse", "HEAD", "HEAD^{tree}", "HEAD^", capture=True).decode().splitlines() != [
                  config["preview"], config["tree"], config["parent"]]:
              raise SystemExit("ARTIFACT_PREVIEW_BOUND")
          for name, expected in config["pins"].items():
              if git_hash(read(name)) != expected:
                  raise SystemExit("ARTIFACT_PIN_MISMATCH: " + name)
          
          def markdown_sql(raw):
              def quote(value):
                  return "N'" + value.replace("'", "''") + "'"
              tokens = []
              for index, line in enumerate(raw.decode("utf-8-sig").replace("\r\n", "\n").split("\n")):
                  if index:
                      tokens.append("NCHAR(10)")
                  while line:
                      end, units = 0, 0
                      for char in line:
                          width = 2 if ord(char) > 0xffff else 1
                          if units + width > 1000:
                              break
                          units += width
                          end += 1
                      piece, line = line[:end], line[end:]
                      prefix = re.match(r"(?i)^([ \t]*)CREATE\s+TABLE\b", piece)
                      if prefix:
                          split_at = len(prefix.group(1)) + 1
                          tokens.append(quote(piece[:split_at]))
                          piece = piece[split_at:]
                      tokens.append(quote(piece))
              first, *rest = tokens or ["N''"]
              return ("CONVERT(nvarchar(max)," + first + ")" + "".join(
                  "\n            + " + item for item in rest) + " AS [SkillMarkdown]").encode("utf-8")

          old_view = read(view)
          expected_view = old_view
          for skill in config["skills"]:
              prior = run("git", "show", config["baseline"] + ":" + skill, capture=True)
              expected_view = replace_once(expected_view, markdown_sql(prior), markdown_sql(read(skill)))
          expected_ops = replace_once(read(ops), embedded_body(old_view), embedded_body(expected_view))
          expected_plan = replace_once(read(plan), embedded_body(old_view), embedded_body(expected_view))
          plan_modules = []
          for module in config["modules"]:
              prior = run("git", "show", config["baseline"] + ":" + module, capture=True)
              before_body, after_body = embedded_body(prior), embedded_body(read(module))
              expected_ops = replace_once(expected_ops, before_body, after_body)
              if before_body in expected_plan:
                  expected_plan = replace_once(expected_plan, before_body, after_body)
                  plan_modules.append(module)
          print("ARTIFACT_EXPECTED_BOUND skills=" + str(len(config["skills"])) +
                " ops_modules=" + str(len(config["modules"])) + " plan_modules=" + str(len(plan_modules)))
          
          skills = "Code/Install/usage_skill_generator.py"
          run(sys.executable, skills, "--repository-root", ".", "--write-views")
          run(sys.executable, skills, "--repository-root", ".", "--check")
          run(sys.executable, "Code/Install/deployment_generator.py", "--repository-root", ".", "--check-snapshot-guard")
          if run("git", "diff", "--name-only", capture=True).decode().splitlines() != [view] or read(view) != expected_view:
              raise SystemExit("ARTIFACT_VIEW_BOUND")
          
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-InstallOutputPath", str(temp / "ops.sql"), "-UpdateOutputPath", str(temp / "update.sql"))
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/EXECUTION-PLAN-001/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-OutputPath", str(temp / "plan.sql"))
          if (temp / "update.sql").read_bytes() != read(update):
              raise SystemExit("ARTIFACT_UPDATE_UNCHANGED")
          generated = {view: read(view), ops: (temp / "ops.sql").read_bytes(), plan: (temp / "plan.sql").read_bytes()}
          if generated != {view: expected_view, ops: expected_ops, plan: expected_plan}:
              raise SystemExit("ARTIFACT_CANONICAL_BYTES_BOUND")
          

          def upload(payload):
              expected = git_hash(payload)
              body = json.dumps({"encoding": "base64", "content": base64.b64encode(payload).decode("ascii")}).encode("ascii")
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
                  data=body, method="POST", headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type":"application/json","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = response.read(4097)
              if len(result) > 4096 or json.loads(result).get("sha") != expected:
                  raise SystemExit("ARTIFACT_UPLOAD_BOUND")
              return expected
          
          def chunks(payload):
              offset = 0
              while offset < len(payload):
                  end = min(offset + 786432, len(payload))
                  while end < len(payload) and (payload[end] & 192) == 128:
                      end -= 1
                  if end <= offset:
                      raise SystemExit("ARTIFACT_CHUNK_BOUND")
                  piece = payload[offset:end]
                  piece.decode("utf-8")
                  yield offset, piece
                  offset = end
          
          bounded_chunks = {path: list(chunks(payload)) for path, payload in generated.items()}
          if sum(map(len, bounded_chunks.values()))>48 or any(
              b"".join(piece for _, piece in bounded_chunks[path]) != payload for path, payload in generated.items()):
              raise SystemExit("ARTIFACT_CHUNK_REPLAY")
          manifest = {"preview": config["preview"], "tree": config["tree"], "parent": config["parent"], "artifacts":[]}
          for path, payload in generated.items():
              manifest["artifacts"].append({"path": path, "bytes": len(payload), "sha": upload(payload),
                  "chunks": [{"offset": offset, "bytes": len(piece), "sha": upload(piece)}
                             for offset, piece in bounded_chunks[path]]})
          envelope = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("ascii")
          if len(envelope)>100000:
              raise SystemExit("ARTIFACT_MANIFEST_SIZE_BOUND")
          print("CDC_JOB_CANONICAL_MANIFEST=" + upload(envelope))
