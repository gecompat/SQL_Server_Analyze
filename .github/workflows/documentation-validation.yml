name: Canonical SSIS receipt OPS verification

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}
concurrency:
  group: usage-skill-canonical-review
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event_name == 'push' && github.event.before == '4fc2d41280b40c85593eedeb0e7878c883176917' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed SSIS source preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ba075d0f4c46479a0ad57645609b9d46884aa98e
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Generate and verify canonical installer bytes
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          
          config = json.loads(r'''{"preview":"ba075d0f4c46479a0ad57645609b9d46884aa98e","tree":"498dbb79b004d4a1bcd20bec619260f45ebcaab2","before":"4fc2d41280b40c85593eedeb0e7878c883176917","beforePins":{"Code/00_Setup/005_VW_ObjectUsageSkills.sql":"3d07acbac99e59798a906ec1bd9da629f63a55db","Code/10_SSIS/033_SsisHandoverReceipt.sql":"0614c258076f0c5d5ea525065a24a65294dc2ce3","Code/10_SSIS/035_InternalSsisExecutionScopes.sql":"aac14db968eb26dd79fedf42ff49c80ff41b0faf","Code/10_SSIS/040_USP_SsisPackageModelAnalysis.sql":"2cdd1f5efb5ee46f8dfc0f5b7802c716ff0a4673","Code/10_SSIS/041_InternalManageSsisHandoverReceipt.sql":"1d810f27e6f321e3aa49bd585c68a03776d1a224","Code/10_SSIS/050_USP_SsisExecutionComparison.sql":"e400750de81c1039240a6d56ecdc9502c500c6b1","Code/10_SSIS/060_USP_SsisExecutionBaseline.sql":"4d4227c9b5bd4a61118b59d8e0cc23b1ae014839","Code/10_SnapshotBaseline/012_VW_ObjectUsageSkills_Target.sql":"825c4f1f23d557bd69e6e9edf0082af85a6490a9","Code/Install/Install_All.sql":"aa43d87f582cd9670d285bf04976807601c2ddfe","Code/Install/Install_SSIS_Analysis.sql":"f300919e9c54a0e08b359f602545f3be3dd00f83","Code/Install/deployment_generator.py":"99a8e762bc9ffc905dc1fe1d6141bdf98f4d0ca1","Code/Install/usage_skill_generator.py":"5bd8eda4b48dce8a79a12a52a0e40c23c192f063","Code/Tests/Integration/212_SsisPackageModelAnalysis_Runtime_Contract.ps1":"56645aabc387f62e1520d9de7bb9526455104e2e","Code/Tests/Integration/215_SsisLocalHandover_Runtime_Contract.sql":"30406aa2784c678ea2e8d4d734f8e86bca78184e","Code/Tests/Integration/216_SsisCatalogHandover_Native_Contract.ps1":"d2577642bb8e35d19263dda70fa00ec74461137b","Code/Tests/Integration/216_SsisCatalogHandover_Transport_Contract.ps1":"491b08b9ca88ae136be7843bc2244b4fdf59f9bb","Code/Tests/Integration/216_SsisExecutionCorrelation_Runtime_Contract.sql":"b1cd2e906915694e3b15e3bcb475a8f11e572c5c","Code/Tests/Integration/218_SsisIterationCorrelation_Runtime_Contract.sql":"358cdd8f0e6c807d4694504b8f38081f71f57c8d","Code/Tests/Integration/219_SsisExecutionScopes_Native_Contract.ps1":"3d929cd92aa78b8d43b84ca31f113657e9b14db4","Code/Tests/Integration/220_SsisExecutionScopes_Runtime_Contract.sql":"f4033712711967228137d286b095c1ac81ce9ac7","Code/Tests/Integration/221_SsisPipelineCorrelation_Native_Contract.ps1":"b52936489d5ff6b4ea042d5ec3df37e4fe2e728e","Code/Tests/Integration/222_SsisPipelineCorrelation_Runtime_Contract.sql":"cf925d2846286e9346de0188569a1df602fe31a2","Code/Tests/Integration/223_SsisPipelineDiagnostics_Runtime_Contract.sql":"66c1e78201bb39ef23b34036f5454a5b6ea4af98","Code/Tests/Integration/225_SsisExecutionComparison_Runtime_Contract.sql":"a4fae1ddfd03bf79ae521ecd968d6369ea02d960","Code/Tests/Integration/226_SsisExecutionComparison_Native_Contract.ps1":"f24d7321737a1cfb83e5af73d7fd41ec14acf6d3","Code/Tests/Integration/227_SsisExecutionBaseline_Runtime_Contract.sql":"bae8d50e7bf749cd8f8e161c54c412461198e571","Code/Tests/Integration/229_Usage_Skills_Framework_Runtime_Contract.sql":"db09c9a8d3a5e6335600ab5145f65a736125e2ea","Code/Tests/Integration/Deployment_Filled_Core.sql":"ad2d627a5311118c675c8e35572d5724fdcfe550","Code/Tests/Integration/Deployment_Prepare_Runtime.py":"a5e51ad5c54575da8281976b33824c03878c7207","Code/Tests/Static/1054_Validate_Usage_Skill_Contract.py":"9e6e17e0d876fae63a2a23da7cf8ec7015ae75ad","Code/Tests/Static/950_Validate_Nonblocking_Metadata.py":"6dc3e23fb32c610c2af3465804e49786a76745ef","Code/Tests/Static/Validate_Deployment_Contract.py":"c445fa8e1ae72378db7a13f6280017e15e290f6c","Code/Tests/Static/Validate_Ssis_Exchange_Contract.py":"06fcad115fd5ca316f7e381478c685963fc872ad","Code/Tools/Invoke-SsisProjectScopeHandover.ps1":"f98e05a9a433e0bb98a203195558db17f8c4460c","Code/Tools/SsisHandoverSupport.psm1":"e3ab06036897a6ddbc94c9a0cbde643f9a59bb18","Documentation/Analysis_Guides/Procedures/USP_SsisExecutionBaseline.md":"85de5ff5771f55cdd456400f55897489143e6d40","Documentation/Analysis_Guides/Procedures/USP_SsisExecutionComparison.md":"a097671c379743add7864f72b4ceda47061f02ad","Documentation/Analysis_Guides/Procedures/USP_SsisPackageModelAnalysis.md":"a37fec24e2ac7fb29c102ceaeed954e2ad8253d8","Documentation/Architecture/SSIS_Analyze_Toolbelt_Exchange_Contract.md":"e9d054e9bf803c46f7352db30365f7562f2e092b","Documentation/Quality/Release_Notes.md":"7e98922d696e801e5bdc7f4761f83387896b76b6","Documentation/README.md":"a28de5d8946e9784e51bd90e39202af7c3a06d59","Documentation/Reference/Object_Reference.md":"1f0454a59aa54725da75bddd5cf8435ad0537daf","Metadata/Inventory/Objects.csv":"05d3e6e9ca2abcf2c79b49d39f7e6b8638f36867","Metadata/Packages/SSIS_001_Dependencies.csv":"1ef50398f02cb0b55e970dc1b0bbe20f0a595d48","Metadata/UsageSkills/README.md":"5174c8e01c42dc7546a946c995c47d30ec22f93d","Metadata/UsageSkills/monitor/InternalManageSsisHandoverReceipt.md":"bd07f07b9613852ed0aa8801d48b5abde8ed04f8","Metadata/UsageSkills/monitor/InternalSsisExecutionScopes.md":"565daf261099460f245dcb3abf5ae04c0314cd66","Metadata/UsageSkills/monitor/SsisHandoverReceipt.md":"c671e033c8137629c980f17e6f89d6c2794de222","Metadata/UsageSkills/monitor/USP_SsisExecutionBaseline.md":"1f70cb3740a2646d9378918da81b5eb6490a7d78","Metadata/UsageSkills/monitor/USP_SsisExecutionComparison.md":"f4cb1e2fa70b92f0e8912c1bb42d7b1b88ff8224","Metadata/UsageSkills/monitor/USP_SsisPackageModelAnalysis.md":"68f3136a240fd879ce9730a2c186f536151f00b2","Metadata/UsageSkills/monitor_metadata/VW_ObjectUsageSkills.md":"d9b0da3b9d13649116ed922bb1fb735916efd823","README.md":"64f75558f1ef55a37e5d1442d30207c52779522d","TestLab/Adapters/EXECUTION-PLAN-001/sql/install.sql":"32f059c7a75c546c8e4793247c8c18d6fcc24c4a","TestLab/Adapters/OPS-005/sql/install.sql":"6242d7216668a93428903fc2e5fb9c9c0d76b9fc","Code/Install/Build-StandaloneInstaller.ps1":"4db9dbfae972d68d7c27d832857e0f084955c668","TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1":"4160bdd1e1df6c557ba2c25dffd502eee1383b15","Code/10_SnapshotBaseline/030_Snapshot_Target_Schema.sql":"62967240befa91207f2084b1c78180e2af6d5cc8"},"expected":{"ops":{"bytes":16742946,"sha":"76db57ddeec6fe60ae842a4b568c0daf220d5b5d"},"update":{"bytes":17380,"sha":"1f7ff87dda9ab630ea9ab720945d77f8c1bb6358"}}}''')
          root = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"]) / "ssis-receipt-canonical"
          temp.mkdir(exist_ok=False)
          
          def git_hash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          
          def run(*args):
              child_env = {key: value for key, value in os.environ.items() if key != "GH_TOKEN"}
              return subprocess.run(args, cwd=root, env=child_env, check=True, timeout=900,
                                    capture_output=args[0] == "git").stdout
          
          def repository_bytes(path):
              resolved = (root / path).resolve(strict=True)
              if not resolved.is_file() or not resolved.is_relative_to(root):
                  raise SystemExit("PATH_BOUND")
              return resolved.read_bytes()
          
          def check_pins(pins):
              for path, expected in pins.items():
                  if git_hash(repository_bytes(path)) != expected:
                      raise SystemExit("BLOB_PIN_MISMATCH: " + path)
          
          if run("git", "rev-parse", "HEAD", "HEAD^{tree}").decode().splitlines() != [config["preview"], config["tree"]]:
              raise SystemExit("CHECKOUT_BOUND")
          check_pins(config["beforePins"])
          run(sys.executable, "Code/Tests/Static/950_Validate_Nonblocking_Metadata.py")
          run(sys.executable, "Code/Install/deployment_generator.py", "--repository-root", ".", "--check-snapshot-guard")
          run("pwsh", "-NoLogo", "-NoProfile", "-File", "TestLab/Adapters/OPS-005/Build-AdapterInstall.ps1",
              "-RepositoryRoot", str(root), "-InstallOutputPath", str(temp / "ops.sql"), "-UpdateOutputPath", str(temp / "update.sql"))
          data = {"ops": (temp / "ops.sql").read_bytes(), "update": (temp / "update.sql").read_bytes()}
          for name, payload in data.items():
              if {"bytes": len(payload), "sha": git_hash(payload)} != config["expected"][name]:
                  raise SystemExit("CANONICAL_BYTES_BOUND: " + name)
              payload.decode("utf-8")
          
          def upload(payload):
              expected = git_hash(payload)
              body = json.dumps({"encoding": "base64", "content": base64.b64encode(payload).decode("ascii")}).encode("ascii")
              request = urllib.request.Request("https://api.github.com/repos/gecompat/SQL_Server_Analyze/git/blobs",
                                               data=body, method="POST", headers={
                                                   "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                   "Content-Type": "application/json",
                                                   "Accept": "application/vnd.github+json",
                                                   "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  content = response.read(4097)
              if len(content) > 4096 or json.loads(content).get("sha") != expected:
                  raise SystemExit("UPLOAD_RESPONSE_BOUND")
              return expected
          
          chunks = []
          offset = 0
          while offset < len(data["ops"]):
              end = min(offset + 786432, len(data["ops"]))
              while end < len(data["ops"]) and (data["ops"][end] & 192) == 128:
                  end -= 1
              if end <= offset:
                  raise SystemExit("CHUNK_BOUND")
              piece = data["ops"][offset:end]
              piece.decode("utf-8")
              chunks.append((offset, piece))
              offset = end
          if len(chunks) > 40 or b"".join(piece for _, piece in chunks) != data["ops"]:
              raise SystemExit("CHUNK_REPLAY_BOUND")
          upload(data["ops"])
          review_chunks = [{"offset": pos, "bytes": len(part), "sha": upload(part)} for pos, part in chunks]
          manifest = json.dumps({"preview": config["preview"], "tree": config["tree"], "pins": config["beforePins"],
                                 "canonical": config["expected"], "opsChunks": review_chunks},
                                sort_keys=True, separators=(",", ":")).encode("ascii")
          if len(manifest) > 100000:
              raise SystemExit("MANIFEST_SIZE_BOUND")
          print("SSIS_RECEIPT_CANONICAL_MANIFEST=" + upload(manifest))
