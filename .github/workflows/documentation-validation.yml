name: Diagnose exact database candidate contract

on:
  push:
    branches: ['codex/ops-installer-upload']
    paths: ['.github/workflows/documentation-validation.yml']

permissions: {}

jobs:
  parser:
    if: github.repository == 'gecompat/SQL_Server_Analyze' && github.ref == 'refs/heads/codex/ops-installer-upload' && github.event.before == '1228e03705374ed93149242262c6c309793a9507' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3bfae160bc1209bbdfaf86822f29d004a03408d5
          persist-credentials: false
      - name: Install and run the pinned Common 122 fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3bfae160bc1209bbdfaf86822f29d004a03408d5
          test "$(git hash-object Code/Tests/Common/122_PrepareDatabaseCandidates_Collation_Runtime_Contract.sql)" = a884619332f62587ab95033ab55f3d7277a2fb56
          test "$(git hash-object Code/Install/Install_All.sql)" = aa43d87f582cd9670d285bf04976807601c2ddfe
          container=sqlserver-analyze-common122-probe
          scratch=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf -- "$scratch"' EXIT
          export MSSQL_SA_PASSWORD="Aa9_$(openssl rand -hex 24)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          docker run --detach --name "$container" --hostname sqlserver-analyze-ci \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_COLLATION=SQL_Latin1_General_CP1_CS_AS --env MSSQL_SA_PASSWORD \
            --mount "type=bind,source=$PWD/Code,target=/work/Code,readonly" \
            mcr.microsoft.com/mssql/server@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9 >/dev/null
          export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
          sql() {
            local work=$1
            shift
            timeout 70s docker exec --workdir "$work" --env SQLCMDPASSWORD "$container" \
              /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -l 3 -t 30 -C -b -r 1 "$@"
          }
          ready=0
          for i in $(seq 1 30); do
            if timeout 5s docker exec --env SQLCMDPASSWORD "$container" /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -l 2 -t 3 -C -b -Q 'SET NOCOUNT ON; SELECT 1;' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo COMMON122_READY_FAILED; exit 1; fi
          if ! sql /work/Code/Tests -Q 'CREATE DATABASE [DeineDatenbank] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [DeineDatenbank] SET COMPATIBILITY_LEVEL = 170;' >/dev/null 2>&1; then echo COMMON122_SETUP_FAILED; exit 1; fi
          install=0
          sql /work/Code/Install -i Install_All.sql >"$scratch/install-out" 2>"$scratch/install-err" || install=$?
          fixture=125
          if [ "$install" = 0 ]; then
            fixture=0
            sql /work/Code/Tests -i Common/122_PrepareDatabaseCandidates_Collation_Runtime_Contract.sql \
              >"$scratch/fixture-out" 2>"$scratch/fixture-err" || fixture=$?
          fi
          python3 - "$scratch" "$install" "$fixture" <<'PY'
          import re
          import sys
          from pathlib import Path
          path, install, fixture = Path(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3])
          def read(name):
              target = path / name
              if not target.exists():
                  return ""
              if target.stat().st_size > 8 * 1024 * 1024:
                  raise SystemExit("CAPTURE_TOO_LARGE")
              return target.read_text("utf-8", errors="replace")
          stdout = read("fixture-out")
          stderr = read("fixture-err") if install == 0 else read("install-err")
          codes = [int(value) for value in re.findall(r"(?i)\bmsg\s+([0-9]{1,6})\b", stderr)]
          candidates = [int(value) for value in re.findall(r"(?i)qualified database filter case\s+([1-4])\b", stdout + stderr)]
          sqlstates = sorted(set(re.findall(r"(?i)\bSQLSTATE[: =]+([0-9A-Z]{5})\b", stderr)))[:8]
          known = {name:int(phrase in stderr.casefold()) for name,phrase in (
              ("resultset_contract","with result sets"),("sqlcmd","sqlcmd"),("syntax","syntax"),
              ("invalid","invalid"),("prepare","preparedatabasecandidates"),
              ("fixture_oracle","qualified database filter"),("conversion","convert"))}
          passed = int("PrepareDatabaseCandidates collation and caller runtime contract passed." in (stdout + stderr))
          all_text = (stdout + "\n" + stderr).casefold()
          fixture_messages = {
              55710:"usp_preparedatabasecandidates returned an unexpected runtime contract",
              55711:"usp_preparedatabasecandidates changed caller state or candidate output",
              55712:"usp_preparedatabasecandidates target collation contract mismatch",
              55713:"usp_preparedatabasecandidates target schema count mismatch",
              55714:"preparedatabasecandidates runtime probe leaked outer caller state",
              55715:"databasecandidates help path performed functional work or changed caller state",
              55716:"namefilters help path performed functional work or changed caller state",
              55717:"preparation helper help probe leaked outer caller state",
              55718:"preparedatabasecandidates accepted or wrote output for a qualified database filter",
              55719:"parsesqlnamelist rejected a single bracketed name containing a dot",
          }
          matched = sorted(number for number, message in fixture_messages.items() if message in all_text)
          fields = sorted(set(re.findall(r"(?i)\b(?:msg|message|error|state|line|level)[ :]+([0-9]{1,6})\b", stderr)))[:15]
          likely = sorted(set(re.findall(r"\b(?:5571[0-9]|1153[5-9]|5101[0-9]|1222|102|156|2812|229)\b", stderr)))
          print(f"COMMON122_EXACT install_exit={install} fixture_exit={fixture} passed={passed} stderr_bytes={len(stderr.encode('utf-8'))} fixture_messages={matched} fields={fields} known_numbers={likely} codes={codes[-15:]} states={sqlstates} labels={known} cases={candidates[:4]}")
          raise SystemExit(0 if install == fixture == 0 and passed else 1)
          PY
