name: Navigator diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Capture navigator validation result
        shell: bash
        run: |
          set -o pipefail
          python3 ./Code/Tests/Static/905_Validate_Analysis_Navigator.py \
            --repository-root . 2>&1 | tee "$RUNNER_TEMP/navigator-validation.log"
      - name: Upload diagnostic result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: navigator-validation-result
          path: ${{ runner.temp }}/navigator-validation.log
          if-no-files-found: error
          retention-days: 1
