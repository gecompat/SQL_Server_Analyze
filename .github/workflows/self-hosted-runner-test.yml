name: Self-hosted Runner - Docker & Hyper-V test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  runner-test:
    name: Docker + Hyper-V capability test
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell - Docker info
        shell: powershell
        run: |
          Write-Host '=== Docker version ==='
          docker --version
          Write-Host '=== Docker info ==='
          docker info
          Write-Host '=== Docker run hello-world ==='
          docker run --rm hello-world

      - name: PowerShell - Host and Hyper-V checks
        shell: powershell
        run: |
          Write-Host '=== Computer info ==='
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List
          Write-Host '=== OS info ==='
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName, DisplayVersion, CurrentBuild | Format-List
          Write-Host '=== Hyper-V VMs (if module available) ==='
          try {
            Import-Module Hyper-V -ErrorAction Stop
            Get-VM | Select-Object Name, State | Format-Table -AutoSize
          } catch {
            Write-Host 'Hyper-V module not available or not permitted in this context: ' $_
          }

      - name: Output working directories
        shell: powershell
        run: |
          Write-Host 'Runner root:' $env:GITHUB_WORKSPACE
          Write-Host 'Runner temp:' $env:RUNNER_TEMP
          Write-Host 'Runner toolcache:' $env:RUNNER_TOOL_CACHE
