name: Native SQL Server release matrix

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Native SQL Server version or complete release-candidate matrix'
        required: true
        type: choice
        default: all
        options:
          - all
          - '2019'
          - '2022'
          - '2025'
      snapshot_risk_gate:
        description: 'Also qualify packaged Snapshot and migration contracts on one explicit native target'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select native targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - id: matrix
        name: Build requested target matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.snapshot_risk_gate }}' = 'true' ] && [ '${{ inputs.target }}' = 'all' ]; then
            echo 'Snapshot risk qualification requires one explicit native target.'
            exit 1
          fi
          case '${{ inputs.target }}' in
            all)
              matrix='{"include":[{"version":"2019","major":"15","compatibility":"150","image":"mcr.microsoft.com/mssql/server:2019-latest","container":"sqlserver-analyze-native-2019","permission_test":"Permissions/110_SQL_Server_2019_Permission_Matrix.sql","regex":false},{"version":"2022","major":"16","compatibility":"160","image":"mcr.microsoft.com/mssql/server:2022-latest","container":"sqlserver-analyze-native-2022","permission_test":"Permissions/110_SQL_Server_2022_Permission_Matrix.sql","regex":false},{"version":"2025","major":"17","compatibility":"170","image":"mcr.microsoft.com/mssql/server:2025-latest","container":"sqlserver-analyze-native-2025","permission_test":"Permissions/110_SQL_Server_2022_Permission_Matrix.sql","regex":true}]}'
              ;;
            2019)
              matrix='{"include":[{"version":"2019","major":"15","compatibility":"150","image":"mcr.microsoft.com/mssql/server:2019-latest","container":"sqlserver-analyze-native-2019","permission_test":"Permissions/110_SQL_Server_2019_Permission_Matrix.sql","regex":false}]}'
              ;;
            2022)
              matrix='{"include":[{"version":"2022","major":"16","compatibility":"160","image":"mcr.microsoft.com/mssql/server:2022-latest","container":"sqlserver-analyze-native-2022","permission_test":"Permissions/110_SQL_Server_2022_Permission_Matrix.sql","regex":false}]}'
              ;;
            2025)
              matrix='{"include":[{"version":"2025","major":"17","compatibility":"170","image":"mcr.microsoft.com/mssql/server:2025-latest","container":"sqlserver-analyze-native-2025","permission_test":"Permissions/110_SQL_Server_2022_Permission_Matrix.sql","regex":true}]}'
              ;;
            *)
              echo 'Unsupported native target.'
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Build and validate immutable release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Build release ZIP from the event commit
        shell: pwsh
        run: |
          ./Code/Install/Build-ReleasePackage.ps1 -RepositoryRoot . `
            -Revision $env:GITHUB_SHA -Version 1.1.2 `
            -OutputDirectory "$env:RUNNER_TEMP/product" -PythonExecutable python3
      - name: Validate canonical contents and repository privacy
        run: |
          python3 Code/Tests/Static/Validate_Release_Package.py --self-test
          python3 Code/Tests/Static/Validate_Release_Package.py \
            --repository-root . --expected-commit "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/product/SQL_Server_Analyze-1.1.2.zip"
      - id: digest
        name: Bind the native jobs to the ZIP bytes
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/product/SQL_Server_Analyze-1.1.2.zip" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-product
          path: ${{ runner.temp }}/product/*
          if-no-files-found: error
          retention-days: 1

  native:
    needs: [select, package]
    name: SQL Server ${{ matrix.version }} native release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - uses: actions/download-artifact@v8
        with:
          name: release-product
          path: ${{ runner.temp }}/product

      - name: Prepare isolated SQL files
        shell: bash
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual=$(sha256sum "$RUNNER_TEMP/product/SQL_Server_Analyze-1.1.2.zip" | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_PACKAGE_SHA256"
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          source = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(source/'product/SQL_Server_Analyze-1.1.2.zip') as package:
              metadata = json.loads(package.read('SQL_Server_Analyze-1.1.2/RELEASE.json'))
              assert metadata['source_commit'] == os.environ['GITHUB_SHA'], 'PACKAGE_COMMIT_MISMATCH'
              package.extractall(source/'release')
          PY
          release_root="$RUNNER_TEMP/release/SQL_Server_Analyze-1.1.2"
          cp -R "$release_root/Code" "$RUNNER_TEMP/Code"
          find "$RUNNER_TEMP/Code" -type f -name '*.sql' -print0 \
            | xargs -0 perl -pi -e 's/\[DeineDatenbank\]/[SQLServerAnalyzeTest]/g'
          if [ '${{ matrix.version }}' = '2025' ] || [ '${{ inputs.snapshot_risk_gate }}' = 'true' ]; then
            python3 "$release_root/Code/Tests/Integration/Deployment_Prepare_Runtime.py" \
              --packaged-installer "$release_root/Code/Install/generated/Deploy_All_WithSnapshotBaseline.generated.sql" \
              --output "$RUNNER_TEMP/Code/Install/generated/Deployment_Runtime.generated.sql"
            python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'Code'
          for filename, names in (
              ('193_ExecutionPlanAnalysis_Standalone_Runtime_Contract.sql', ['ExecutionPlanAnalysis']),
              ('195_SnapshotBaseline_Runtime_Contract.sql', ['SnapshotBaseline_Target', 'SnapshotBaseline_Framework'])):
              path = root/'Tests/Integration'/filename
              text = path.read_text()
              for name in names:
                  text = text.replace(':r Install_'+name+'.sql', ':r generated/Install_'+name+'.generated.sql')
              path.write_text(text)
          deploy = root/'Install/generated/Deploy_All.generated.sql'
          configured = deploy.read_text().replace("@FrameworkDatabase nvarchar(max)=N'DeineDatenbank'",
              "@FrameworkDatabase nvarchar(max)=N'SQLServerAnalyzePackageDeployment'", 1)
          assert configured != deploy.read_text(), 'DEPLOYMENT_TARGET_NOT_CONFIGURED'
          (root/'Install/generated/Release_Deploy_Configured.sql').write_text(configured)
          # Reuse the synthetic fixtures and comparison helpers against the
          # actual shipped Core deployment, with all nine Core tables filled.
          import re, sys
          canonical = pathlib.Path(os.environ['RUNNER_TEMP'])/'release/SQL_Server_Analyze-1.1.2'
          sys.path.insert(0, str(canonical/'Code/Tests/Integration'))
          import Deployment_Prepare_Runtime as regression
          g = regression.g
          _, tables, digest = g.load_sources(canonical, False)
          shipped_digest = re.search(r'Source SHA256: ([0-9a-f]{64});', deploy.read_text()).group(1)
          assert digest == shipped_digest, 'PACKAGED_DEPLOYMENT_SOURCE_MISMATCH'
          db = 'SQLServerAnalyzePackageDeployment'
          fixture = (canonical/'Code/Tests/Integration/Deployment_Filled_Core.sql').read_text()
          omitted = [line for line in fixture.splitlines() if line.startswith('UPDATE monitor.SnapshotTargetConfiguration ')]
          assert len(omitted) == 1
          fixture = fixture.replace(omitted[0], '').replace('USE [DeineDatenbank];', 'USE ['+db+'];', 1)
          before = ['USE ['+db+'];\nGO\nCREATE SCHEMA qa AUTHORIZATION dbo;\nGO\n', fixture,
                    'CREATE TABLE qa.BeforeMeta(TableName sysname,IdentityValue decimal(38,0) NULL);\n']
          after = ['USE ['+db+'];\nGO\n',
              "IF (SELECT COUNT(*) FROM sys.tables WHERE schema_id=SCHEMA_ID(N'monitor_deployment') AND name LIKE N'Run[_]%')<>2 THROW 53806,N'Packaged receipt count.',1;\n",
              "DECLARE @Run sysname=(SELECT TOP(1) name FROM sys.tables WHERE schema_id=SCHEMA_ID(N'monitor_deployment') AND name LIKE N'Run[_]%' ORDER BY create_date DESC,object_id DESC),@Manifest nvarchar(max),@State sysname,@Compare nvarchar(max),@Read nvarchar(max);\n",
              "SET @Read=N'SELECT @Result=Manifest FROM monitor_deployment.'+QUOTENAME(@Run)+N' WHERE DatabaseRole=''FRAMEWORK'' AND FormatVersion=1 AND SourceSha256=0x"+digest+"'; EXEC sys.sp_executesql @Read,N'@Result nvarchar(max) OUTPUT',@Manifest OUTPUT; IF @Manifest IS NULL THROW 53803,N'Packaged receipt binding.',1;\n"]
          mutable = {'FrameworkVersion','WaitTypeCatalog','WaitTypeCatalogSource',
                     'ToolBackgroundQueryPattern','PlanAnalysisProfile','PlanAnalysisRuleThreshold'}
          assert len(tables) == 9 and mutable <= {table.name for table in tables}
          for i, table in enumerate(tables, 1):
              cols = regression.binary_columns(table)
              before.append("IF NOT EXISTS(SELECT 1 FROM "+table.object_name+") THROW 53804,N'Unfilled packaged fixture.',1;\n")
              before.append('SELECT * INTO qa.Before_'+str(i)+' FROM '+table.object_name+';\n')
              before.append('INSERT qa.BeforeMeta VALUES('+g.lit(table.name)+',CONVERT(decimal(38,0),IDENT_CURRENT('+g.lit(table.object_name)+')));\n')
              if table.name in mutable:
                  after.append("SET @State=NULL; SELECT @State=archiveName FROM OPENJSON(@Manifest) WITH(originalSchema sysname,originalObject sysname,archiveName sysname) WHERE originalSchema="+g.lit(table.schema)+" AND originalObject="+g.lit(table.name)+"; IF @State IS NULL THROW 53812,N'Missing packaged archive.',1;\n")
                  compare = regression.equal_rows('qa.Before_'+str(i),'monitor_deployment.[ARCHIVE]',cols,'packaged archive '+table.name)
                  after.append('SET @Compare=REPLACE('+g.lit(compare)+",N'[ARCHIVE]',QUOTENAME(@State)); EXEC sys.sp_executesql @Compare;\n")
              if 'IsFrameworkDefault' in table.columns:
                  after.append(regression.equal_rows('(SELECT * FROM qa.Before_'+str(i)+' WHERE IsFrameworkDefault=0) b',
                      '(SELECT * FROM '+table.object_name+' WHERE IsFrameworkDefault=0) a', cols,'packaged custom '+table.name))
              elif table.name == 'FrameworkVersion':
                  predicate = " WHERE FrameworkName<>N'SQLServerMonitoringFramework'"
                  after.append(regression.equal_rows('(SELECT * FROM qa.Before_'+str(i)+predicate+') b',
                      '(SELECT * FROM '+table.object_name+predicate+') a',cols,'packaged other framework'))
              else:
                  after.append(regression.equal_rows('qa.Before_'+str(i),table.object_name,cols,'packaged active '+table.name))
              after.append('IF EXISTS(SELECT 1 FROM qa.BeforeMeta WHERE TableName='+g.lit(table.name)+' AND IdentityValue<>CONVERT(decimal(38,0),IDENT_CURRENT('+g.lit(table.object_name)+"))) THROW 53807,N'Packaged identity changed.',1;\n")
          before.append("SELECT OBJECT_DEFINITION(OBJECT_ID(N'monitor.VW_AnalyseAccessPolicy')) AS Definition INTO qa.BeforePolicy;\n")
          after.append("IF EXISTS(SELECT 1 FROM qa.BeforePolicy WHERE CONVERT(varbinary(max),Definition)<>CONVERT(varbinary(max),OBJECT_DEFINITION(OBJECT_ID(N'monitor.VW_AnalyseAccessPolicy')))) THROW 53808,N'Packaged policy changed.',1;\n")
          for name in ('FrameworkInstallationHistory','FrameworkExpectedObject','FrameworkProcedureContract'):
              before.append('SELECT * INTO qa.Before_'+name+' FROM monitor.'+name+';\n')
              after.append(regression.equal_rows('qa.Before_'+name,'monitor.'+name,
                  'CONVERT(varbinary(max),Id) AS Id,CONVERT(varbinary(max),Value) AS Value','packaged legacy '+name))
          after.append("IF EXISTS(SELECT 1 FROM monitor.PlanAnalysisProfile WHERE ProfileCode='BALANCED' AND IsEnabled<>0) OR EXISTS(SELECT 1 FROM monitor.PlanAnalysisRuleThreshold WHERE ProfileCode='BALANCED' AND IsEnabled<>0) OR EXISTS(SELECT 1 FROM monitor.ToolBackgroundQueryPattern WHERE RuleCode='SSMS_OBJECT_EXPLORER' AND IsEnabled<>0) THROW 53809,N'Packaged activation overwritten.',1;\n")
          after.append("IF EXISTS(SELECT 1 FROM monitor.WaitTypeCatalog WHERE WaitType=N'CURSOR') OR EXISTS(SELECT 1 FROM monitor.WaitTypeCatalogSource WHERE WaitType=N'CURSOR') THROW 53810,N'Packaged retired defaults remain.',1;\n")
          for name, text in (('Before', before), ('After', after)):
              (root/('Install/generated/Release_Deploy_'+name+'.sql')).write_text(''.join(text), encoding='utf-8')
          PY
          fi

      - name: Generate ephemeral SQL credential
        shell: bash
        run: |
          set -euo pipefail
          credential="A$(openssl rand -hex 16)a1!"
          echo "::add-mask::$credential"
          echo "MSSQL_EPHEMERAL_CREDENTIAL=$credential" >> "$GITHUB_ENV"

      - name: Start native SQL Server target
        shell: bash
        env:
          SQLSERVER_IMAGE: ${{ matrix.image }}
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          docker pull --quiet "$SQLSERVER_IMAGE" >/dev/null
          image_digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$SQLSERVER_IMAGE")
          if [[ ! "$image_digest" =~ ^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$ ]]; then
            echo 'SQL Server container image digest validation failed.'
            exit 1
          fi
          echo "SQLSERVER_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          docker run --name "$SQLSERVER_CONTAINER" \
            --cidfile "$RUNNER_TEMP/native.cid" \
            --label "release-owner=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.version }}" \
            --detach \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_COLLATION=SQL_Latin1_General_CP1_CS_AS \
            --env MSSQL_SA_PASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --volume "$RUNNER_TEMP/Code:/work/Code:ro" \
            "$image_digest" >/dev/null

      - name: Wait for SQL Server readiness
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
          SQLSERVER_MAJOR: ${{ matrix.major }}
        run: |
          set -euo pipefail
          sqlcmd_path=''
          ready=0
          readiness_query="SET NOCOUNT ON; IF TRY_CONVERT(int,SERVERPROPERTY(N'ProductMajorVersion'))<>$SQLSERVER_MAJOR THROW 50000,N'VERSION_NOT_READY',1; IF CONVERT(sysname,SERVERPROPERTY(N'Collation'))<>N'SQL_Latin1_General_CP1_CS_AS' OR CONVERT(sysname,DATABASEPROPERTYEX(N'tempdb',N'Collation'))<>N'SQL_Latin1_General_CP1_CS_AS' THROW 50001,N'COLLATION_NOT_READY',1; SELECT 1;"
          for attempt in $(seq 1 120); do
            sqlcmd_path=$(docker exec "$SQLSERVER_CONTAINER" bash -lc \
              "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi" \
              || true)
            if [ -n "$sqlcmd_path" ] && docker exec \
              --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              "$SQLSERVER_CONTAINER" \
              "$sqlcmd_path" -S localhost -U sa -C -b -Q "$readiness_query" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 40 "$SQLSERVER_CONTAINER"
            exit 1
          fi
          echo "SQLCMD_PATH=$sqlcmd_path" >> "$GITHUB_ENV"

      - name: Create synthetic test database
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
          SQLSERVER_COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          set -euo pipefail
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -Q \
            "CREATE DATABASE [SQLServerAnalyzeTest] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [SQLServerAnalyzeTest] SET COMPATIBILITY_LEVEL = $SQLSERVER_COMPATIBILITY;" \
            >/dev/null

      - name: Install framework from the shipped standalone installer
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/native-${{ matrix.version }}-install.log"
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Install \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -i generated/Install_All.generated.sql \
            >"$install_log" 2>&1; then
            grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "$install_log" | tail -n 120 || true
            exit 1
          fi

      - name: Capture public engine metadata
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
          EXPECTED_MAJOR: ${{ matrix.major }}
          EXPECTED_COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          set -euo pipefail
          docker exec --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -h -1 -W -Q \
            "SET NOCOUNT ON; SELECT CONCAT(CONVERT(varchar(30),SERVERPROPERTY(N'ProductVersion')),N'|',(SELECT compatibility_level FROM sys.databases WHERE name=N'SQLServerAnalyzeTest'),N'|',CONVERT(sysname,SERVERPROPERTY(N'Collation')),N'|',(SELECT host_platform FROM sys.dm_os_host_info));" \
            > "$RUNNER_TEMP/engine.txt"
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          fields = (root/'engine.txt').read_text().strip().split('|')
          assert len(fields) == 4 and re.fullmatch(r'\d+\.\d+\.\d+\.\d+', fields[0]), 'ENGINE_METADATA_INVALID'
          parts = [int(part) for part in fields[0].split('.')]
          assert parts[0] == int(os.environ['EXPECTED_MAJOR']), 'ENGINE_MAJOR_MISMATCH'
          assert fields[1] == os.environ['EXPECTED_COMPATIBILITY'], 'ENGINE_CL_MISMATCH'
          assert fields[2:] == ['SQL_Latin1_General_CP1_CS_AS', 'Linux'], 'ENGINE_PLATFORM_MISMATCH'
          (root/'engine.json').write_text(json.dumps(dict(product_version_components=parts,
              compatibility_level=int(fields[1]), collation=fields[2], platform=fields[3])))
          PY

      - name: Run full release gate
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          release_log="$RUNNER_TEMP/native-${{ matrix.version }}-release.log"
          if ! docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Tests \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -i Run_Release_Gate.sql \
            >"$release_log" 2>&1; then
            grep -B 2 -A 4 -E 'Msg [0-9]+|Sqlcmd: Error|Error:' "$release_log" | tail -n 160 || true
            exit 1
          fi
          grep -Eq '^AVAILABLE[[:space:]]+0[[:space:]]+34[[:space:]]' "$release_log"

      - name: Run native permission matrix
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
          PERMISSION_TEST: ${{ matrix.permission_test }}
          EXPECTED_MAJOR: ${{ matrix.major }}
        run: |
          set -euo pipefail
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Tests \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b \
            -v PermissionMatrixPassword="$MSSQL_EPHEMERAL_CREDENTIAL" ExpectedMajorVersion="$EXPECTED_MAJOR" \
            -i "$PERMISSION_TEST" >/dev/null

      - name: Run SQL Server 2025 regex matrix
        if: matrix.regex == true
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Tests \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b \
            -i VersionAdaptive/120_SQL_Server_2025_Regex_Matrix.sql >/dev/null

      - name: Run selected packaged deployment and preservation contracts
        if: matrix.regex == true || inputs.snapshot_risk_gate
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          execute() {
            docker exec --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              --workdir /work/Code/Install "$SQLSERVER_CONTAINER" \
              "$SQLCMD_PATH" -S localhost -U sa -C -b -I "$@"
          }
          execute -Q "CREATE DATABASE [SQLServerAnalyzePackageDeployment] COLLATE SQL_Latin1_General_CP1_CS_AS;" >/dev/null
          execute -i generated/Release_Deploy_Configured.sql >"$RUNNER_TEMP/deployment-1.log" 2>&1
          execute -i generated/Release_Deploy_Before.sql >"$RUNNER_TEMP/deployment-fill.log" 2>&1
          execute -i generated/Release_Deploy_Configured.sql >"$RUNNER_TEMP/deployment-2.log" 2>&1
          execute -i generated/Release_Deploy_After.sql >"$RUNNER_TEMP/deployment-preservation.log" 2>&1
          execute -Q "IF NOT EXISTS(SELECT 1 FROM SQLServerAnalyzePackageDeployment.monitor.FrameworkVersion WHERE FrameworkVersion='1.1.2') THROW 50002,N'PACKAGE_DEPLOYMENT_VERSION',1;" >/dev/null
          execute -i generated/Deployment_Runtime.generated.sql >"$RUNNER_TEMP/deployment-regression.log" 2>&1

      - name: Run selected packaged Snapshot and concurrency contracts
        if: matrix.regex == true || inputs.snapshot_risk_gate
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          execute() {
            docker exec --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
              --workdir /work/Code/Install "$SQLSERVER_CONTAINER" \
              "$SQLCMD_PATH" -S localhost -U sa -C -b "$@"
          }
          execute -Q "CREATE DATABASE [SQLServerAnalyzeSnapshotTest] COLLATE Latin1_General_100_CI_AS; ALTER DATABASE [SQLServerAnalyzeSnapshotTest] SET COMPATIBILITY_LEVEL=${{ matrix.compatibility }};" >/dev/null
          execute -i ../Tests/Integration/195_SnapshotBaseline_Runtime_Contract.sql >"$RUNNER_TEMP/snapshot.log" 2>&1
          execute -i ../Tests/Integration/196_SnapshotBaseline_Concurrency_Holder.sql >"$RUNNER_TEMP/snapshot-holder.log" 2>&1 &
          holder_pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if execute -d SQLServerAnalyzeTest -Q "IF APPLOCK_TEST(N'public',N'SQL_Server_Analyze.SC023.CollectionCycle',N'Exclusive',N'Session')<>0 THROW 53740,N'SC023_LOCK_NOT_READY',1;" >/dev/null 2>&1; then
              ready=1
              break
            fi
            kill -0 "$holder_pid" 2>/dev/null || break
            sleep 0.2
          done
          test "$ready" = 1
          execute -i ../Tests/Integration/197_SnapshotBaseline_Concurrency_Assert.sql >"$RUNNER_TEMP/snapshot-concurrency.log" 2>&1
          wait "$holder_pid"

      - name: Run SQL Server 2025 standalone plan analysis contract
        if: matrix.regex == true
        shell: bash
        env:
          SQLSERVER_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b -Q \
            "ALTER DATABASE [SQLServerAnalyzeTest] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [SQLServerAnalyzeTest]; CREATE DATABASE [SQLServerAnalyzeTest] COLLATE SQL_Latin1_General_CP1_CS_AS; ALTER DATABASE [SQLServerAnalyzeTest] SET COMPATIBILITY_LEVEL = 170; ALTER DATABASE [SQLServerAnalyzeTest] SET QUERY_STORE = OFF;" \
            >/dev/null
          docker exec \
            --env SQLCMDPASSWORD="$MSSQL_EPHEMERAL_CREDENTIAL" \
            --workdir /work/Code/Install \
            "$SQLSERVER_CONTAINER" \
            "$SQLCMD_PATH" -S localhost -U sa -C -b \
            -i ../Tests/Integration/193_ExecutionPlanAnalysis_Standalone_Runtime_Contract.sql >/dev/null

      - name: Stop synthetic SQL Server and verify removal
        if: always()
        shell: bash
        env:
          RELEASE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/native.cid" ]; then
            cid=$(cat "$RUNNER_TEMP/native.cid")
            [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
            owner=$(docker inspect --format '{{index .Config.Labels "release-owner"}}' "$cid")
            test "$owner" = "$RELEASE_OWNER"
            docker rm --force "$cid" >/dev/null
            remaining=$(docker container ls -a --no-trunc --filter "id=$cid" --format '{{.ID}}')
            test -z "$remaining"
          fi

      - name: Record verified execution scope
        shell: bash
        env:
          TARGET_VERSION: ${{ matrix.version }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
          SNAPSHOT_RISK_GATE: ${{ inputs.snapshot_risk_gate }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root/'engine.json').read_text())
          metadata.update(schema_version=1, framework_version='1.1.2',
              source_commit=os.environ['GITHUB_SHA'], package_sha256=os.environ['PACKAGE_SHA256'],
              container_image_digest=os.environ['SQLSERVER_IMAGE_DIGEST'],
              target=os.environ['TARGET_VERSION'], executed_suites=34,
              release_gate='PASS', permission_matrix='PASS', cleanup='PASS',
              extra_2025_contracts='PASS' if os.environ['TARGET_VERSION']=='2025' else 'NOT_APPLICABLE',
              snapshot_and_migration_contracts='PASS' if os.environ['TARGET_VERSION']=='2025' or os.environ['SNAPSHOT_RISK_GATE']=='true' else 'NOT_APPLICABLE',
              run_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'])
          payload = json.dumps(metadata, indent=2)+'\n'
          assert len(payload.encode()) < 65536
          (root/('evidence-'+os.environ['TARGET_VERSION']+'.json')).write_text(payload)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Native release gate: PASS; target='+metadata['target']+'; cleanup=PASS\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.version }}
          path: ${{ runner.temp }}/evidence-${{ matrix.version }}.json
          if-no-files-found: error
          retention-days: 1

  evidence:
    name: Bind successful native evidence to the product ZIP
    needs: [select, package, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/evidence
      - name: Validate complete requested target set
        env:
          MATRIX: ${{ needs.select.outputs.matrix }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          expected = {item['version'] for item in json.loads(os.environ['MATRIX'])['include']}
          rows = [json.loads(path.read_text()) for path in sorted(root.glob('evidence-*.json'))]
          assert len(rows) == len(expected) and {row['target'] for row in rows} == expected
          for row in rows:
              major = {'2019':15, '2022':16, '2025':17}[row['target']]
              assert row['schema_version'] == 1 and row['framework_version'] == '1.1.2'
              assert row['source_commit'] == os.environ['GITHUB_SHA']
              assert row['package_sha256'] == os.environ['PACKAGE_SHA256']
              assert all(row[key] == 'PASS' for key in ('release_gate','permission_matrix','cleanup'))
              assert row['executed_suites'] == 34
              assert row['product_version_components'][0] == major and row['compatibility_level'] == major*10
              assert row['platform'] == 'Linux' and row['collation'] == 'SQL_Latin1_General_CP1_CS_AS'
              assert row['extra_2025_contracts'] == ('PASS' if major==17 else 'NOT_APPLICABLE')
          result = dict(schema_version=1, framework_version='1.1.2', source_commit=os.environ['GITHUB_SHA'],
              package_sha256=os.environ['PACKAGE_SHA256'], complete_release_matrix=expected=={'2019','2022','2025'},
              targets=rows)
          payload = json.dumps(result, indent=2)+'\n'
          assert len(payload.encode()) < 262144
          (root/'release-evidence.json').write_text(payload)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-qualification
          path: ${{ runner.temp }}/evidence/release-evidence.json
          if-no-files-found: error
          retention-days: 1
