name: Windows self-hosted validation

on:
  push:
    branches:
      - main
      - 'windows-validation/**'
    paths:
      - '.github/workflows/windows-self-hosted-validation.yml'
      - 'Code/**/*.sql'
      - 'Code/Install/*.ps1'
      - 'Code/Tests/Integration/*Installer_Contract.ps1'
      - 'Code/Tests/Static/910_Validate_Repository_Privacy.py'
      - 'Code/Tests/Static/Repository_Privacy_Fixtures.json'
      - 'Lab/**/*.ps1'
      - 'Lab/**/*.psd1'
      - 'Lab/**/*.psm1'
      - 'Lab/**/*.json'
      - 'Metadata/Quality/Repository_Privacy_Allowlist.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-self-hosted-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository on Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - id: toolchain
        name: Validate Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ($env:RUNNER_OS -ne 'Windows') {
            throw 'The selected self-hosted runner is not a Windows runner.'
          }
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw 'PowerShell 7 or newer is required.'
          }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw 'Git is unavailable on the Windows runner.'
          }

          $pythonCommand = $null
          foreach ($candidate in 'python3', 'python') {
            $command = Get-Command $candidate -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $command) {
              continue
            }
            & $command.Source --version
            if ($LASTEXITCODE -eq 0) {
              $pythonCommand = $command
              break
            }
          }
          if ($null -eq $pythonCommand) {
            throw 'Python is unavailable on the Windows runner.'
          }

          "python=$($pythonCommand.Source)" >> $env:GITHUB_OUTPUT
          Write-Output 'WINDOWS_TOOLCHAIN=READY'

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $parseErrors = [Collections.Generic.List[object]]::new()
          foreach ($file in @(
              Get-ChildItem -LiteralPath ./Code/Install, ./Code/Tests/Integration, ./Lab -Recurse -File |
                Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
            )) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            foreach ($errorItem in @($errors)) {
              $parseErrors.Add([pscustomobject] @{
                RelativePath = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $file.FullName)
                Message = $errorItem.Message
              })
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table -AutoSize
            throw "PowerShell parsing reported $($parseErrors.Count) error(s)."
          }
          Write-Output 'POWERSHELL_PARSE=PASS'

      - name: Validate repository and Windows delivery ZIP privacy
        shell: pwsh
        env:
          PYTHON_COMMAND: ${{ steps.toolchain.outputs.python }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          & $env:PYTHON_COMMAND ./Code/Tests/Static/910_Validate_Repository_Privacy.py `
            --repository-root . `
            --self-test
          if ($LASTEXITCODE -ne 0) {
            throw 'Repository privacy self-test failed.'
          }

          $archivePath = Join-Path $env:RUNNER_TEMP 'SQL_Server_Analyze.zip'
          try {
            & git archive `
              --format=zip `
              --prefix=SQL_Server_Analyze/ `
              --output=$archivePath `
              HEAD
            if ($LASTEXITCODE -ne 0) {
              throw 'Delivery ZIP creation failed.'
            }

            & $env:PYTHON_COMMAND ./Code/Tests/Static/910_Validate_Repository_Privacy.py `
              --repository-root . `
              --archive-path $archivePath
            if ($LASTEXITCODE -ne 0) {
              throw 'Repository or Windows delivery ZIP privacy validation failed.'
            }
          }
          finally {
            if (Test-Path -LiteralPath $archivePath) {
              Remove-Item -LiteralPath $archivePath -Force
            }
          }

      - name: Validate standalone installer contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($contract in @(
              './Code/Tests/Integration/191_Standalone_Installer_Contract.ps1',
              './Code/Tests/Integration/192_ExecutionPlanAnalysis_Installer_Contract.ps1',
              './Code/Tests/Integration/194_SnapshotBaseline_Installer_Contract.ps1'
            )) {
            & pwsh -NoLogo -NoProfile -File $contract
            if ($LASTEXITCODE -ne 0) {
              throw "Installer contract failed: $contract"
            }
          }

      - name: Validate LAB repository contracts
        shell: pwsh
        env:
          PYTHON_COMMAND: ${{ steps.toolchain.outputs.python }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./Lab/Validation/Invoke-LabValidation.ps1
          if (-not $?) {
            throw 'LAB repository validation failed on the Windows runner.'
          }

      - name: Publish validation summary
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          @(
            '## Windows self-hosted validation',
            '',
            "Status: ``$env:JOB_STATUS``",
            '',
            'Scope: Windows toolchain, PowerShell parsing, repository and ZIP privacy, installer generation, and LAB repository contracts.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  sql-runtime:
    name: SQL Server runtime on Windows
    needs: validate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    env:
      TEST_DATABASE: SQLServerAnalyzeTest_Windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Detect SQL Server instance
        id: detect-sql
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Locate sqlcmd
          $sqlcmdCandidates = @(
            'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\SQLCMD.EXE'
            'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SQLCMD.EXE'
          )
          $sqlcmd = $null
          foreach ($pattern in $sqlcmdCandidates) {
            $found = Get-Item -Path $pattern -ErrorAction SilentlyContinue |
              Sort-Object { [regex]::Match($_.FullName, '\\(\d+)\\').Groups[1].Value } -Descending |
              Select-Object -First 1
            if ($null -ne $found) {
              $sqlcmd = $found.FullName
              break
            }
          }
          if ($null -eq $sqlcmd) {
            # Fallback: try PATH
            $pathCmd = Get-Command sqlcmd.exe -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $pathCmd) {
              $sqlcmd = $pathCmd.Source
            }
          }
          if ($null -eq $sqlcmd) {
            Write-Warning 'sqlcmd.exe not found. SQL runtime tests will be skipped.'
            "available=false" >> $env:GITHUB_OUTPUT
            return
          }
          Write-Output "Found sqlcmd: $sqlcmd"

          # Test connectivity with Windows Auth
          $versionQuery = "SET NOCOUNT ON; SELECT CONVERT(varchar(128),SERVERPROPERTY(N'ProductVersion'));"
          $versionOutput = & $sqlcmd -S localhost -E -h -1 -W -b -Q $versionQuery 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Cannot connect to SQL Server on localhost: $versionOutput"
            "available=false" >> $env:GITHUB_OUTPUT
            return
          }
          $productVersion = ($versionOutput | Where-Object { $_ -match '^\d+\.' }) | Select-Object -First 1
          $productVersion = $productVersion.Trim()
          $majorVersion = [int]($productVersion.Split('.')[0])
          if ($majorVersion -lt 15) {
            Write-Warning "SQL Server version $productVersion is below minimum (15.x/2019). Skipping."
            "available=false" >> $env:GITHUB_OUTPUT
            return
          }

          # Detect collation
          $collationQuery = "SET NOCOUNT ON; SELECT CONVERT(sysname,SERVERPROPERTY(N'Collation'));"
          $serverCollation = (& $sqlcmd -S localhost -E -h -1 -W -b -Q $collationQuery 2>&1 |
            Where-Object { $_ -match '^[A-Za-z]' }) | Select-Object -First 1
          $serverCollation = $serverCollation.Trim()

          Write-Output "SQL Server version: $productVersion"
          Write-Output "Server collation: $serverCollation"
          "available=true" >> $env:GITHUB_OUTPUT
          "sqlcmd=$sqlcmd" >> $env:GITHUB_OUTPUT
          "product_version=$productVersion" >> $env:GITHUB_OUTPUT
          "major_version=$majorVersion" >> $env:GITHUB_OUTPUT
          "server_collation=$serverCollation" >> $env:GITHUB_OUTPUT

      - name: Prepare isolated SQL files
        if: steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolatedPath = Join-Path $env:RUNNER_TEMP 'Code'
          if (Test-Path $isolatedPath) { Remove-Item $isolatedPath -Recurse -Force }
          Copy-Item -Path ./Code -Destination $isolatedPath -Recurse
          Get-ChildItem -Path $isolatedPath -Recurse -Filter '*.sql' |
            ForEach-Object {
              $content = [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8)
              $content = $content.Replace('[DeineDatenbank]', "[$env:TEST_DATABASE]")
              [IO.File]::WriteAllText($_.FullName, $content, [Text.Encoding]::UTF8)
            }

      - name: Create test database
        if: steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        env:
          SQLCMD: ${{ steps.detect-sql.outputs.sqlcmd }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dropCreate = @"
          IF DB_ID(N'$env:TEST_DATABASE') IS NOT NULL
          BEGIN
              ALTER DATABASE [$env:TEST_DATABASE] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
              DROP DATABASE [$env:TEST_DATABASE];
          END
          CREATE DATABASE [$env:TEST_DATABASE] COLLATE SQL_Latin1_General_CP1_CS_AS;
          ALTER DATABASE [$env:TEST_DATABASE] SET QUERY_STORE = ON;
          "@
          & $env:SQLCMD -S localhost -E -b -Q $dropCreate
          if ($LASTEXITCODE -ne 0) { throw 'Test database creation failed.' }
          Write-Output "Database $env:TEST_DATABASE created."

      - name: Install framework
        if: steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        env:
          SQLCMD: ${{ steps.detect-sql.outputs.sqlcmd }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installSql = Join-Path $env:RUNNER_TEMP 'Code/Install/Install_All.sql'
          $installLog = Join-Path $env:RUNNER_TEMP 'install.log'
          & $env:SQLCMD -S localhost -E -b -i $installSql > $installLog 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output '--- Installation failed. Error excerpt: ---'
            Get-Content $installLog -Tail 60 | Select-String -Pattern 'Msg \d+|Error|THROW' | Select-Object -First 20
            Get-Content $installLog -Tail 40
            throw 'Framework installation failed on Windows.'
          }
          Write-Output 'Framework installation succeeded on Windows.'

      - name: Run smoke test
        if: steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        env:
          SQLCMD: ${{ steps.detect-sql.outputs.sqlcmd }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeSql = Join-Path $env:RUNNER_TEMP 'Code/Tests/Integration/110_Smoke_Test.sql'
          $smokeLog = Join-Path $env:RUNNER_TEMP 'smoke.log'
          & $env:SQLCMD -S localhost -E -b -i $smokeSql > $smokeLog 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output '--- Smoke test failed ---'
            Get-Content $smokeLog -Tail 60
            throw 'Smoke test failed on Windows.'
          }
          Write-Output 'Smoke test passed on Windows.'

      - name: Run release gate tests
        if: steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        env:
          SQLCMD: ${{ steps.detect-sql.outputs.sqlcmd }}
          MAJOR_VERSION: ${{ steps.detect-sql.outputs.major_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testsDir = Join-Path $env:RUNNER_TEMP 'Code/Tests/Integration'
          $gateLog = Join-Path $env:RUNNER_TEMP 'release-gate.log'

          # Select the correct release gate for the detected version
          $gateFile = switch ([int]$env:MAJOR_VERSION) {
            15 { '120_Release_Gate_Tests_2019.sql' }
            16 { '130_Release_Gate_Tests_2022.sql' }
            17 { '140_Release_Gate_Tests_2025.sql' }
            default {
              Write-Warning "No release gate defined for major version $env:MAJOR_VERSION. Running smoke only."
              $null
            }
          }
          if ($null -eq $gateFile) { return }

          $gatePath = Join-Path $testsDir $gateFile
          if (-not (Test-Path $gatePath)) {
            Write-Warning "Release gate file $gateFile not found. Skipping."
            return
          }

          & $env:SQLCMD -S localhost -E -b -i $gatePath > $gateLog 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "--- Release gate ($gateFile) failed ---"
            Get-Content $gateLog | Select-String -Pattern 'RELEASE_GATE' | Select-Object -Last 20
            Get-Content $gateLog -Tail 60
            throw "Release gate ($gateFile) failed on Windows."
          }
          Write-Output "Release gate ($gateFile) passed on Windows."

      - name: Cleanup test database
        if: always() && steps.detect-sql.outputs.available == 'true'
        shell: pwsh
        env:
          SQLCMD: ${{ steps.detect-sql.outputs.sqlcmd }}
        run: |
          $dropSql = @"
          IF DB_ID(N'$env:TEST_DATABASE') IS NOT NULL
          BEGIN
              ALTER DATABASE [$env:TEST_DATABASE] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
              DROP DATABASE [$env:TEST_DATABASE];
          END
          "@
          & $env:SQLCMD -S localhost -E -b -Q $dropSql 2>&1 | Out-Null

      - name: Publish runtime summary
        if: always()
        shell: pwsh
        env:
          SQL_AVAILABLE: ${{ steps.detect-sql.outputs.available }}
          PRODUCT_VERSION: ${{ steps.detect-sql.outputs.product_version }}
          SERVER_COLLATION: ${{ steps.detect-sql.outputs.server_collation }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if ($env:SQL_AVAILABLE -ne 'true') {
            @(
              '## Windows SQL Server runtime',
              '',
              'SQL Server was not detected on the self-hosted runner.',
              'Runtime tests were **skipped**. This does not constitute evidence.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            return
          }
          @(
            '## Windows SQL Server runtime',
            '',
            "Status: ``$env:JOB_STATUS``",
            '',
            "- SQL Server version: $env:PRODUCT_VERSION",
            "- Server collation: $env:SERVER_COLLATION",
            '- Authentication: Windows (Trusted)',
            "- Test database: $env:TEST_DATABASE",
            '- Framework installation: executed',
            '- Smoke test: executed',
            '- Release gate: executed',
            '',
            'This constitutes Windows SQL Server runtime evidence.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
