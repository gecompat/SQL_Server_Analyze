name: Patch LAB-LS-001 integration

on:
  push:
    branches:
      - agent/lab001-wave4-logshipping-ls001
    paths:
      - '.github/workflows/patch-ls001-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab001-wave4-logshipping-ls001

      - name: Patch scenario integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          scenario_runtime = root / 'Lab/Orchestration/Modules/DiagnosticLab/Private/ScenarioRuntime.ps1'
          content = scenario_runtime.read_text(encoding='utf-8')
          old = """        [pscustomobject] @{
                      Category = 'PERFORMANCE'
                      Directory = Join-Path (
                          $script:DiagnosticLabRoot
                      ) \"Scenarios/Performance/$ScenarioId\"
                  }
              )
          """.replace('          ', '')
          new = """        [pscustomobject] @{
                      Category = 'PERFORMANCE'
                      Directory = Join-Path (
                          $script:DiagnosticLabRoot
                      ) \"Scenarios/Performance/$ScenarioId\"
                  }
                  [pscustomobject] @{
                      Category = 'INFRASTRUCTURE'
                      Directory = Join-Path (
                          $script:DiagnosticLabRoot
                      ) \"Scenarios/Infrastructure/$ScenarioId\"
                  }
              )
          """.replace('          ', '')
          if old not in content:
              raise SystemExit('ScenarioRuntime location block not found.')
          scenario_runtime.write_text(content.replace(old, new), encoding='utf-8')

          invoke_path = root / 'Lab/Orchestration/Modules/DiagnosticLab/Public/Invoke-LabScenario.ps1'
          content = invoke_path.read_text(encoding='utf-8')
          old = """    $contract = Get-LabScenarioContract -ScenarioId $ScenarioId
              $paths = Initialize-LabRunState `
          """.replace('          ', '')
          new = """    $contract = Get-LabScenarioContract -ScenarioId $ScenarioId
              if ($contract.Category -eq 'INFRASTRUCTURE') {
                  return Invoke-LabInfrastructureScenario `
                      -LabRunId $LabRunId `
                      -ScenarioId $ScenarioId `
                      -Contract $contract `
                      -StateRoot $StateRoot
              }
              $paths = Initialize-LabRunState `
          """.replace('          ', '')
          if old not in content:
              raise SystemExit('Invoke-LabScenario dispatch block not found.')
          invoke_path.write_text(content.replace(old, new), encoding='utf-8')

          test_path = root / 'Lab/Orchestration/Modules/DiagnosticLab/Public/Test-LabScenario.ps1'
          content = test_path.read_text(encoding='utf-8')
          old = """    $cleanupIsValid = if ($contract.Category -eq 'PERFORMANCE') {
                  if ($contract.Runbook.RuntimeAction -eq 'CONTRACT_FIXTURE') {
                      $result.CleanupStatus -eq 'NOT_REQUIRED'
                  }
                  else {
                      $result.CleanupStatus -eq 'PASS'
                  }
              }
              else {
                  $result.CleanupStatus -eq 'NOT_REQUIRED'
              }
          """.replace('          ', '')
          new = """    $cleanupIsValid = if ($contract.Category -eq 'PERFORMANCE') {
                  if ($contract.Runbook.RuntimeAction -eq 'CONTRACT_FIXTURE') {
                      $result.CleanupStatus -eq 'NOT_REQUIRED'
                  }
                  else {
                      $result.CleanupStatus -eq 'PASS'
                  }
              }
              elseif ($contract.Category -eq 'INFRASTRUCTURE') {
                  $result.CleanupStatus -eq 'PASS'
              }
              else {
                  $result.CleanupStatus -eq 'NOT_REQUIRED'
              }
          """.replace('          ', '')
          if old not in content:
              raise SystemExit('Test-LabScenario cleanup block not found.')
          test_path.write_text(content.replace(old, new), encoding='utf-8')

          catalog_path = root / 'Lab/Scenarios/Catalog/scenarios.json'
          content = catalog_path.read_text(encoding='utf-8')
          old = """      \"ScenarioId\": \"LAB-LS-001\",
                    \"Title\": \"Log Shipping backup copy and restore lag\",
                    \"EvidenceClass\": \"REAL\",
                    \"PrimaryPlatform\": \"CONTAINER_LINUX\",
                    \"TopologyId\": \"CTR-PAIR\",
                    \"PlannedWave\": 4,
                    \"ImplementationStatus\": \"PLANNED_NOT_IMPLEMENTED\"
          """.replace('          ', '')
          new = old.replace('PLANNED_NOT_IMPLEMENTED', 'IMPLEMENTED_ACTIONS_GATE')
          if old not in content:
              raise SystemExit('LAB-LS-001 catalog object not found.')
          catalog_path.write_text(content.replace(old, new), encoding='utf-8')

          contracts_path = root / 'Lab/Scenarios/Infrastructure/wave4-contracts.csv'
          lines = contracts_path.read_text(encoding='utf-8').splitlines()
          changed = False
          for index, line in enumerate(lines):
              if line.startswith('LAB-LS-001,'):
                  replacement = line.replace(',PLANNED_NOT_IMPLEMENTED,', ',IMPLEMENTED_ACTIONS_GATE,', 1)
                  if replacement == line:
                      raise SystemExit('LAB-LS-001 runtime status field not found.')
                  lines[index] = replacement
                  changed = True
                  break
          if not changed:
              raise SystemExit('LAB-LS-001 contract row not found.')
          contracts_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/patch-ls001-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Lab/Orchestration/Modules/DiagnosticLab/Private/ScenarioRuntime.ps1 \
            Lab/Orchestration/Modules/DiagnosticLab/Public/Invoke-LabScenario.ps1 \
            Lab/Orchestration/Modules/DiagnosticLab/Public/Test-LabScenario.ps1 \
            Lab/Scenarios/Catalog/scenarios.json \
            Lab/Scenarios/Infrastructure/wave4-contracts.csv
          git commit -m 'Integrate LAB-LS-001 scenario runtime'
          git push origin HEAD:agent/lab001-wave4-logshipping-ls001
