name: Windows runner concise capability probe

on:
  pull_request:
    paths:
      - '.github/workflows/windows-runner-capability-short.yml'
      - 'Lab/Validation/Invoke-WindowsRunnerCapabilitySummary.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe concise Windows capabilities
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run capability probe
        shell: pwsh
        run: ./Lab/Validation/Invoke-WindowsRunnerCapabilitySummary.ps1
