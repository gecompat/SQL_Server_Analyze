name: SQL25-005 KEY18 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql25-005-key18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover KEY18 SQL test capabilities
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Check out clean SQL25-005 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Inspect available test tooling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

          foreach ($commandName in @('sqlcmd', 'docker', 'podman', 'python', 'py', 'pwsh', 'powershell')) {
              $command = Get-Command $commandName -ErrorAction SilentlyContinue
              if ($null -eq $command) {
                  Write-Host "TOOL $commandName: NOT_FOUND"
              }
              else {
                  Write-Host "TOOL $commandName: AVAILABLE"
              }
          }

          if (Get-Command docker -ErrorAction SilentlyContinue) {
              try {
                  $dockerVersion = docker version --format 'DOCKER_SERVER {{.Server.Version}}' 2>$null
                  if ($LASTEXITCODE -eq 0) { Write-Host $dockerVersion }
                  else { Write-Host 'DOCKER_DAEMON: UNAVAILABLE' }
              }
              catch { Write-Host 'DOCKER_DAEMON: UNAVAILABLE' }

              try {
                  $containers = docker ps --format 'DOCKER_CONTAINER {{.Image}}|{{.Ports}}' 2>$null
                  if ($LASTEXITCODE -eq 0) {
                      if ($containers) { $containers | ForEach-Object { Write-Host $_ } }
                      else { Write-Host 'DOCKER_CONTAINER: NONE_RUNNING' }
                  }
              }
              catch { Write-Host 'DOCKER_LIST: UNAVAILABLE' }
          }

          if (Get-Command podman -ErrorAction SilentlyContinue) {
              try {
                  $podmanVersion = podman version --format 'PODMAN_VERSION {{.Version}}' 2>$null
                  if ($LASTEXITCODE -eq 0) { Write-Host $podmanVersion }
                  else { Write-Host 'PODMAN_RUNTIME: UNAVAILABLE' }
              }
              catch { Write-Host 'PODMAN_RUNTIME: UNAVAILABLE' }

              try {
                  $containers = podman ps --format 'PODMAN_CONTAINER {{.Image}}|{{.Ports}}' 2>$null
                  if ($LASTEXITCODE -eq 0) {
                      if ($containers) { $containers | ForEach-Object { Write-Host $_ } }
                      else { Write-Host 'PODMAN_CONTAINER: NONE_RUNNING' }
                  }
              }
              catch { Write-Host 'PODMAN_LIST: UNAVAILABLE' }
          }

          foreach ($port in 14331..14339) {
              try {
                  $client = New-Object System.Net.Sockets.TcpClient
                  $async = $client.BeginConnect('127.0.0.1', $port, $null, $null)
                  $reachable = $async.AsyncWaitHandle.WaitOne(1000, $false)
                  if ($reachable) { $client.EndConnect($async) }
                  $client.Close()
                  Write-Host "TCP 127.0.0.1:$port = $reachable"
              }
              catch {
                  Write-Host "TCP 127.0.0.1:$port = False"
              }
          }

      - name: Validate repository-only SQL25-005 contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($null -eq $python) {
              $python = Get-Command py -ErrorAction SilentlyContinue
          }
          if ($null -eq $python) {
              throw 'Python is required for repository static validation on KEY18.'
          }
          & $python.Source .\Code\Tests\Static\905_Validate_Analysis_Navigator.py --repository-root .
          & $python.Source .\Code\Tests\Static\930_Validate_Commit_Message.py --repository-root . --delivery-mode DIRECT_GIT --self-test
