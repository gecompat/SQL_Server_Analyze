name: SQL25-005 remote runner validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql25-005-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover SQL_Analyze runner capabilities
    runs-on: [self-hosted, SQL_Analyze]
    timeout-minutes: 15

    steps:
      - name: Inspect available test tooling
        shell: cmd
        continue-on-error: true
        run: |
          @echo off
          echo RUNNER_NAME=%RUNNER_NAME%
          ver
          where sqlcmd >nul 2>nul && echo TOOL sqlcmd: AVAILABLE || echo TOOL sqlcmd: NOT_FOUND
          where docker >nul 2>nul && echo TOOL docker: AVAILABLE || echo TOOL docker: NOT_FOUND
          where podman >nul 2>nul && echo TOOL podman: AVAILABLE || echo TOOL podman: NOT_FOUND
          where pwsh >nul 2>nul && echo TOOL pwsh: AVAILABLE || echo TOOL pwsh: NOT_FOUND
          where powershell >nul 2>nul && echo TOOL powershell: AVAILABLE || echo TOOL powershell: NOT_FOUND

          where docker >nul 2>nul && docker version --format "DOCKER_SERVER {{.Server.Version}}" 2>nul || echo DOCKER_DAEMON: UNAVAILABLE
          where podman >nul 2>nul && podman version --format "PODMAN_VERSION {{.Version}}" 2>nul || echo PODMAN_RUNTIME: UNAVAILABLE
          exit /b 0

  static:
    name: Validate SQL25-005 repository contracts on SQL_Analyze
    needs: discover
    runs-on: [self-hosted, SQL_Analyze]
    timeout-minutes: 20

    steps:
      - name: Check out clean SQL25-005 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enforce SQL_Analyze label for self-hosted workflows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $violations = Get-ChildItem -LiteralPath .github/workflows -Filter '*.yml' -File |
              ForEach-Object {
                  $path = $_.FullName
                  $lines = Get-Content -LiteralPath $path -Encoding UTF8
                  for ($index = 0; $index -lt $lines.Count; $index++) {
                      if ($lines[$index] -match 'runs-on:.*self-hosted' -and $lines[$index] -notmatch 'SQL_Analyze') {
                          [pscustomobject]@{ Path = $_.Name; Line = $index + 1 }
                      }
                  }
              }
          if ($violations) {
              $violations | Format-Table -AutoSize
              throw 'Self-hosted workflow without required SQL_Analyze label.'
          }

      - name: Validate repository-only SQL25-005 contracts in Python container
        shell: cmd
        run: |
          @echo off
          docker run --rm -v "%CD%:/workspace" -w /workspace python:3.12-slim python ./Code/Tests/Static/905_Validate_Analysis_Navigator.py --repository-root . || exit /b 1
          docker run --rm -v "%CD%:/workspace" -w /workspace python:3.12-slim python ./Code/Tests/Static/930_Validate_Commit_Message.py --repository-root . --delivery-mode DIRECT_GIT --self-test || exit /b 1

  runtime:
    name: Validate SQL Server 2019 2022 2025 on SQL_Analyze
    needs: static
    runs-on: [self-hosted, SQL_Analyze]
    timeout-minutes: 240

    steps:
      - name: Check out clean SQL25-005 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run controlled Docker release matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:RUNNER_NAME"
          & .\Code\Tests\Automation\Invoke-Sql25ReplicaMatrix.ps1
