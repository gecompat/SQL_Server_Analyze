name: SQL25-005 KEY18 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql25-005-key18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover KEY18 SQL test capabilities
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Inspect available test tooling
        shell: cmd
        continue-on-error: true
        run: |
          @echo off
          ver
          where sqlcmd >nul 2>nul && echo TOOL sqlcmd: AVAILABLE || echo TOOL sqlcmd: NOT_FOUND
          where docker >nul 2>nul && echo TOOL docker: AVAILABLE || echo TOOL docker: NOT_FOUND
          where podman >nul 2>nul && echo TOOL podman: AVAILABLE || echo TOOL podman: NOT_FOUND
          where python >nul 2>nul && echo TOOL python: AVAILABLE || echo TOOL python: NOT_FOUND
          where py >nul 2>nul && echo TOOL py: AVAILABLE || echo TOOL py: NOT_FOUND
          where pwsh >nul 2>nul && echo TOOL pwsh: AVAILABLE || echo TOOL pwsh: NOT_FOUND
          where powershell >nul 2>nul && echo TOOL powershell: AVAILABLE || echo TOOL powershell: NOT_FOUND

          where docker >nul 2>nul && docker version --format "DOCKER_SERVER {{.Server.Version}}" 2>nul || echo DOCKER_DAEMON: UNAVAILABLE
          where docker >nul 2>nul && docker ps --format "DOCKER_CONTAINER {{.Image}}^|{{.Ports}}" 2>nul || echo DOCKER_LIST: UNAVAILABLE

          where podman >nul 2>nul && podman version --format "PODMAN_VERSION {{.Version}}" 2>nul || echo PODMAN_RUNTIME: UNAVAILABLE
          where podman >nul 2>nul && podman ps --format "PODMAN_CONTAINER {{.Image}}^|{{.Ports}}" 2>nul || echo PODMAN_LIST: UNAVAILABLE

          powershell -NoProfile -NonInteractive -Command "$ports=14331..14339; foreach($p in $ports){$c=New-Object Net.Sockets.TcpClient; try{$a=$c.BeginConnect('127.0.0.1',$p,$null,$null); $r=$a.AsyncWaitHandle.WaitOne(1000,$false); if($r){$c.EndConnect($a)}}catch{$r=$false}finally{$c.Close()}; Write-Host ('TCP 127.0.0.1:{0} = {1}' -f $p,$r)}"
          exit /b 0

  static:
    name: Validate SQL25-005 repository contracts on KEY18
    needs: discover
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out clean SQL25-005 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate repository-only SQL25-005 contracts in Python container
        shell: cmd
        run: |
          @echo off
          docker run --rm -v "%CD%:/workspace" -w /workspace python:3.12-slim python ./Code/Tests/Static/905_Validate_Analysis_Navigator.py --repository-root . || exit /b 1
          docker run --rm -v "%CD%:/workspace" -w /workspace python:3.12-slim python ./Code/Tests/Static/930_Validate_Commit_Message.py --repository-root . --delivery-mode DIRECT_GIT --self-test || exit /b 1

  runtime:
    name: Validate SQL Server 2019 2022 2025 on KEY18
    needs: static
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Check out clean SQL25-005 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run controlled Docker release matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Code\Tests\Automation\Invoke-Sql25ReplicaMatrix.ps1
