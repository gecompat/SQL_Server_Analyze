name: QuickStart privacy diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/quickstart-privacy-diagnostic.yml'
      - 'QuickStart/**'
      - 'Metadata/Quality/Repository_Privacy_Allowlist.csv'
  push:
    branches:
      - 'agent/quickstart-docker-safe-setup'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Capture privacy findings
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 ./Code/Tests/Static/910_Validate_Repository_Privacy.py --repository-root . \
            > "$RUNNER_TEMP/repository-privacy-findings.txt" 2>&1
          status=$?
          echo "validator_exit_code=$status" >> "$RUNNER_TEMP/repository-privacy-findings.txt"
          exit 0
      - name: Upload privacy findings
        uses: actions/upload-artifact@v6
        with:
          name: quickstart-repository-privacy-findings
          path: ${{ runner.temp }}/repository-privacy-findings.txt
          retention-days: 1
